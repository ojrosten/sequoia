name: tests

# The one place that knows how to build and run sequoia. coarse, fine and rigorous
# are callers differing only in which columns they ask for and what they pass the
# runner, so the tiers cannot drift apart in how they build.
#
# The tiers are ordered by strictness, not by containment: fine and rigorous replace
# coarse's plain columns with sanitized ones rather than adding to them. A tier must
# be at least as strict as the one below, or a pass at one says nothing about the
# next.
on:
  workflow_call:
    inputs:
      columns:
        description: 'JSON array of matrix entries: name, os, configure, build, cc/cxx where the preset takes them from the environment, pkg where the apt package providing the compiler is not spelt like the binary (clang++ comes from clang; g++-15 is its own package), and optionally exec_args, repeat_args and advisory, explained where they are read.'
        required: true
        type: string
      exec_args:
        description: 'Arguments for the test executable, via the EXEC_ARGS cache variable. Semicolon-separated for more than one.'
        required: false
        type: string
        default: ''
      repeat_args:
        description: 'Arguments for a second run of the test executable on the built tree, after the first; empty for none. In practice `locate N` minus the end-to-end test, which is nine-tenths of a run. A column may carry its own, replacing the tier''s, as with exec_args.'
        required: false
        type: string
        default: ''
      warnings_as_errors:
        description: 'Fail the build on any compiler warning. The gating tiers set this; the reporting tier counts them instead.'
        required: false
        type: boolean
        default: false
      needs_testing:
        description: 'Whether the change touches anything the suite reads: `true` or `false`, from scope.yml. Anything else fails every column.'
        required: true
        type: string
      false_negative:
        description: 'Corrupt the checkout so that every column MUST go red, one versioned output and one prediction. The control for the gate itself: a run in this mode that comes back green means the gate cannot see. Roadmap item 148.'
        required: false
        type: boolean
        default: false
      suite_timeout_minutes:
        description: 'How long one pass of the suite may run before the step is killed; a repeat pass gets the same again. The tiers run it once; statistical runs it N times over in one pass.'
        required: false
        type: number
        default: 30
      job_timeout_minutes:
        description: 'How long a column may take in all, build included.'
        required: false
        type: number
        default: 90

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    strategy:
      # Every column reports. Cancelling the rest on the first red would collect
      # one answer where the point is to collect all of them.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.columns) }}

    # bash everywhere, Windows included, so one set of steps serves every column
    # rather than each acquiring a shell dialect of its own.
    defaults:
      run:
        shell: bash

    # How long before a suite step's timeout its watcher records what the suite
    # is doing; "Run the suite" says why. Each snapshot records when it began
    # and ended, which says whether the margin is generous or tight.
    env:
      SNAPSHOT_MARGIN_MINUTES: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # docs/ is ~96MB of committed doxygen render; nothing here reads it.
          fetch-depth: 1

      # Every column runs whatever changed, so that its check always reports;
      # scope.yml says why. Every step after this one is conditional on
      # `needs_testing`, so a column with nothing to test passes in seconds.
      #
      # The conditions test for `true`, so any other answer skips the suite. This
      # step therefore insists the answer is exactly `false`: an empty one, from a
      # decision that failed or an output renamed in scope.yml, fails the column
      # rather than passing it untested. The audit below reads this step back.
      - name: Nothing to test
        if: inputs.needs_testing != 'true'
        env:
          ANSWER: ${{ inputs.needs_testing }}
        run: |
          if [ "$ANSWER" != false ]; then
            echo "::error::needs_testing is '$ANSWER', neither true nor false: scope.yml's answer did not arrive"
            exit 1
          fi
          echo "Nothing to test; the scope job's summary says why."

      # Two corruptions, because the columns do not share a detector. The summary
      # file is rewritten by every toolchain, so appending to it is drift wherever
      # `--check-versioned-output` is on; the prediction is what StreamingFreeTest
      # compares its output against, so rewriting it is a soft failure everywhere,
      # including the column that carries no drift check. Each target is checked
      # to exist first: a control that mutates nothing is the false negative it is
      # meant to catch.
      - name: Corrupt the tree, so that every column must go red
        if: ${{ inputs.false_negative && inputs.needs_testing == 'true' }}
        run: |
          summary=output/TestSummaries/Tests/Core/Meta/type_algorithms_free_test.txt
          prediction=TestMaterials/Streaming/StreamingFreeTest/streaming_free_test/Prediction/Foo.txt
          for f in "$summary" "$prediction"; do
            [ -f "$f" ] || { echo "::error::$f is not where the control expects it"; exit 1; }
          done
          echo "false-negative control: the run must report this line as drift" >> "$summary"
          echo "false-negative control: the test must fail against this" > "$prediction"
          git diff --stat

      # Package presence is tested against `apt-cache pkgnames`, which matches
      # names exactly. `apt-get install` does not: given a name with regex
      # metacharacters that matches no package it treats the name as a regex, so
      # `g++-15` on noble resolves to clang-15, flang-15 and llvm-15, installs all
      # three, and exits 0.
      - name: Install the toolchain (Linux)
        if: inputs.needs_testing == 'true' && runner.os == 'Linux'
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Launchpad is a live dependency of every Linux column, and it fails in
          # more than one shape: a malformed chunked response (PR #19, 2026-09-11)
          # and an HTTP 503 "temporarily unavailable" (2026-09-16), both before any
          # compiler ran. So the add is retried on any non-zero exit - not only a
          # timeout - a bounded number of times with a short back-off. Nothing
          # else is retried. The `apt-get update` below fetches the PPA's index from
          # Launchpad too, and a failure there is loud - apt exits 100, or the
          # compiler check after it fires - but is not yet a shape that has been
          # seen; the two above were both in the add.
          for attempt in 1 2 3 4; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
            [ "$attempt" -lt 4 ] || { echo "::error::add-apt-repository failed on all $attempt attempts"; exit 1; }
            echo "add-apt-repository failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          sudo apt-get update -qq
          # The compiler binary and the package providing it are not the same string:
          # g++-15 is both, but clang++ is shipped by `clang`. A column may therefore
          # name the package separately, defaulting to the binary where they agree.
          # gdb is for the stacks in a hung suite's snapshot; the image has none.
          for pkg in "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev gdb; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev gdb
          # The hosted image's CMake is below sequoia's floor of 4.2, the release that added
          # CMAKE_INTERMEDIATE_DIR_STRATEGY; the Windows presets set it in
          # build_system/ShortObjectPaths.cmake. The macOS and Windows images ship a release above
          # the floor, so this column fetches one from Kitware - the host the checkout already
          # comes from - and puts it first on PATH. An older cmake surviving this step is loud:
          # the configure step's cmake_minimum_required refuses it. The tarball has no apt
          # signature behind it, so its checksum is pinned.
          #
          # Repeated in rigorous.yml's coverage job; change both.
          cmake_version=4.4.3
          cmake_sha256=d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc
          cmake_tarball=$RUNNER_TEMP/cmake.tar.gz
          cmake_url=https://github.com/Kitware/CMake/releases/download/v$cmake_version/cmake-$cmake_version-linux-x86_64.tar.gz
          if [ "$(uname -m)" != x86_64 ]; then echo "::error::No CMake build is fetched for $(uname -m)"; exit 1; fi
          if ! curl -fsSL -o "$cmake_tarball" "$cmake_url"; then echo "::error::CMake $cmake_version could not be fetched from Kitware's release page"; exit 1; fi
          if ! echo "$cmake_sha256  $cmake_tarball" | sha256sum --check --quiet; then echo "::error::The CMake tarball does not match its published checksum"; exit 1; fi
          tar -xzf "$cmake_tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-$cmake_version-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # A macOS column carries `--exclude-performance` as the Windows ones do: it is
      # the suite's timing assertions, not the rest of it, which a hosted runner
      # cannot hold.
      - name: Install the toolchain (macOS)
        if: inputs.needs_testing == 'true' && runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list tbb   >/dev/null 2>&1 || brew install tbb
          brew list llvm  >/dev/null 2>&1 || brew install llvm
          echo "CC=$(brew --prefix llvm)/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      # With the Visual Studio generator CMake finds the toolset itself; with Ninja
      # it looks for cl.exe on PATH, which nothing puts there. vcvars sets it, but
      # only within the cmd session that runs it, so its effect is captured and
      # handed forward: named variables rather than a whole `set` dump, so this
      # cannot silently clobber the runner's own environment, and PATH through
      # GITHUB_PATH, the route the runner provides for it, in Windows form, which
      # is what a later bash step's start-up translates.
      - name: Enter the MSVC environment (Windows, Ninja)
        if: inputs.needs_testing == 'true' && runner.os == 'Windows' && matrix.configure == 'msvc-ninja'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          root=$("$vswhere" -latest -products '*' \
                   -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                   -property installationPath)
          [ -n "$root" ] || { echo "::error::no VC toolset reported by vswhere"; exit 1; }
          vcvars="$(cygpath -u "$root")/VC/Auxiliary/Build/vcvars64.bat"
          [ -f "$vcvars" ] || { echo "::error::$vcvars does not exist"; exit 1; }

          # Via a batch file in RUNNER_TEMP rather than `cmd //c "call ... && set"`:
          # Git bash's MSYS layer re-quotes an argument containing spaces and
          # quotes, and cmd then sees the escaping literally. The wrapper's own
          # path has no spaces, so there is nothing left to mangle.
          bat="$RUNNER_TEMP/vcvars_dump.bat"
          printf '@echo off\r\necho PATH_BEFORE=%%PATH%%\r\ncall "%s" >nul || exit /b 1\r\nset\r\n' "$(cygpath -w "$vcvars")" > "$bat"
          dump=$(cmd //c "$(cygpath -w "$bat")" | tr -d '\r')
          printf '%s\n' "$dump" | grep -iE '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=' >> "$GITHUB_ENV"

          # Only what vcvars added. Forwarding its whole PATH would prepend the
          # runner's own entries over themselves in a new order, and the first run
          # of this step did exactly that: WindowsApps came to precede Git\bin, so
          # `shell: bash` resolved to the WSL stub for every step after this one.
          #
          # And not the CMake and Ninja Visual Studio bundles, which the forwarded
          # entries would otherwise put ahead of the image's: this column builds
          # with the same cmake as the msbuild columns, so that a red run here asks
          # about the generator and nothing else. Whether sequoia builds under the
          # bundled toolset is a question for a matrix row of its own.
          before=$(printf '%s\n' "$dump" | grep '^PATH_BEFORE=' | sed 's/^[^=]*=//' | tr ';' '\n')
          after=$(printf '%s\n' "$dump"  | grep -iE '^PATH='     | sed 's/^[^=]*=//' | tr ';' '\n')
          added=$(printf '%s\n' "$after" | grep -vxF -f <(printf '%s\n' "$before") | grep -v '^$' | grep -vF 'CommonExtensions\Microsoft\CMake\')
          printf '%s\n' "$added"
          printf '%s\n' "$added" >> "$GITHUB_PATH"

          # GITHUB_PATH reaches later steps only, so ninja is looked for where a later
          # step will: the forwarded entries, then this step's own PATH.
          PATH="$(cygpath -pu "$(printf '%s\n' "$added" | paste -sd ';')"):$PATH" command -v ninja \
            || { echo "no ninja on the forwarded PATH or the image's; installing one"; choco install ninja -y; }

      # An exit status says the tool ran, not that it did what was asked.
      - name: Report the toolchain actually in use
        if: inputs.needs_testing == 'true'
        run: |
          if [ -n "${CXX:-}" ]; then
            command -v "$CXX" || { echo "::error::$CXX is not on PATH"; exit 1; }
            "$CXX" --version
          elif [ '${{ matrix.configure }}' = msvc-ninja ]; then
            # Which cl, ninja and cmake the forwarded PATH resolves to, in that order,
            # so the ordering GITHUB_PATH produced is visible rather than assumed.
            for tool in cl ninja cmake; do
              command -v "$tool" || { echo "::error::$tool is not on PATH"; exit 1; }
            done
          else
            echo "No CXX set; the preset selects the compiler (Windows/MSVC)."
          fi
          cmake --version

      # `--version` does not identify the compiler: Ubuntu ships post-release
      # snapshots of a branch under the release's version number, so a g++ reporting
      # 15.2.0 may be well beyond it. The changelog says which. The same is true of
      # a distro clang, so this reads the changelog of whichever package the column
      # installed rather than naming one compiler.
      - name: What the distribution's compiler actually is
        if: inputs.needs_testing == 'true' && runner.os == 'Linux'
        # A report must not be able to fail the job - hence the trailing `|| true`,
        # and `sed` rather than `head`, since head exits early, gzip takes SIGPIPE,
        # and `-o pipefail` would turn a report into a failure.
        run: |
          pkg="${{ matrix.pkg || matrix.cxx }}"
          log=$(dpkg -L "$pkg" 2>/dev/null | grep -m1 'changelog.Debian.gz$' || true)
          if [ -n "$log" ]; then
            zcat "$log" | sed -n '1,20p' || true
          else
            echo "No Debian changelog found for $pkg; $CXX --version above is all we have."
          fi

      # The generated project's `git init` is followed by a commit, and git refuses
      # to commit without an identity. Every developer machine has one configured;
      # a fresh runner does not.
      - name: Give git an identity
        if: inputs.needs_testing == 'true'
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      # Once a generated project vendors a copy of sequoia inside itself, the
      # TestMaterials tree passes 260 characters. sequoia declares itself
      # long-path aware in resources/win/longpaths.manifest, but Windows also
      # requires the machine-wide switch, and git its own.
      #
      # The switch reaches what asks for it - the checkout, git, and sequoia's own
      # binaries through that manifest - and no further. cl.exe refuses a path at
      # 260 whatever the registry says, and MSBuild's file tracker is not
      # long-path aware either, so the compiler's side of this is held under the
      # limit rather than allowed past it: build_system/ShortObjectPaths.cmake
      # hashes the object paths, and UntrackedTryCompiles.cmake keeps the tracker
      # away from the probes whose logs would be longest.
      #
      # In PowerShell because Git bash's MSYS layer rewrites bare switches like
      # /v and /f into Windows paths before reg.exe sees them.
      - name: Let Windows and git see long paths
        if: inputs.needs_testing == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled

      # A suite that crashes ends with an exit status and nothing else: rigorous's Windows
      # Release column, 2026-09-29, died with 0xC0000409 three seconds in and printed
      # nothing. So a crash leaves a dump, and "Report any crash" prints its stacks:
      #   - Windows: Windows Error Reporting's LocalDumps, for every process, with its
      #     dialogs off (DontShowUI), since nobody is there to dismiss one;
      #   - Linux: the kernel's core pattern, pointed into RUNNER_TEMP; each suite step
      #     raises its own core size limit, since a limit set in one step does not carry to
      #     the next, and records it for "Report any crash" to check;
      #   - macOS: nothing to arrange, since the system writes a crash report itself.
      # A control crash then checks that the arrangement took. A control which leaves
      # nothing makes the step warn rather than fail, since a job whose dumps are lost can
      # still test; without the control, a suite's crash with no dump would be reported as
      # no crash at all. The since file, written after the control's dump, is what every
      # dump is compared against.
      #
      # On Windows the control does not check the process's error mode. GitHub's runner
      # starts every process of a job with a mode under which a crash never reaches Windows
      # Error Reporting, and the control's FailFast ignores the mode. sequoia's test runner
      # clears it for a run (windows_crash_report_enabler), which
      # failure_reporting_in_parallel_free_test checks.
      #
      # The registry is written by PowerShell, as in the step above, since Git bash's MSYS
      # layer rewrites reg.exe's switches.
      - name: Ask Windows Error Reporting for dumps
        if: inputs.needs_testing == 'true' && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-ItemProperty -Path $wer -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null
          New-Item -Path "$wer\LocalDumps" -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpCount -Value 10 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path "$wer\LocalDumps"

      - name: Let a crash leave a dump
        if: inputs.needs_testing == 'true'
        timeout-minutes: 3
        run: |
          dumps="$RUNNER_TEMP/dumps"
          mkdir -p "$dumps"
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command "[Environment]::FailFast('A control crash')" || true
              control_pattern='*.dmp' ;;
            Linux)
              # %e, the name the kernel keeps, rather than %E, the whole path: a core whose name
              # would pass 255 bytes is not written, and the end-to-end test's executables lie
              # deep. report_crashes.sh recovers the path from the core.
              sudo sysctl -q -w "kernel.core_pattern=$dumps/core.%e.%p"
              (ulimit -c unlimited; bash -c 'kill -SEGV $$') || true
              control_pattern='core.*' ;;
            macOS)
              bash -c 'kill -SEGV $$' || true
              control_pattern= ;;
          esac

          found=
          for attempt in $(seq 1 30); do
            if [ -n "$control_pattern" ]; then
              found=$(find "$dumps" -maxdepth 1 -name "$control_pattern" | head -1 || true)
            else
              found=$(find "$HOME/Library/Logs/DiagnosticReports" -newer "$dumps" -name 'bash*' 2> /dev/null | head -1 || true)
            fi
            [ -z "$found" ] || break
            sleep 1
          done

          if [ -n "$found" ]; then
            echo "The control crash left $found"
          else
            echo "::warning title=No crash dumps::${{ matrix.name }}: a control crash left no dump, so a crash in the suite would be reported without its stacks."
          fi
          sleep 1
          touch "$dumps/since"

      # A column may carry `exec_args` of its own, for a platform which cannot run the
      # whole suite. It replaces the tier's rather than adding to them, so a column
      # taking this route out of a tier which passes `--check-versioned-output` must
      # repeat it.
      - name: Configure
        if: inputs.needs_testing == 'true'
        id: configure
        working-directory: TestAll
        run: |
          # A column's exec_args replaces the tier's. `||` cannot express this: an
          # explicitly empty string is falsy, so a column asking for NO flags would
          # silently inherit the tier's. toJSON distinguishes absent from empty.
          if [ '${{ toJSON(matrix.exec_args) }}' = 'null' ]; then
            args='${{ inputs.exec_args }}'
          else
            args='${{ matrix.exec_args }}'
          fi
          if [ '${{ toJSON(matrix.repeat_args) }}' = 'null' ]; then
            repeat='${{ inputs.repeat_args }}'
          else
            repeat='${{ matrix.repeat_args }}'
          fi
          echo "exec_args=$args" >> "$GITHUB_OUTPUT"
          echo "repeat_args=$repeat" >> "$GITHUB_OUTPUT"
          cmake --preset ${{ matrix.configure }} \
                "-DEXEC_ARGS=$args" \
                -DWARNINGS_AS_ERRORS=${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}

      # Separate from the run below so a compile failure and a test failure are
      # distinguishable, and so the suite can carry its own ceiling. The log is kept
      # so warnings can be counted where they are not fatal.
      - name: Build
        if: inputs.needs_testing == 'true'
        working-directory: TestAll
        run: cmake --build --preset ${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Distinct sites rather than raw lines: gcc and clang repeat a warning once per
      # instantiation, so a raw count says more about templates than about code.
      # MSVC spells it "warning Cnnnn"; the others "warning:".
      - name: Report compiler warnings
        if: ${{ inputs.needs_testing == 'true' && !inputs.warnings_as_errors }}
        run: |
          log="$RUNNER_TEMP/build.log"
          sites=$({ grep -oE '[^ ]+:[0-9]+:[0-9]+: warning:|warning C[0-9]+' "$log" || true; } | sort -u | wc -l | tr -d ' ')
          total=$(grep -cE 'warning:|warning C[0-9]+' "$log" || true)
          if [ "${sites:-0}" -gt 0 ]; then
            echo "::warning title=Compiler warnings::${{ matrix.name }}: $sites distinct site(s), $total line(s)"
            {
              echo "### ${{ matrix.name }}: $sites distinct warning site(s)"
              echo '```'
              grep -E 'warning:|warning C[0-9]+' "$log" | sort -u | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compiler warnings."
          fi

      # A `run-` preset is named `run-` plus the preset it runs, and builds the
      # `run` target, whose command is the test executable; the binary is already
      # built, so this step is the suite and nothing else.
      #
      # timeout-minutes on the step rather than timeout(1) around the command:
      # macOS ships no GNU coreutils, and the step form additionally distinguishes
      # "the suite timed out" from "the job timed out" in the run summary. One
      # branch has already spun for 36 minutes against an 18s baseline.
      # A column may set `advisory: true` to run without gating on the result, for
      # a platform whose failures are understood and being worked on. No tier sets
      # it since 2026-09-22, when coarse's Windows column became fatal; the
      # mechanism stays for the columns the roadmap still owes - clang with
      # libstdc++, clang on Windows, the -Og build - each of which arrives knowing
      # less about itself than this one now does. There is no
      # build-without-running option: a suite that is not run tells you nothing,
      # and the audit below refuses a column whose suite step did not run, unless
      # the change held nothing to test.
      #
      # The tee is safe only because `shell: bash` runs steps under
      # `--noprofile --norc -eo pipefail`: without pipefail the tee would donate its
      # own exit status to the step, which is how a red suite comes to look green.
      # The Build step above already depends on this; it is written down here
      # because the dependency is invisible at the call site.
      #
      # A suite that hangs is killed by the timeout without a word, and the test
      # runner reports a pass only when it ends, so the log cannot say where it stopped;
      # statistical's MSVC ASan column hung this way on 2026-09-26, in its
      # eighteenth trial. So the suite runs under a watcher which, if it is still
      # going SNAPSHOT_MARGIN_MINUTES before the timeout, records the processes
      # and the suite's stacks while they can still be seen, and otherwise
      # passes the suite's exit status straight through. "Keep the run log"
      # reports the snapshot. Not the test runner's `recover` mode, which records
      # each check before it runs but forces serial execution, and so changes the
      # concurrency a hang may depend on. `set -u` because a margin missing from
      # the environment would otherwise read as zero, and the snapshot would be due
      # only when the step is killed.
      - name: Run the suite
        if: inputs.needs_testing == 'true'
        id: suite
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: TestAll
        timeout-minutes: ${{ inputs.suite_timeout_minutes }}
        env:
          SUITE_TIMEOUT_MINUTES: ${{ inputs.suite_timeout_minutes }}
        run: |
          set -u
          if [ "$RUNNER_OS" = Linux ]; then
            ulimit -c unlimited || true
            ulimit -c > "$RUNNER_TEMP/dumps/core-limit" || true
          fi
          deadline=$(( (SUITE_TIMEOUT_MINUTES - SNAPSHOT_MARGIN_MINUTES) * 60 ))
          ../scripts/snapshot_at_deadline.sh "$deadline" "$RUNNER_TEMP/snapshot.txt" TestAll -- \
            cmake --build --preset run-${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/run.log"

      # The second pass, where the column asks for one: the same executable on the
      # same tree with the repeat arguments. Only EXEC_ARGS changes at the
      # reconfigure, so nothing rebuilds; the `run` target's command line is all
      # that changes in what is regenerated, and the cache is read back so the
      # log says what the pass was configured with. The `if:` carries GitHub's
      # implicit success(), so a red first pass skips both steps - a suite that
      # is red once tells you what N more would - and the audit below allows for
      # that; an advisory column's red first pass counts as success, so there the
      # repeat runs. Such a column must not also check the versioned output: the
      # second pass's handler removes the first's patch and then finds the tree
      # already repaired, so the drift would be reported without its patch. No column is
      # advisory today; the pairing stays forbidden for the next one that is, unless
      # the patch is moved aside between the passes.
      - name: Configure the repetitions
        if: ${{ inputs.needs_testing == 'true' && steps.configure.outputs.repeat_args != '' }}
        working-directory: TestAll
        env:
          REPEAT_ARGS: ${{ steps.configure.outputs.repeat_args }}
        run: |
          cmake --preset ${{ matrix.configure }} "-DEXEC_ARGS=$REPEAT_ARGS"
          grep '^EXEC_ARGS:' ../build/TestAll/${{ matrix.configure }}/CMakeCache.txt

      - name: Run the suite again
        if: ${{ inputs.needs_testing == 'true' && steps.configure.outputs.repeat_args != '' }}
        id: repeat
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: TestAll
        timeout-minutes: ${{ inputs.suite_timeout_minutes }}
        env:
          SUITE_TIMEOUT_MINUTES: ${{ inputs.suite_timeout_minutes }}
        run: |
          set -u
          if [ "$RUNNER_OS" = Linux ]; then
            ulimit -c unlimited || true
            ulimit -c > "$RUNNER_TEMP/dumps/core-limit" || true
          fi
          deadline=$(( (SUITE_TIMEOUT_MINUTES - SNAPSHOT_MARGIN_MINUTES) * 60 ))
          ../scripts/snapshot_at_deadline.sh "$deadline" "$RUNNER_TEMP/repeat-snapshot.txt" TestAll -- \
            cmake --build --preset run-${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/repeat.log"

      # An advisory column still has to be *read*, and its failures are not equally acceptable.
      # TestRunnerPerformanceTest asserts absolute wall-clock times - eight 25ms sleeps against a
      # 60ms +- 35 window - which a shared hosted runner cannot hold; the same commit has returned
      # 196ms and 603ms. Everything else is a defect.
      #
      # Classified by the *test that failed*, not by the summary row: those timing assertions are
      # `check(within_tolerance{...}, ...)`, which count in the standard row, since the performance
      # rows count `check_relative_performance` alone. Every failing file is named either way, so a
      # new one cannot hide behind a tolerated one.
      #
      # Drift is a second thing the suite step cannot make red here. Where the column checks the
      # versioned output, a run whose output moved writes the patch and sets the drift bit of its
      # exit code, which `continue-on-error` swallows like any other failure; so the patch's
      # existence is read directly, and raised as an error naming the files it holds. Drift and
      # failure co-fire, a failing test rewriting its summary, so both are reported when both
      # occurred. A failed step that names no test and writes no patch is reported as that.
      - name: Triage the advisory run
        if: ${{ always() && inputs.needs_testing == 'true' && matrix.advisory == true }}
        run: |
          log="$RUNNER_TEMP/run.log"
          if [ ! -f "$log" ]; then
            echo "::error title=Advisory run::${{ matrix.name }}: the suite produced no log"
            exit 0
          fi

          # Tests whose failures are understood and tracked: roadmap items 38 and 102.
          tolerated_tests='TestRunnerPerformanceTest\.cpp'

          failing=$({ grep -oE 'Tests/[A-Za-z0-9/_]+\.cpp, Line [0-9]+' "$log" || true; } \
                      | sed 's/, Line.*//' | sort -u)
          actionable=$({ echo "$failing" | grep -vE "$tolerated_tests" || true; } | sed '/^$/d')

          # Every file in the patch has its `diff --git` header; a removed file has no `+++ b/`
          # line, and a file created or deleted empty has nothing but the header.
          patch=output/Drift/VersionedOutput.patch
          drifted=$({ [ -f "$patch" ] && grep '^diff --git a/' "$patch" | sed 's|^diff --git a/.* b/||'; } || true)

          {
            echo "### ${{ matrix.name }} - advisory run"
            echo ""
            if [ -n "$failing" ]; then
              echo "Failing tests:"
              echo '```'
              echo "$failing"
              echo '```'
            else
              echo "No failing tests."
            fi
            echo ""
            echo '```'
            sed -n '/Grand Totals/,$p' "$log" | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$drifted" ]; then
            echo "::error title=Advisory run needs action::${{ matrix.name }}: versioned output moved: $(echo "$drifted" | tr '\n' ' '). This column does not gate, so the job is green; the patch is on this page, or in the artifact if too big for it."
          fi
          if [ -n "$actionable" ]; then
            echo "::error title=Advisory run needs action::${{ matrix.name }}: $(echo "$actionable" | tr '\n' ' '). This column does not gate, so the job is green; the failures are real."
          elif [ -n "$failing" ]; then
            echo "::warning title=Advisory run::${{ matrix.name }}: only the timing assertions this runner cannot hold (roadmap 38, 102). Nothing to act on."
          elif [ '${{ steps.suite.outcome }}' != 'success' ]; then
            # A suite step that failed without naming a test or writing a patch: a run cut short,
            # a crash, a timeout. Not "passed outright", whatever the log's last lines say.
            echo "::error title=Advisory run needs action::${{ matrix.name }}: the suite step's outcome is '${{ steps.suite.outcome }}' and the log names no failing test and no drift. Read the log."
          elif [ -z "$drifted" ]; then
            echo "::notice title=Advisory run::${{ matrix.name }}: the suite passed outright."
          fi

      # Kept with the artifact so a column can be read after the fact rather than
      # only through the run page, which is what an advisory column needed and what
      # statistical reads back. The step's outcome goes with it:
      # a caller reading the log back cannot otherwise tell a suite that failed
      # in every repetition, whose analysis says "No instabilities detected", from
      # one that passed. So does the snapshot of a suite which outlived its
      # watcher's deadline, printed here as well, so that where a hung suite
      # stopped can be read from the run page.
      - name: Keep the run log
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          mkdir -p run-log
          cp "$RUNNER_TEMP/run.log" run-log/ 2>/dev/null || true
          echo "${{ steps.suite.outcome }}" > run-log/outcome
          cp "$RUNNER_TEMP/repeat.log" run-log/ 2>/dev/null || true
          [ ! -f run-log/repeat.log ] || echo "${{ steps.repeat.outcome }}" > run-log/repeat-outcome
          for snapshot in snapshot repeat-snapshot; do
            if [ -f "$RUNNER_TEMP/$snapshot.txt" ]; then
              cp "$RUNNER_TEMP/$snapshot.txt" run-log/
              echo "::warning title=Suite still running near its timeout::${{ matrix.name }}: the suite was still running $SNAPSHOT_MARGIN_MINUTES minutes before its timeout; run-log/$snapshot.txt, printed below, says what it was doing."
              # Whatever the tools printed is not a workflow command, whatever it begins with.
              token=$(openssl rand -hex 16)
              echo "::stop-commands::$token"
              cat "$RUNNER_TEMP/$snapshot.txt"
              echo "::$token::"
            fi
          done

      # Every crash since "Let a crash leave a dump", with its stacks: an error names the
      # column, the stacks follow on the run page, and the report and any Windows minidumps
      # go into run-log/, which is uploaded. Linux's cores are not kept: they are large, and
      # their stacks are already printed.
      #
      # macOS writes a crash report, and Windows Error Reporting a dump, some seconds after
      # the crash, so after a failed suite this waits for one, up to a bound, since the
      # steps between the suite and this one can take less time than that. Linux writes a
      # core before the process is gone. On Linux, a core limit the suite step could not
      # raise is a warning, since its crash would leave no core. The timeout bounds cdb's
      # downloads of Windows' symbols, and a report which times out does not fail the job.
      - name: Report any crash
        if: ${{ always() && inputs.needs_testing == 'true' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          dumps="$RUNNER_TEMP/dumps"
          if [ ! -f "$dumps/since" ]; then
            echo "No crash report: the dumps were not arranged."
            exit 0
          fi

          if [ "$RUNNER_OS" = Linux ] && [ -f "$dumps/core-limit" ] && [ "$(cat "$dumps/core-limit")" != unlimited ]; then
            echo "::warning title=No cores::${{ matrix.name }}: the suite's core limit was $(cat "$dumps/core-limit"), so a crash would leave no core."
          fi

          if [ "${{ steps.suite.outcome }}" = failure ] || [ "${{ steps.repeat.outcome }}" = failure ]; then
            case "$RUNNER_OS" in
              macOS)   written=("$HOME/Library/Logs/DiagnosticReports" -newer "$dumps/since" -name '*.ips'
                                -exec grep -l '"bug_type":"309"' {} +) ;;
              Windows) written=("$dumps" -maxdepth 1 -newer "$dumps/since" -name '*.dmp') ;;
              *)       written=() ;;
            esac
            if [ ${#written[@]} -gt 0 ]; then
              for attempt in $(seq 1 60); do
                find "${written[@]}" 2> /dev/null | grep -q . && break
                sleep 1
              done
              sleep 2
            fi
          fi

          report="$RUNNER_TEMP/crashes.txt"
          scripts/report_crashes.sh "$dumps" "$dumps/since" > "$report" 2>&1
          count=$(sed -n 's/^Crashes found: //p' "$report")
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error title=Crash::${{ matrix.name }}: $count crash(es); their stacks are below, and in run-log/crashes/."
            mkdir -p run-log/crashes
            cp "$report" run-log/crashes/
            find "$dumps" -maxdepth 1 -newer "$dumps/since" -name '*.dmp' -exec cp {} run-log/crashes/ \;
          fi
          # Whatever the debuggers printed is not a workflow command, whatever it begins with.
          token=crashes-$RANDOM$RANDOM$RANDOM
          echo "::stop-commands::$token"
          cat "$report"
          echo "::$token::"

      # Where drift detection is on, a run whose versioned output moved writes
      # the change to output/Drift/VersionedOutput.patch, one whole-file hunk per
      # file, and this puts it on the run page: whether the change is the PR
      # working or the PR breaking is a judgement made by reading it, and reading
      # it here needs nothing downloaded. `git status` is kept beside it because
      # it sees the whole tree, where the runner sees only the two trees it
      # writes - so a prediction file moving would show here and nowhere else.
      #
      # A step summary over 1 MiB is dropped whole, with the step still green, so a
      # patch too big for the page says where to find it instead. `--whitespace=nowarn`
      # because a whole-file hunk reproduces every trailing space the output has, and
      # `apply.whitespace=fix` in a user's config would strip them silently, applying
      # to a tree the run never wrote. The fence is four backticks so that a line of
      # three in the output cannot close it.
      - name: Report any versioned output that moved
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          git status --short -- output/ TestMaterials/ || true
          patch=output/Drift/VersionedOutput.patch
          if [ -f "$patch" ]; then
            {
              echo "### Versioned output moved: ${{ matrix.name }}"
              echo "Apply from the project root with \`git apply --whitespace=nowarn\`, then read \`git diff\`."
              if [ "$(wc -c < "$patch")" -gt 900000 ]; then
                echo "The patch is $(wc -c < "$patch") bytes, too large for this page: it is in the \`${{ matrix.build }}-drift\` artifact."
              else
                echo '````diff'
                cat "$patch"
                echo '````'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The control's columns go red on a corrupted tree, but red does not say
      # which detector saw it: the prediction corruption fails a test in every
      # column, drift check or none. This holds the drift detector to its own
      # evidence. Where the check is on, the run must have written a patch, and
      # that patch applied in reverse to the tree the run repaired must give back
      # HEAD plus the corruption and nothing else - the one appended line, in the
      # one summary, as the only change under either versioned tree. Where the
      # check is off, there must be no patch. Reversing rather than applying
      # because the tree the patch was taken from is gone: the run rewrote it.
      - name: The drift was reported as a patch which, reversed, restores the corruption
        if: ${{ always() && inputs.needs_testing == 'true' && inputs.false_negative }}
        run: |
          patch=output/Drift/VersionedOutput.patch
          summary=output/TestSummaries/Tests/Core/Meta/type_algorithms_free_test.txt
          case '${{ steps.configure.outputs.exec_args }}' in
            *--check-versioned-output*)
              [ -f "$patch" ] || { echo "::error::the drift check was on and the run wrote no patch"; exit 1; }
              git apply --reverse --whitespace=nowarn "$patch"
              status=$(git status --porcelain -- output/TestSummaries/ output/DiagnosticsOutput/)
              if [ "$status" != " M $summary" ]; then
                echo "::error::reversing the patch did not leave exactly the corrupted summary modified"
                echo "$status"; exit 1
              fi
              if [ "$(git diff --numstat -- "$summary" | cut -f1,2)" != "$(printf '1\t0')" ] \
                 || ! git diff -- "$summary" | grep -qxF '+false-negative control: the run must report this line as drift'; then
                echo "::error::reversing the patch did not reproduce the one appended line"
                git diff -- "$summary"; exit 1
              fi
              git checkout -- "$summary"
              echo "ok    the patch, reversed, restores the corruption and nothing else";;
            *)
              [ ! -f "$patch" ] || { echo "::error::the drift check was off and a patch was written"; exit 1; }
              echo "ok    no drift check, so no patch";;
          esac

      # Every test writes an execution record: its start when it begins, and its execution duration and the
      # runner's overhead when it finishes, whether or not its body threw. A record with no execution duration names a
      # test that was executing when the run ended; such tests are listed oldest start first, since the hung test is
      # likeliest the one that has run longest. The end-to-end test's generated project keeps records of its own. A
      # record older than its run's stamp is from an earlier run, and is marked so. The count comes first: none, after
      # a suite that ran, means the records were not written, or not where this step looks. The names are paths a
      # fork's PR controls, so they are printed with workflow commands stopped.
      - name: Name the tests that started and never finished
        if: ${{ always() && inputs.needs_testing == 'true' }}
        env:
          SUITE: ${{ steps.suite.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
        run: |
          generated=output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/GeneratedProject
          roots="output/ExecutionRecords $generated/output/ExecutionRecords"
          records=$(for root in $roots; do
                      [ ! -d "$root" ] || find "$root" -type f \( -name '*.txt' -o -name run.stamp \)
                    done)
          tests=$(printf '%s\n' "$records" | grep '\.txt$' || true)
          count=$(printf '%s' "$tests" | grep -c . || true)
          echo "execution records found: $count"

          ran=false
          case "$SUITE" in success|failure|cancelled) ran=true;; esac
          succeeded=false
          if [ "$SUITE" = success ] && [ "$REPEAT" != failure ] && [ "$REPEAT" != cancelled ]; then succeeded=true; fi

          started() { sed -n 's/^started //p' "$1"; }
          start_of_run() {
            dir=$(dirname "$1")
            while [ "$dir" != . ] && [ ! -f "$dir/run.stamp" ]; do dir=$(dirname "$dir"); done
            [ ! -f "$dir/run.stamp" ] || started "$dir/run.stamp"
          }
          unfinished=$(printf '%s\n' "$tests" | while IFS= read -r record; do
                         if [ -z "$record" ] || grep -q '^execution duration' "$record"; then continue; fi
                         start=$(started "$record")
                         run_start=$(start_of_run "$record")
                         if [[ -n "$run_start" && "$start" < "$run_start" ]]; then
                           echo "$start ${record%.txt} (from an earlier run)"
                         else
                           echo "$start ${record%.txt}"
                         fi
                       done | sort)
          in_flight=$(printf '%s\n' "$unfinished" | grep -v ' (from an earlier run)$' || true)

          if [ "$count" -eq 0 ]; then
            if $ran; then
              echo "::warning::the suite ran and left no execution records:" \
                   "they were not written, or not where this step looks"
            else
              echo "the suite did not run"
            fi
          elif [ -n "$in_flight" ]; then
            echo "::warning::tests which started and never finished - hung, or brought the process down;" \
                 "oldest start first, below"
          elif ! $succeeded && $ran; then
            echo "::warning::every test that started also finished, yet the suite did not succeed:" \
                 "a test failed, or the run stopped outside any test; the log says which"
          else
            echo "every test that started also finished"
          fi

          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          { printf '%s\n' "$records" | grep 'run\.stamp$' || true; } | while IFS= read -r stamp; do
            echo "run $(cat "$stamp") - ${stamp%/run.stamp}"
          done
          [ -z "$unfinished" ] || echo "$unfinished" \
            | sed -e "s|^\([^ ]*\) output/ExecutionRecords/|  \1  |" \
                  -e "s|^\([^ ]*\) $generated/output/ExecutionRecords/|  \1  generated project: |"
          echo "::$token::"

      # Prints, for each check of the performance test, two times from the Grand Totals of the output the
      # check wrote: the Execution Time, which the timing checks assert on, and the Runner Overhead. A check
      # prints its value only when it fails, and roadmap item 38 needs the distribution, not only the
      # tail. Each time is printed with its unit, since the runner writes one of a second or more in
      # seconds. The checks are found from the io.txt files in the working copy, so a renamed check is
      # still printed. A column that excludes the performance tests has no working copy, and says so. A
      # check's name is a directory name and its times are read through a filter of digits, letters, dots
      # and plus signs, and neither begins a line, so nothing printed here can be a workflow command. A
      # report cannot fail the job.
      - name: Report the performance test's timings
        if: ${{ always() && inputs.needs_testing == 'true' }}
        continue-on-error: true
        run: |
          dir="output/TestsTemporaryData/TestFramework/TestRunnerPerformanceTest/test_runner_performance_test/WorkingCopy"
          if [ ! -d "$dir" ]; then
            echo "no performance timings: the performance test did not run"
            exit 0
          fi
          grand_total() { sed -n '/Grand Totals/,$p' "$1" | sed -n "s/.*$2: \([0-9.e+]*[a-z]*\)\].*/\1/p" | head -1; }
          found=0
          for file in "$dir"/*/io.txt; do
            [ -f "$file" ] || continue
            found=$((found + 1))
            check=$(basename "$(dirname "$file")")
            time=$(grand_total "$file" 'Execution Time')
            overhead=$(grand_total "$file" 'Runner Overhead')
            echo "performance timing: $check: ${time:-unparsed}, runner overhead ${overhead:-unparsed}"
          done
          [ "$found" -gt 0 ] || echo "no performance timings: the working copy holds no io.txt"

      # The patch, if there is one, the logs, the execution records, and the
      # performance test's working copy, whose io.txt files hold the timings that
      # "Report the performance test's timings" prints. Not the versioned trees
      # themselves: what a person would have compared them against is exactly what
      # the patch holds, without the megabytes that did not move. The artifact keeps
      # its `-drift` name because statistical.yml collects the artifacts by it.
      #
      # A working copy lies under <source path less extension>/<test class>, so the paths below
      # name both. Get it wrong and nothing says so: `if-no-files-found: warn`
      # leaves the artifact a file short and the run green.
      - name: Upload the drift, the run log, the execution records and the performance timings
        if: ${{ always() && inputs.needs_testing == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build }}-drift
          path: |
            output/Drift/
            output/ExecutionRecords/
            output/TestsTemporaryData/TestFramework/TestRunnerPerformanceTest/test_runner_performance_test/WorkingCopy/
            output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/GeneratedProject/output/ExecutionRecords/
            output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/WorkingCopy/InitOutput/
            run-log/
          if-no-files-found: warn

  # A column that reported without running the suite looks exactly like one that
  # passed: `gh run list` says success either way, and so does the tick. It has
  # happened - for a day in 2026-09-08/09 every column of every tier skipped the
  # run and went green. This reads the run's own jobs back through the API and
  # insists that each column named in `columns` exists, once, and that its
  # `Run the suite` step concluded - success or failure, but not skipped and not
  # absent - and, where the column asked for repetitions, that `Run the suite
  # again` did too. Passing is the column's own business; RUNNING is checked
  # here. The expectation is the columns input itself, so there is no second list
  # to drift.
  #
  # A suite step may be skipped for exactly two reasons:
  #   - The repetitions, when the first pass failed.
  #   - Both passes, when `needs_testing` is `false`. Then every column's
  #     `Nothing to test` step must have succeeded. A schedule, a dispatch and a
  #     push to staging are always tested, so a skip on one of those is an error.
  audit:
    name: Every column ran the suite
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Long enough for the wait in scripts/read_settled_jobs.sh.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COLUMNS: ${{ inputs.columns }}
      TIER_REPEAT_ARGS: ${{ inputs.repeat_args }}
      NEEDS_TESTING: ${{ inputs.needs_testing }}
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Read this run's jobs back and check each column's suite steps
        run: |
          # A column's repeat_args replaces the tier's, absent meaning the tier's;
          # the same rule the Configure step applies.
          jq -r --arg tier "$TIER_REPEAT_ARGS" '
            .[] | "\(.name)\t\((.repeat_args // $tier) != "")"' \
            <<<"$EXPECTED_COLUMNS" > expected.txt
          [ -s expected.txt ] || { echo "::error::no columns to audit"; exit 1; }

          # The jq functions through which both the wait and the checks below read a column.
          column_readers='
            def column_jobs($c): [.[] | select(.name | endswith(" / " + $c))];
            def conclusion($step): ([.[0].steps[]? | select(.name == $step) | .conclusion] | first) // "ABSENT";
            def audited_conclusions:
              [conclusion("Nothing to test"), conclusion("Run the suite"), conclusion("Run the suite again")];'

          # The jobs are read until every column's job gives a conclusion to each step
          # that `audited_conclusions` reads. `needs:` starts this job once the columns
          # have finished, but the jobs API can lag behind them. read_settled_jobs.sh gives
          # the measurement, and what happens if the conclusions never arrive.
          scripts/read_settled_jobs.sh "$GITHUB_RUN_ID" jobs.json "$column_readers"'
            . as $jobs
            | [$columns | split("\n")[]
               | select(. as $c | $jobs | column_jobs($c)
                        | length == 0 or (audited_conclusions | any(. == "ABSENT")))]
            | join(", ")' --arg columns "$(cut -f1 expected.txt)"
          echo "jobs in this run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          failed=0
          case "$NEEDS_TESTING/$EVENT/$REF" in
            true/*) ;;
            false/schedule/*|false/workflow_dispatch/*|false/push/refs/heads/staging)
              echo "::error::needs_testing is false on a $EVENT run of $REF, which is always tested"; failed=1;;
            false/*) ;;
            *) echo "::error::needs_testing is '$NEEDS_TESTING', neither true nor false"; failed=1;;
          esac

          while IFS=$'\t' read -r column repeats; do
            verdict=$(jq -r --arg c "$column" "$column_readers"'
              column_jobs($c)
              | if length != 1 then "JOBS:\(length)"
                else audited_conclusions | join("\t")
                end' jobs.json)
            if [[ $verdict == JOBS:* ]]; then
              echo "::error::$column: expected exactly one job, found ${verdict#JOBS:}"; failed=1; continue
            fi
            IFS=$'\t' read -r nothing suite repeat <<<"$verdict"
            if [ "$NEEDS_TESTING" = false ]; then
              case "$nothing/$suite/$repeat" in
                success/skipped/skipped) echo "ok    $column: nothing to test, and the suite did not run";;
                *) echo "::error::$column: nothing to test, yet Nothing to test / Run the suite / again -> $verdict"
                   failed=1;;
              esac
              continue
            fi
            if [ "$nothing" != skipped ]; then
              echo "::error::$column: needs testing, yet Nothing to test -> $nothing"; failed=1; continue
            fi
            case "$suite" in
              success|failure) echo "ok    $column: Run the suite -> $suite";;
              *)               echo "::error::$column: Run the suite -> $suite; the suite did not run on this column"; failed=1;;
            esac
            if [ "$repeats" = true ]; then
              case "$suite/$repeat" in
                */success|*/failure) echo "ok    $column: Run the suite again -> $repeat";;
                failure/skipped)     echo "ok    $column: Run the suite again -> skipped, after a red first pass";;
                *)                   echo "::error::$column: Run the suite again -> $repeat; the repetitions did not run on this column"; failed=1;;
              esac
            fi
          done < expected.txt
          exit $failed
