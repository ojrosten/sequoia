name: tests

# coarse, fine, rigorous and statistical all build and run sequoia through
# this workflow. Each tier passes its own columns and inputs, and all share
# the steps below, so the tiers cannot drift apart in the steps by which they
# build.
#
# The tiers are ordered by strictness, not by containment: fine and rigorous
# run sanitized columns in place of coarse's plain ones, not beside them. A
# tier must be at least as strict as the one below it, or a pass at a tier
# would not imply a pass at the tiers below it.
on:
  workflow_call:
    inputs:
      columns:
        description: 'A JSON array of matrix entries. Each has name, os, configure and build. It has cc and cxx where the preset reads the compiler from the environment, and pkg where the apt package holding the compiler is named differently from the binary, as clang holds clang++. exec_args, repeat_args and advisory are optional, and a comment at the step that reads each describes it.'
        required: true
        type: string
      exec_args:
        description: 'Arguments for the test executable, via the EXEC_ARGS cache variable. Semicolon-separated for more than one.'
        required: false
        type: string
        default: ''
      repeat_args:
        description: 'Arguments for a second run of the test executable, after the first and without a rebuild; empty for none. A column''s own repeat_args replaces the tier''s, as a column''s exec_args does.'
        required: false
        type: string
        default: ''
      warnings_as_errors:
        description: 'Fail the build on any compiler warning. When false, the warnings are counted and reported instead.'
        required: false
        type: boolean
        default: false
      needs_testing:
        description: 'scope.yml''s answer to whether the change touches anything the suite reads: `true` or `false`. Any other value fails every column.'
        required: true
        type: string
      merge_into:
        description: 'A branch which each column merges into the checked-out commit before building, so that the column tests what a pull request into the branch would merge. Empty tests the checked-out commit itself. The column fails if the merge conflicts, or if the branch has changed .github or scripts since the merge-base.'
        required: true
        type: string
      false_negative:
        description: 'Corrupt one versioned output and one prediction in the checkout, so that every column must go red. This is the control for the gate itself: a run in this mode that comes back green means the gate cannot see.'
        required: false
        type: boolean
        default: false
      suite_timeout_minutes:
        description: 'How long one run of the test executable may take before its step is killed, however many repetitions the run makes. The second run, if any, gets the same again.'
        required: false
        type: number
        default: 30
      job_timeout_minutes:
        description: 'How long a column may take in all, build included.'
        required: false
        type: number
        default: 90

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    strategy:
      # Every column reports. Cancelling the rest on the first red would
      # collect one answer where the point is to collect all of them.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.columns) }}

    # Every step runs under bash, Windows included, so that one set of steps
    # serves every column.
    defaults:
      run:
        shell: bash

    # How many minutes before a suite step's timeout the step's watcher records
    # what the suite is doing; "Run the suite" says why. Each snapshot records
    # when it began and ended, which shows whether the margin is generous or
    # tight.
    env:
      SNAPSHOT_MARGIN_MINUTES: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout fetches the tip without its history. The history is
          # large: docs/ holds a doxygen render in every commit. Only the
          # merge step reads the history, and it fetches what it needs.
          fetch-depth: 1

      # When `merge_into` names a branch, this step merges that branch into the
      # checkout, so that the column tests what a pull request into the branch
      # would merge. fine-on-retarget.yml says why GitHub's merge ref will not
      # do.
      #
      # A run that merges here builds with the checkout's workflows and
      # scripts, not the merged ones. So the step fails if the branch has
      # changed .github or scripts since the merge-base. Otherwise the gate
      # could pass on a recipe that the branch has replaced.
      #
      # The merge needs every commit back to the merge-base, but blobs only for
      # the paths the branch has changed since then. So the step fetches the
      # history without blobs, as scope.yml does.
      #
      # Repeated in coverage.yml; change both.
      - name: Merge the branch named by merge_into
        if: inputs.merge_into != ''
        env:
          BASE: ${{ inputs.merge_into }}
        run: |
          git fetch --quiet --no-tags --filter=blob:none --unshallow origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          tested=$(git rev-parse HEAD)
          git -c user.name="sequoia CI" -c user.email=ci@example.invalid \
            merge --no-edit "refs/remotes/origin/$BASE"
          echo "Testing $(git rev-parse HEAD): $tested merged with $BASE at $(git rev-parse "refs/remotes/origin/$BASE")"
          if ! git diff --quiet "$tested" HEAD -- .github scripts; then
            git diff --stat "$tested" HEAD -- .github scripts
            echo "::error::$BASE has changed .github or scripts since its merge-base with $tested, and this run builds with the old ones: rebase onto $BASE and push"
            exit 1
          fi

      # Every column runs, whatever the change, so that its check always
      # reports; scope.yml says why. Every later step runs only if
      # `needs_testing` is `true`, so a column with nothing to test passes in
      # seconds.
      #
      # Any answer but `true` skips the suite, so this step fails the column
      # unless the answer is exactly `false`. An empty answer, from a decision
      # that failed or an output renamed in scope.yml, then fails the column
      # rather than passing it untested. The audit below reads this step's
      # conclusion.
      - name: Nothing to test
        if: inputs.needs_testing != 'true'
        env:
          ANSWER: ${{ inputs.needs_testing }}
        run: |
          if [ "$ANSWER" != false ]; then
            echo "::error::needs_testing is '$ANSWER', neither true nor false: scope.yml's answer did not arrive"
            exit 1
          fi
          echo "Nothing to test; the scope job's summary says why."

      # The step makes two corruptions, because the columns do not share a
      # detector:
      #   - Every toolchain rewrites the summary file, so a line appended to it
      #     is drift wherever `--check-versioned-output` is on.
      #   - StreamingFreeTest compares its output against the prediction, so a
      #     rewritten prediction is a soft failure in every column, including
      #     one without the drift check.
      # The step checks that each target exists first: a control that corrupts
      # nothing is the false negative it exists to catch.
      - name: Corrupt the tree, so that every column must go red
        if: ${{ inputs.false_negative && inputs.needs_testing == 'true' }}
        run: |
          summary=output/TestSummaries/Tests/Core/Meta/type_algorithms_free_test.txt
          prediction=TestMaterials/Streaming/StreamingFreeTest/streaming_free_test/Prediction/Foo.txt
          for f in "$summary" "$prediction"; do
            [ -f "$f" ] || { echo "::error::$f is not where the control expects it"; exit 1; }
          done
          echo "false-negative control: the run must report this line as drift" >> "$summary"
          echo "false-negative control: the test must fail against this" > "$prediction"
          git diff --stat

      # The step checks each package against `apt-cache pkgnames`, which lists
      # names exactly. `apt-get install` does not match names exactly: given a
      # name with regex metacharacters that matches no package, it treats the
      # name as a regex. So `g++-15` on noble resolves to clang-15, flang-15
      # and llvm-15, and apt-get installs all three and exits 0.
      #
      # The step reads the list once into a variable, and searches for each
      # name there. A pipe from apt-cache into `grep -q` fails: grep quits at
      # its first match, apt-cache dies of SIGPIPE mid-list, and the job's
      # pipefail fails the check although the name is listed. On ubuntu-26.04
      # the pipe failed this way for g++-15 on every Linux column. -F because a
      # name may hold a `.`, which a regex matches against any character.
      - name: Install the toolchain (Linux)
        if: inputs.needs_testing == 'true' && runner.os == 'Linux'
        run: |
          # The hosted image ships Chrome's and Microsoft's apt repositories,
          # which nothing here installs from. A bad index from either fails
          # `apt-get update`, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Launchpad and the Ubuntu archive are live dependencies of every
          # Linux column. Adding the PPA has failed with a malformed chunked
          # response and with an HTTP 503, and once hung in its index refresh
          # until the job's timeout, each before any compiler ran. So
          # scripts/retry.sh runs each apt command: an attempt that fails, or
          # runs past its limit, is retried a bounded number of times.
          scripts/retry.sh 4 300 -- sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          scripts/retry.sh 4 300 -- sudo apt-get update -qq
          # gdb reads the stacks for a hung suite's snapshot and for a crash's
          # core; the image has none.
          names=$(apt-cache pkgnames)
          for pkg in "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev gdb; do
            grep -qFx -- "$pkg" <<< "$names" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          scripts/retry.sh 3 900 -- sudo apt-get install -y "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev gdb
          # The hosted image's CMake is below sequoia's floor of 4.2, the release that added
          # CMAKE_INTERMEDIATE_DIR_STRATEGY; the Windows presets set it in
          # build_system/ShortObjectPaths.cmake. The macOS and Windows images ship a release above
          # the floor, so this column fetches one from Kitware - the host the checkout already
          # comes from - and puts it first on PATH. An older cmake surviving this step is loud:
          # the configure step's cmake_minimum_required refuses it. The tarball has no apt
          # signature behind it, so its checksum is pinned.
          #
          # Repeated in coverage.yml; change both.
          cmake_version=4.4.3
          cmake_sha256=d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc
          cmake_tarball=$RUNNER_TEMP/cmake.tar.gz
          cmake_url=https://github.com/Kitware/CMake/releases/download/v$cmake_version/cmake-$cmake_version-linux-x86_64.tar.gz
          if [ "$(uname -m)" != x86_64 ]; then echo "::error::No CMake build is fetched for $(uname -m)"; exit 1; fi
          if ! curl -fsSL -o "$cmake_tarball" "$cmake_url"; then echo "::error::CMake $cmake_version could not be fetched from Kitware's release page"; exit 1; fi
          if ! echo "$cmake_sha256  $cmake_tarball" | sha256sum --check --quiet; then echo "::error::The CMake tarball does not match its published checksum"; exit 1; fi
          tar -xzf "$cmake_tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-$cmake_version-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install the toolchain (macOS)
        if: inputs.needs_testing == 'true' && runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list tbb   >/dev/null 2>&1 || brew install tbb
          brew list llvm  >/dev/null 2>&1 || brew install llvm
          echo "CC=$(brew --prefix llvm)/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      # With the Visual Studio generator, CMake finds the toolset itself. With
      # Ninja, CMake looks for cl.exe on PATH, and nothing puts it there.
      # vcvars does, but only within the cmd session that runs it. So the step
      # captures what vcvars sets, and hands it to later steps:
      #   - named variables through GITHUB_ENV, rather than the whole `set`
      #     dump, so that the step cannot clobber the runner's own
      #     environment;
      #   - PATH through GITHUB_PATH, in Windows form, which a later bash
      #     step's start-up translates.
      - name: Enter the MSVC environment (Windows, Ninja)
        if: inputs.needs_testing == 'true' && runner.os == 'Windows' && matrix.configure == 'msvc-ninja'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          root=$("$vswhere" -latest -products '*' \
                   -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                   -property installationPath)
          [ -n "$root" ] || { echo "::error::no VC toolset reported by vswhere"; exit 1; }
          vcvars="$(cygpath -u "$root")/VC/Auxiliary/Build/vcvars64.bat"
          [ -f "$vcvars" ] || { echo "::error::$vcvars does not exist"; exit 1; }

          # vcvars runs from a batch file in RUNNER_TEMP, not through
          # `cmd //c "call ... && set"`: Git bash's MSYS layer re-quotes an
          # argument holding spaces and quotes, and cmd then reads the escaping
          # literally. The batch file's own path has no spaces, so MSYS has
          # nothing to re-quote.
          bat="$RUNNER_TEMP/vcvars_dump.bat"
          printf '@echo off\r\necho PATH_BEFORE=%%PATH%%\r\ncall "%s" >nul || exit /b 1\r\nset\r\n' "$(cygpath -w "$vcvars")" > "$bat"
          dump=$(cmd //c "$(cygpath -w "$bat")" | tr -d '\r')
          printf '%s\n' "$dump" | grep -iE '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=' >> "$GITHUB_ENV"

          # The step forwards only the PATH entries vcvars added. Forwarding
          # the whole PATH would put the runner's own entries ahead of
          # themselves in a new order: WindowsApps then precedes Git\bin, and
          # `shell: bash` resolves to the WSL stub in every later step.
          #
          # Nor does the step forward Visual Studio's bundled CMake and Ninja,
          # which would otherwise come ahead of the image's. This column then
          # builds with the same cmake as the msbuild columns, so that a red
          # run here asks about the generator and nothing else.
          before=$(printf '%s\n' "$dump" | grep '^PATH_BEFORE=' | sed 's/^[^=]*=//' | tr ';' '\n')
          after=$(printf '%s\n' "$dump"  | grep -iE '^PATH='     | sed 's/^[^=]*=//' | tr ';' '\n')
          added=$(printf '%s\n' "$after" | grep -vxF -f <(printf '%s\n' "$before") | grep -v '^$' | grep -vF 'CommonExtensions\Microsoft\CMake\')
          printf '%s\n' "$added"
          printf '%s\n' "$added" >> "$GITHUB_PATH"

          # GITHUB_PATH reaches only later steps, so the step looks for ninja
          # where a later step will: in the forwarded entries, then in this
          # step's own PATH.
          PATH="$(cygpath -pu "$(printf '%s\n' "$added" | paste -sd ';')"):$PATH" command -v ninja \
            || { echo "no ninja on the forwarded PATH or the image's; installing one"; choco install ninja -y; }

      # An install's exit status says that the installer ran, not that it
      # installed what was asked for. So this step prints the compiler and the
      # cmake that later steps will find.
      - name: Report the toolchain actually in use
        if: inputs.needs_testing == 'true'
        run: |
          if [ -n "${CXX:-}" ]; then
            command -v "$CXX" || { echo "::error::$CXX is not on PATH"; exit 1; }
            "$CXX" --version
          elif [ '${{ matrix.configure }}' = msvc-ninja ]; then
            # Prints which cl, ninja and cmake the forwarded PATH resolves to,
            # so that the order GITHUB_PATH produced is seen, not assumed.
            for tool in cl ninja cmake; do
              command -v "$tool" || { echo "::error::$tool is not on PATH"; exit 1; }
            done
          else
            echo "No CXX set; the preset selects the compiler (Windows/MSVC)."
          fi
          cmake --version

      # `--version` does not identify a distribution's compiler: Ubuntu ships
      # post-release snapshots of a branch under the release's version number,
      # so a g++ reporting 15.2.0 may be well beyond 15.2.0. The package's
      # changelog says which snapshot it is. Clang is packaged the same way, so
      # the step reads the changelog of whichever package the column installed.
      - name: What the distribution's compiler actually is
        if: inputs.needs_testing == 'true' && runner.os == 'Linux'
        # A report must not fail the job, hence each `|| true`.
        run: |
          pkg="${{ matrix.pkg || matrix.cxx }}"
          log=$(dpkg -L "$pkg" 2>/dev/null | grep -m1 'changelog.Debian.gz$' || true)
          if [ -n "$log" ]; then
            zcat "$log" | sed -n '1,20p' || true
          else
            echo "No Debian changelog found for $pkg; $CXX --version above is all we have."
          fi

      # The suite generates projects, and sequoia makes a commit in each
      # project it generates. git refuses to commit without an identity, which
      # a fresh runner lacks.
      - name: Give git an identity
        if: inputs.needs_testing == 'true'
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      # A generated project vendors a copy of sequoia, and paths in the copy's
      # TestMaterials tree pass 260 characters. sequoia declares itself
      # long-path aware in resources/win/longpaths.manifest. Windows also needs
      # its machine-wide switch, and git its own setting.
      #
      # The switch reaches only what asks for it: the checkout, git, and
      # sequoia's own binaries through the manifest. cl.exe refuses a path of
      # 260 characters whatever the registry says, and MSBuild's file tracker
      # is not long-path aware either. So the build keeps the compiler's paths
      # under the limit: build_system/ShortObjectPaths.cmake hashes the object
      # paths, and UntrackedTryCompiles.cmake keeps the tracker away from the
      # probes whose logs would be longest.
      #
      # The step runs in PowerShell, because Git bash's MSYS layer rewrites
      # bare switches such as /v and /f into Windows paths before reg.exe sees
      # them.
      - name: Let Windows and git see long paths
        if: inputs.needs_testing == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled

      # A suite that crashes ends with an exit status and nothing else. So this
      # step and the next arrange for a crash to leave a dump, and "Report any
      # crash" prints its stacks:
      #   - Windows: Windows Error Reporting's LocalDumps, for every process,
      #     with its dialogs off (DontShowUI), since nobody is there to dismiss
      #     one;
      #   - Linux: the kernel's core pattern, pointed into RUNNER_TEMP. A core
      #     size limit set in one step does not carry to the next, so each
      #     suite step raises its own, and records it for "Report any crash" to
      #     check;
      #   - macOS: nothing to arrange, since the system writes a crash report
      #     itself.
      # A control crash then checks that the arrangement took. Without the
      # control, a crash in the suite that left no dump would be reported as no
      # crash at all. A control that leaves nothing makes the step warn rather
      # than fail, since a job whose dumps are lost can still test. The step
      # writes the since file after the control's dump, and "Report any crash"
      # reports only the dumps newer than it.
      #
      # On Windows the control cannot check the error mode. GitHub's runner
      # starts every process of a job with an error mode under which a crash
      # never reaches Windows Error Reporting, and the control's FailFast
      # ignores the mode. sequoia's test runner clears the mode for a run
      # (windows_crash_report_enabler), and
      # failure_reporting_in_parallel_free_test checks that it does.
      #
      # PowerShell writes the registry, as in the step above.
      - name: Ask Windows Error Reporting for dumps
        if: inputs.needs_testing == 'true' && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-ItemProperty -Path $wer -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null
          New-Item -Path "$wer\LocalDumps" -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "$wer\LocalDumps" -Name DumpCount -Value 10 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path "$wer\LocalDumps"

      - name: Let a crash leave a dump
        if: inputs.needs_testing == 'true'
        timeout-minutes: 3
        run: |
          dumps="$RUNNER_TEMP/dumps"
          mkdir -p "$dumps"
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command "[Environment]::FailFast('A control crash')" || true
              control_pattern='*.dmp' ;;
            Linux)
              # %e, the name the kernel keeps for the process, not %E, its
              # whole path: the kernel writes no core whose name would pass
              # 255 bytes, and the end-to-end test's executables lie deep.
              # report_crashes.sh reads the path from the core.
              sudo sysctl -q -w "kernel.core_pattern=$dumps/core.%e.%p"
              (ulimit -c unlimited; bash -c 'kill -SEGV $$') || true
              control_pattern='core.*' ;;
            macOS)
              bash -c 'kill -SEGV $$' || true
              source scripts/macos_crash_reports.sh
              reports=()
              while IFS= read -r directory; do reports+=("$directory"); done < <(macos_crash_report_directories)
              control_pattern= ;;
          esac

          found=
          for attempt in $(seq 1 30); do
            if [ -n "$control_pattern" ]; then
              found=$(find "$dumps" -maxdepth 1 -name "$control_pattern" | head -1 || true)
            else
              found=$(find "${reports[@]}" -newer "$dumps" -name 'bash*' 2> /dev/null | head -1 || true)
            fi
            [ -z "$found" ] || break
            sleep 1
          done

          if [ -n "$found" ]; then
            echo "The control crash left $found"
          else
            echo "::warning title=No crash dumps::${{ matrix.name }}: a control crash left no dump, so a crash in the suite would go unreported."
          fi
          sleep 1
          touch "$dumps/since"

      # A column may carry `exec_args` of its own, for a platform that cannot
      # run the whole suite. The column's value replaces the tier's rather than
      # adding to it. So a column in a tier that passes
      # `--check-versioned-output` must pass it again, or lose the drift check.
      # A column's `repeat_args` replaces the tier's in the same way.
      - name: Configure
        if: inputs.needs_testing == 'true'
        id: configure
        working-directory: TestAll
        run: |
          # Not `||`: an empty string is falsy, so a column asking for no
          # arguments would silently inherit the tier's. toJSON tells an
          # absent value from an empty one.
          if [ '${{ toJSON(matrix.exec_args) }}' = 'null' ]; then
            args='${{ inputs.exec_args }}'
          else
            args='${{ matrix.exec_args }}'
          fi
          if [ '${{ toJSON(matrix.repeat_args) }}' = 'null' ]; then
            repeat='${{ inputs.repeat_args }}'
          else
            repeat='${{ matrix.repeat_args }}'
          fi
          echo "exec_args=$args" >> "$GITHUB_OUTPUT"
          echo "repeat_args=$repeat" >> "$GITHUB_OUTPUT"
          cmake --preset ${{ matrix.configure }} \
                "-DEXEC_ARGS=$args" \
                -DWARNINGS_AS_ERRORS=${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}

      # The build is a step apart from the run, so that a compile failure and a
      # test failure show as different steps, and so that the suite can carry
      # its own timeout. The step keeps the log for "Report compiler warnings",
      # which counts the warnings where they are not fatal.
      - name: Build
        if: inputs.needs_testing == 'true'
        working-directory: TestAll
        run: cmake --build --preset ${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # macOS writes a crash report itself, and reads the executable's debug
      # information to name each frame's source line. "Report any crash" waits
      # about a minute for the report. Without a dSYM, the system reads the
      # debug information through the object files, and writes the report too
      # late for that step: 79s after a TestAll crash on a hosted runner,
      # against 8s with a dSYM. Both figures are from Release builds with line
      # tables. In both, the executable was new to the system, as every CI
      # build's is. The system is quicker with an executable it has read
      # before.
      #
      # A failure here warns rather than fails, since the suite still runs.
      # Only a crash's report may then come too late for "Report any crash".
      - name: Link a dSYM (macOS)
        if: inputs.needs_testing == 'true' && runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          dsymutil "build/TestAll/${{ matrix.configure }}/TestAll" \
            || echo "::warning title=No dSYM::${{ matrix.name }}: dsymutil failed, so a crash's report may arrive after Report any crash stops waiting."

      # The step counts distinct sites as well as lines: gcc and clang repeat a
      # warning once per instantiation, so a count of lines says more about
      # templates than about code. MSVC writes "warning Cnnnn", and gcc and
      # clang write "warning:".
      - name: Report compiler warnings
        if: ${{ inputs.needs_testing == 'true' && !inputs.warnings_as_errors }}
        run: |
          log="$RUNNER_TEMP/build.log"
          sites=$({ grep -oE '[^ ]+:[0-9]+:[0-9]+: warning:|warning C[0-9]+' "$log" || true; } | sort -u | wc -l | tr -d ' ')
          total=$(grep -cE 'warning:|warning C[0-9]+' "$log" || true)
          if [ "${sites:-0}" -gt 0 ]; then
            echo "::warning title=Compiler warnings::${{ matrix.name }}: $sites distinct site(s), $total line(s)"
            {
              echo "### ${{ matrix.name }}: $sites distinct warning site(s)"
              echo '```'
              # sed, not head: head stops reading at line 40, sort then dies
              # of SIGPIPE mid-write, and pipefail fails the step.
              grep -E 'warning:|warning C[0-9]+' "$log" | sort -u | sed -n '1,40p'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compiler warnings."
          fi

      # A `run-` preset builds the `run` target, whose command is the test
      # executable. The Build step has built the executable, so this step runs
      # the suite and nothing else.
      #
      # The suite's ceiling is the step's timeout-minutes, not timeout(1)
      # around the command: macOS ships no GNU coreutils, and the step's
      # timeout tells "the suite timed out" from "the job timed out" in the run
      # summary. A hang fails nothing until a timeout ends it: a hung suite has
      # spun for 36 minutes against an 18s baseline.
      #
      # The timeout kills a hung suite without a word, and the test runner
      # reports a pass only when the suite ends, so the log cannot say where
      # the suite stopped. So the suite runs under a watcher. If the suite is
      # still running SNAPSHOT_MARGIN_MINUTES before the timeout, the watcher
      # records the processes and the suite's stacks while they can still be
      # seen; "Keep the run log" prints the snapshot. Otherwise the watcher
      # passes the suite's exit status straight through. The test runner's
      # `recover` mode would not do instead: it records each check before the
      # check runs, but forces serial execution, and so changes the concurrency
      # a hang may depend on. `set -u` because a margin missing from the
      # environment would otherwise read as zero, and the snapshot would be due
      # only when the step is killed.
      #
      # The tee is safe only because `shell: bash` runs steps under
      # `--noprofile --norc -eo pipefail`. Without pipefail the tee's exit
      # status would become the step's, and a red suite would look green. The
      # Build step depends on this too.
      #
      # A column may set `advisory: true` to run without gating on the result,
      # while its failures are worked on. A new column may need it, so the
      # mechanism stays even while no column sets it. There is no option to
      # build without running: a suite that is not run says nothing, and the
      # audit below refuses a column whose suite step did not run, unless the
      # change held nothing to test.
      - name: Run the suite
        if: inputs.needs_testing == 'true'
        id: suite
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: TestAll
        timeout-minutes: ${{ inputs.suite_timeout_minutes }}
        env:
          SUITE_TIMEOUT_MINUTES: ${{ inputs.suite_timeout_minutes }}
        run: |
          set -u
          if [ "$RUNNER_OS" = Linux ]; then
            ulimit -c unlimited || true
            ulimit -c > "$RUNNER_TEMP/dumps/core-limit" || true
          fi
          deadline=$(( (SUITE_TIMEOUT_MINUTES - SNAPSHOT_MARGIN_MINUTES) * 60 ))
          ../scripts/snapshot_at_deadline.sh "$deadline" "$RUNNER_TEMP/snapshot.txt" TestAll -- \
            cmake --build --preset run-${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/run.log"

      # The second pass, where the column asks for one, runs the same
      # executable on the same tree with the repeat arguments. The reconfigure
      # changes only EXEC_ARGS, so nothing rebuilds: of what CMake regenerates,
      # only the `run` target's command line changes. The step reads the cache
      # back, so that the log says what the pass was configured with.
      #
      # The `if:` carries GitHub's implicit success(), so a red first pass
      # skips both steps: a suite that is red once says what N more would. The
      # audit below allows for the skip. An advisory column's red first pass
      # counts as success, so there the repeat runs. Such a column must not
      # also check the versioned output: the second pass's handler removes the
      # first's patch and then finds the tree already repaired, so the drift
      # would be reported without its patch. Moving the patch aside between
      # the passes would lift this restriction.
      - name: Configure the repetitions
        if: ${{ inputs.needs_testing == 'true' && steps.configure.outputs.repeat_args != '' }}
        working-directory: TestAll
        env:
          REPEAT_ARGS: ${{ steps.configure.outputs.repeat_args }}
        run: |
          cmake --preset ${{ matrix.configure }} "-DEXEC_ARGS=$REPEAT_ARGS"
          grep '^EXEC_ARGS:' ../build/TestAll/${{ matrix.configure }}/CMakeCache.txt

      - name: Run the suite again
        if: ${{ inputs.needs_testing == 'true' && steps.configure.outputs.repeat_args != '' }}
        id: repeat
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: TestAll
        timeout-minutes: ${{ inputs.suite_timeout_minutes }}
        env:
          SUITE_TIMEOUT_MINUTES: ${{ inputs.suite_timeout_minutes }}
        run: |
          set -u
          if [ "$RUNNER_OS" = Linux ]; then
            ulimit -c unlimited || true
            ulimit -c > "$RUNNER_TEMP/dumps/core-limit" || true
          fi
          deadline=$(( (SUITE_TIMEOUT_MINUTES - SNAPSHOT_MARGIN_MINUTES) * 60 ))
          ../scripts/snapshot_at_deadline.sh "$deadline" "$RUNNER_TEMP/repeat-snapshot.txt" TestAll -- \
            cmake --build --preset run-${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/repeat.log"

      # An advisory column does not gate, so this step reads its run. Not
      # every failure there is a defect: TestRunnerPerformanceTest asserts
      # absolute durations, eight 25ms sleeps against a window of 60ms +- 35,
      # which a shared hosted runner may not hold. There, the same commit took
      # 196ms and 603ms of wall-clock time. Every other failure is a defect.
      #
      # The step classifies a failure by the test that failed, not by the
      # summary row. The timing assertions are `check(within_tolerance{...},
      # ...)`, which count in the standard row; the performance rows count
      # only `check_relative_performance`. The step names every failing file,
      # so a new failure cannot hide behind a tolerated one.
      #
      # Drift is a second thing the suite step cannot make red here. Where the
      # column checks the versioned output, a run whose output moved writes the
      # patch and sets the drift bit of its exit code, and `continue-on-error`
      # swallows that like any other failure. So the step looks for the patch
      # itself, and raises an error naming the files it holds. A failing test
      # rewrites its summary, so drift and failure come together, and the step
      # reports both. It also reports a failed suite step that names no test
      # and writes no patch.
      - name: Triage the advisory run
        if: ${{ always() && inputs.needs_testing == 'true' && matrix.advisory == true }}
        run: |
          log="$RUNNER_TEMP/run.log"
          if [ ! -f "$log" ]; then
            echo "::error title=Advisory run::${{ matrix.name }}: the suite produced no log"
            exit 0
          fi

          # Tests whose failures are understood: timing assertions a hosted
          # runner cannot hold.
          tolerated_tests='TestRunnerPerformanceTest\.cpp'

          failing=$({ grep -oE 'Tests/[A-Za-z0-9/_]+\.cpp, Line [0-9]+' "$log" || true; } \
                      | sed 's/, Line.*//' | sort -u)
          actionable=$({ echo "$failing" | grep -vE "$tolerated_tests" || true; } | sed '/^$/d')

          # The step reads the files' names from the `diff --git` headers,
          # which every file in the patch has. A removed file has no `+++ b/`
          # line, and a file created or deleted empty has nothing but its
          # header.
          patch=output/Drift/VersionedOutput.patch
          drifted=$({ [ -f "$patch" ] && grep '^diff --git a/' "$patch" | sed 's|^diff --git a/.* b/||'; } || true)

          {
            echo "### ${{ matrix.name }} - advisory run"
            echo ""
            if [ -n "$failing" ]; then
              echo "Failing tests:"
              echo '```'
              echo "$failing"
              echo '```'
            else
              echo "No failing tests."
            fi
            echo ""
            echo '```'
            sed -n '/Grand Totals/,$p' "$log" | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$drifted" ]; then
            echo "::error title=Advisory run needs action::${{ matrix.name }}: versioned output moved: $(echo "$drifted" | tr '\n' ' '). This column does not gate, so the job is green; the patch is on this page, or in the artifact if too big for it."
          fi
          if [ -n "$actionable" ]; then
            echo "::error title=Advisory run needs action::${{ matrix.name }}: $(echo "$actionable" | tr '\n' ' '). This column does not gate, so the job is green; the failures are real."
          elif [ -n "$failing" ]; then
            echo "::warning title=Advisory run::${{ matrix.name }}: only the timing assertions this runner cannot hold. Nothing to act on."
          elif [ '${{ steps.suite.outcome }}' != 'success' ]; then
            # The suite step failed, yet named no test and wrote no patch: a
            # crash, a timeout or something else cut the run short. The suite
            # did not pass, whatever the log's last lines say.
            echo "::error title=Advisory run needs action::${{ matrix.name }}: the suite step's outcome is '${{ steps.suite.outcome }}' and the log names no failing test and no drift. Read the log."
          elif [ -z "$drifted" ]; then
            echo "::notice title=Advisory run::${{ matrix.name }}: the suite passed outright."
          fi

      # The step copies the suite's logs into run-log/, which the artifact
      # holds, so that a column can be read after the run as well as on the run
      # page; statistical.yml reads the logs back. The suite step's outcome
      # goes with its log: otherwise a reader cannot tell a suite that failed
      # in every repetition, whose analysis says "No instabilities detected",
      # from one that passed. So does the snapshot of a suite that outlived its
      # watcher's deadline. The step also prints the snapshot, so that the run
      # page shows where a hung suite stopped.
      - name: Keep the run log
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          mkdir -p run-log
          cp "$RUNNER_TEMP/run.log" run-log/ 2>/dev/null || true
          echo "${{ steps.suite.outcome }}" > run-log/outcome
          cp "$RUNNER_TEMP/repeat.log" run-log/ 2>/dev/null || true
          [ ! -f run-log/repeat.log ] || echo "${{ steps.repeat.outcome }}" > run-log/repeat-outcome
          for snapshot in snapshot repeat-snapshot; do
            if [ -f "$RUNNER_TEMP/$snapshot.txt" ]; then
              cp "$RUNNER_TEMP/$snapshot.txt" run-log/
              echo "::warning title=Suite still running near its timeout::${{ matrix.name }}: the suite was still running $SNAPSHOT_MARGIN_MINUTES minutes before its timeout; run-log/$snapshot.txt, printed below, says what it was doing."
              # Whatever the tools printed is not a workflow command, whatever
              # it begins with.
              token=$(openssl rand -hex 16)
              echo "::stop-commands::$token"
              cat "$RUNNER_TEMP/$snapshot.txt"
              echo "::$token::"
            fi
          done

      # The step reports every crash since "Let a crash leave a dump". An error
      # names the column, and the stacks follow on the run page. The report,
      # and any Windows minidumps, go into run-log/, which the last step
      # uploads. The step does not keep Linux's cores: they are large, and
      # their stacks are printed.
      #
      # macOS writes a crash report, and Windows Error Reporting a dump, some
      # seconds after the crash. The steps between the suite and this one can
      # take less time than that, so after a failed suite this step waits, up
      # to a bound, for a report or a dump to appear. Linux writes a core
      # before the process is gone.
      #
      # The step warns of two conditions under which a crash would go
      # uncounted:
      #   - on Linux, a core limit the suite step could not raise;
      #   - on macOS, a report directory the step cannot read.
      # report_crashes.sh ends its output with the count of crashes. If the
      # script exits non-zero, or its last line is not the count, a crash may
      # have gone unreported, and the step raises an error saying so. A count
      # above 0 raises the crash error in either case. Whenever the step
      # raises an error, it keeps the output and any dumps.
      # The timeout bounds cdb's downloads of Windows' symbols, and a report
      # that times out does not fail the job.
      - name: Report any crash
        if: ${{ always() && inputs.needs_testing == 'true' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          dumps="$RUNNER_TEMP/dumps"
          if [ ! -f "$dumps/since" ]; then
            echo "No crash report: the dumps were not arranged."
            exit 0
          fi

          if [ "$RUNNER_OS" = Linux ] && [ -f "$dumps/core-limit" ] && [ "$(cat "$dumps/core-limit")" != unlimited ]; then
            echo "::warning title=No cores::${{ matrix.name }}: the suite's core limit was $(cat "$dumps/core-limit"), so a crash would leave no core."
          fi

          if [ "${{ steps.suite.outcome }}" = failure ] || [ "${{ steps.repeat.outcome }}" = failure ]; then
            source scripts/macos_crash_reports.sh
            reports=()
            while IFS= read -r directory; do reports+=("$directory"); done < <(macos_crash_report_directories)
            case "$RUNNER_OS" in
              macOS)   written=("${reports[@]}" -newer "$dumps/since" -name '*.ips'
                                -exec grep -l '"bug_type":"309"' {} +) ;;
              Windows) written=("$dumps" -maxdepth 1 -newer "$dumps/since" -name '*.dmp') ;;
              *)       written=() ;;
            esac
            if [ ${#written[@]} -gt 0 ]; then
              for attempt in $(seq 1 60); do
                # The loop tests find's output, not its exit status: under
                # pipefail, find's failure on an absent or unreadable directory
                # would hide a report found in another.
                [ -n "$(find "${written[@]}" 2> /dev/null | head -1)" ] && break
                sleep 1
              done
              sleep 2
            fi
          fi

          report="$RUNNER_TEMP/crashes.txt"
          status=0
          scripts/report_crashes.sh "$dumps" "$dumps/since" > "$report" 2>&1 || status=$?
          sed -n '/^== Crash: /q; s/^Not read: //p' "$report" | while IFS= read -r unread; do
            echo "::warning title=Crash reports unread::${{ matrix.name }}: $unread."
          done
          count_line='^Crashes found: ([0-9]+)$'
          count=
          if [[ $(tail -n 1 "$report") =~ $count_line ]]; then count=${BASH_REMATCH[1]}; fi
          # A count holding a digit other than 0 is above 0, however large.
          crashed=false
          if [[ $count =~ [1-9] ]]; then crashed=true; fi
          incomplete=
          if [ "$status" -ne 0 ]; then
            incomplete="report_crashes.sh exited with status $status"
          elif [ -z "$count" ]; then
            incomplete="report_crashes.sh's output does not end with its count of crashes"
          fi
          if $crashed; then
            echo "::error title=Crash::${{ matrix.name }}: $count crash(es); their stacks are below, and in run-log/crashes/."
          fi
          if [ -n "$incomplete" ]; then
            echo "::error title=Crash report incomplete::${{ matrix.name }}: $incomplete, so a crash may have gone unreported. Its output is below, and in run-log/crashes/."
          fi
          if [ -n "$incomplete" ] || $crashed; then
            mkdir -p run-log/crashes
            cp "$report" run-log/crashes/
            find "$dumps" -maxdepth 1 -newer "$dumps/since" -name '*.dmp' -exec cp {} run-log/crashes/ \;
          fi
          # Whatever the debuggers printed is not a workflow command,
          # whatever it begins with.
          token=crashes-$RANDOM$RANDOM$RANDOM
          echo "::stop-commands::$token"
          cat "$report"
          echo "::$token::"

      # Where drift detection is on, a run whose versioned output moved writes
      # the change to output/Drift/VersionedOutput.patch, one whole-file hunk
      # per file. This step puts the patch on the run page. Only reading the
      # patch tells the PR working from the PR breaking, and on the run page it
      # needs nothing downloaded. `git status` runs beside it because it
      # sees the whole tree, where the runner sees only the two trees it
      # writes: a prediction file that moved shows here and nowhere else.
      #
      # GitHub drops a step summary over 1 MiB whole, and leaves the step
      # green. So in place of a patch too big for the page, the step says where
      # to find it. `--whitespace=nowarn` because a whole-file hunk reproduces
      # every trailing space the output has, and `apply.whitespace=fix` in a
      # user's config would strip them silently, applying to a tree the run
      # never wrote. The fence is four backticks, so that a line of three in
      # the output cannot close it.
      - name: Report any versioned output that moved
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          git status --short -- output/ TestMaterials/ || true
          patch=output/Drift/VersionedOutput.patch
          if [ -f "$patch" ]; then
            {
              echo "### Versioned output moved: ${{ matrix.name }}"
              echo "Apply from the project root with \`git apply --whitespace=nowarn\`, then read \`git diff\`."
              if [ "$(wc -c < "$patch")" -gt 900000 ]; then
                echo "The patch is $(wc -c < "$patch") bytes, too large for this page: it is in the \`${{ matrix.build }}-drift\` artifact."
              else
                echo '````diff'
                cat "$patch"
                echo '````'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # In the false-negative control every column goes red, but red does not
      # say which detector saw the corruption: the corrupted prediction fails a
      # test in every column, with or without the drift check. This step holds
      # the drift detector to its own evidence:
      #   - Where the check is on, the run must have written a patch. Applied
      #     in reverse to the tree the run repaired, the patch must give back
      #     HEAD plus the corruption and nothing else: the one appended line,
      #     in the one summary, as the only change under either versioned tree.
      #   - Where the check is off, there must be no patch.
      # The step reverses the patch rather than applying it, because the run
      # rewrote the tree the patch was taken from.
      - name: The drift was reported as a patch which, reversed, restores the corruption
        if: ${{ always() && inputs.needs_testing == 'true' && inputs.false_negative }}
        run: |
          patch=output/Drift/VersionedOutput.patch
          summary=output/TestSummaries/Tests/Core/Meta/type_algorithms_free_test.txt
          case '${{ steps.configure.outputs.exec_args }}' in
            *--check-versioned-output*)
              [ -f "$patch" ] || { echo "::error::the drift check was on and the run wrote no patch"; exit 1; }
              git apply --reverse --whitespace=nowarn "$patch"
              status=$(git status --porcelain -- output/TestSummaries/ output/DiagnosticsOutput/)
              if [ "$status" != " M $summary" ]; then
                echo "::error::reversing the patch did not leave exactly the corrupted summary modified"
                echo "$status"; exit 1
              fi
              if [ "$(git diff --numstat -- "$summary" | cut -f1,2)" != "$(printf '1\t0')" ] \
                 || ! git diff -- "$summary" | grep -qxF '+false-negative control: the run must report this line as drift'; then
                echo "::error::reversing the patch did not reproduce the one appended line"
                git diff -- "$summary"; exit 1
              fi
              git checkout -- "$summary"
              echo "ok    the patch, reversed, restores the corruption and nothing else";;
            *)
              [ ! -f "$patch" ] || { echo "::error::the drift check was off and a patch was written"; exit 1; }
              echo "ok    no drift check, so no patch";;
          esac

      # Every test writes an execution record: its start when it begins, and
      # its execution duration and the runner's overhead when it finishes,
      # whether or not its body threw. A record with no execution duration
      # names a test that was executing when the run ended. The step lists
      # such tests oldest start first, since the hung test is likeliest the one
      # that has run longest. The end-to-end test's generated project keeps
      # records of its own. A record older than its run's stamp is from an
      # earlier run, and the step marks it so.
      #
      # The count of records comes first: none, after a suite that ran, means
      # that the records were not written, or not where this step looks. The
      # names are paths that a fork's PR controls, so the step prints them
      # with workflow commands stopped.
      - name: Name the tests that started and never finished
        if: ${{ always() && inputs.needs_testing == 'true' }}
        env:
          SUITE: ${{ steps.suite.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
        run: |
          generated=output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/GeneratedProject
          roots="output/ExecutionRecords $generated/output/ExecutionRecords"
          records=$(for root in $roots; do
                      [ ! -d "$root" ] || find "$root" -type f \( -name '*.txt' -o -name run.stamp \)
                    done)
          tests=$(printf '%s\n' "$records" | grep '\.txt$' || true)
          count=$(printf '%s' "$tests" | grep -c . || true)
          echo "execution records found: $count"

          ran=false
          case "$SUITE" in success|failure|cancelled) ran=true;; esac
          succeeded=false
          if [ "$SUITE" = success ] && [ "$REPEAT" != failure ] && [ "$REPEAT" != cancelled ]; then succeeded=true; fi

          started() { sed -n 's/^started //p' "$1"; }
          start_of_run() {
            dir=$(dirname "$1")
            while [ "$dir" != . ] && [ ! -f "$dir/run.stamp" ]; do dir=$(dirname "$dir"); done
            [ ! -f "$dir/run.stamp" ] || started "$dir/run.stamp"
          }
          unfinished=$(printf '%s\n' "$tests" | while IFS= read -r record; do
                         if [ -z "$record" ] || grep -q '^execution duration' "$record"; then continue; fi
                         start=$(started "$record")
                         run_start=$(start_of_run "$record")
                         if [[ -n "$run_start" && "$start" < "$run_start" ]]; then
                           echo "$start ${record%.txt} (from an earlier run)"
                         else
                           echo "$start ${record%.txt}"
                         fi
                       done | sort)
          in_flight=$(printf '%s\n' "$unfinished" | grep -v ' (from an earlier run)$' || true)

          if [ "$count" -eq 0 ]; then
            if $ran; then
              echo "::warning::the suite ran and left no execution records:" \
                   "they were not written, or not where this step looks"
            else
              echo "the suite did not run"
            fi
          elif [ -n "$in_flight" ]; then
            echo "::warning::tests which started and never finished - hung, or brought the process down;" \
                 "oldest start first, below"
          elif ! $succeeded && $ran; then
            echo "::warning::every test that started also finished, yet the suite did not succeed:" \
                 "a test failed, or the run stopped outside any test; the log says which"
          else
            echo "every test that started also finished"
          fi

          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          { printf '%s\n' "$records" | grep 'run\.stamp$' || true; } | while IFS= read -r stamp; do
            echo "run $(cat "$stamp") - ${stamp%/run.stamp}"
          done
          [ -z "$unfinished" ] || echo "$unfinished" \
            | sed -e "s|^\([^ ]*\) output/ExecutionRecords/|  \1  |" \
                  -e "s|^\([^ ]*\) $generated/output/ExecutionRecords/|  \1  generated project: |"
          echo "::$token::"

      # The step prints two durations for each check of the performance test,
      # from the Grand Totals of the output the check wrote: the Execution
      # Time, on which the timing checks assert, and the Runner Overhead. Where
      # the check measured it, the step also prints the peak number of the
      # check's tests that ran at once. A check prints its values only when it
      # fails, and setting the checks' bounds needs the distribution, not only
      # the tail.
      #
      # The step prints each duration with its unit, since the runner writes
      # one of a second or more in seconds. The step finds the checks from
      # the io.txt files in the working copy, so a renamed check is still
      # printed. A column that excludes the performance tests has no working
      # copy, and the step says so.
      #
      # A check's name is a directory name, and its values pass a filter of
      # digits, letters, dots and plus signs. Neither begins a line, so nothing
      # printed here can be a workflow command. A report cannot fail the job.
      - name: Report the performance test's timings
        if: ${{ always() && inputs.needs_testing == 'true' }}
        continue-on-error: true
        run: |
          dir="output/TestsTemporaryData/TestFramework/TestRunnerPerformanceTest/test_runner_performance_test/WorkingCopy"
          if [ ! -d "$dir" ]; then
            echo "no performance timings: the performance test did not run"
            exit 0
          fi
          grand_total() { sed -n '/Grand Totals/,$p' "$1" | sed -n "s/.*$2: \([0-9.e+]*[a-z]*\)\].*/\1/p" | head -1; }
          found=0
          for file in "$dir"/*/io.txt; do
            [ -f "$file" ] || continue
            found=$((found + 1))
            check=$(basename "$(dirname "$file")")
            execution=$(grand_total "$file" 'Execution Time')
            overhead=$(grand_total "$file" 'Runner Overhead')
            peak=$(sed -n 's/^\[Peak Overlap: \([0-9]*\)\]$/\1/p' "$file" | head -1)
            echo "performance timing: $check: ${execution:-unparsed}," \
                 "runner overhead ${overhead:-unparsed}${peak:+, peak overlap $peak}"
          done
          [ "$found" -gt 0 ] || echo "no performance timings: the working copy holds no io.txt"

      # The artifact takes the performance test's working copy for its io.txt
      # files, which hold the timings that "Report the performance test's
      # timings" prints. It does not take the versioned trees: the patch holds
      # what moved in them, without the megabytes that did not. The artifact
      # keeps its `-drift` name because statistical.yml collects the artifacts
      # by it.
      #
      # A working copy lies under <source path less extension>/<test class>,
      # so the paths below name both. A wrong path goes unnoticed:
      # `if-no-files-found: warn` leaves the artifact a file short and the run
      # green.
      - name: Upload the drift, the run log, the execution records and the performance timings
        if: ${{ always() && inputs.needs_testing == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build }}-drift
          path: |
            output/Drift/
            output/ExecutionRecords/
            output/TestsTemporaryData/TestFramework/TestRunnerPerformanceTest/test_runner_performance_test/WorkingCopy/
            output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/GeneratedProject/output/ExecutionRecords/
            output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/test_runner_end_to_end_test/WorkingCopy/InitOutput/
            run-log/
          if-no-files-found: warn

  # A column that reported without running the suite looks exactly like one
  # that passed: `gh run list` says success either way, and so does the tick.
  # Every column of every tier once skipped the suite this way for a day, and
  # went green.
  #
  # So this job reads the run's own jobs back through the API. It insists
  # that each column named in `columns` exists, once, and that its `Run the
  # suite` step concluded: success or failure, but neither skipped nor
  # absent. Where the column asked for repetitions, `Run the suite again`
  # must have concluded too. Whether the suite passed is the column's own
  # business; this job checks that the suite ran. The expectation is the
  # `columns` input itself, so there is no second list to drift.
  #
  # A suite step may be skipped for exactly two reasons:
  #   - The repetitions, when the first pass failed.
  #   - Both passes, when `needs_testing` is `false`. Then every column's
  #     `Nothing to test` step must have succeeded. A schedule, a dispatch and
  #     a push to staging are always tested, so a skip on one of those is an
  #     error.
  audit:
    name: Every column ran the suite
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Long enough for the wait in scripts/read_settled_jobs.sh.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COLUMNS: ${{ inputs.columns }}
      TIER_REPEAT_ARGS: ${{ inputs.repeat_args }}
      NEEDS_TESTING: ${{ inputs.needs_testing }}
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Read this run's jobs back and check each column's suite steps
        run: |
          # A column's repeat_args replaces the tier's, and an absent one means
          # the tier's: the rule the Configure step applies.
          jq -r --arg tier "$TIER_REPEAT_ARGS" '
            .[] | "\(.name)\t\((.repeat_args // $tier) != "")"' \
            <<<"$EXPECTED_COLUMNS" > expected.txt
          [ -s expected.txt ] || { echo "::error::no columns to audit"; exit 1; }

          # The jq functions through which both the wait and the checks below
          # read a column.
          column_readers='
            def column_jobs($c): [.[] | select(.name | endswith(" / " + $c))];
            def conclusion($step): ([.[0].steps[]? | select(.name == $step) | .conclusion] | first) // "ABSENT";
            def audited_conclusions:
              [conclusion("Nothing to test"), conclusion("Run the suite"), conclusion("Run the suite again")];'

          # read_settled_jobs.sh reads the jobs until every column's job has a
          # conclusion for each step that `audited_conclusions` reads. `needs:`
          # starts this job once the columns have finished, but the jobs API
          # can lag behind them. The script's header gives the measured lag,
          # and what happens if the conclusions never arrive.
          scripts/read_settled_jobs.sh "$GITHUB_RUN_ID" jobs.json "$column_readers"'
            . as $jobs
            | [$columns | split("\n")[]
               | select(. as $c | $jobs | column_jobs($c)
                        | length == 0 or (audited_conclusions | any(. == "ABSENT")))]
            | join(", ")' --arg columns "$(cut -f1 expected.txt)"
          echo "jobs in this run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          failed=0
          case "$NEEDS_TESTING/$EVENT/$REF" in
            true/*) ;;
            false/schedule/*|false/workflow_dispatch/*|false/push/refs/heads/staging)
              echo "::error::needs_testing is false on a $EVENT run of $REF, which is always tested"; failed=1;;
            false/*) ;;
            *) echo "::error::needs_testing is '$NEEDS_TESTING', neither true nor false"; failed=1;;
          esac

          while IFS=$'\t' read -r column repeats; do
            verdict=$(jq -r --arg c "$column" "$column_readers"'
              column_jobs($c)
              | if length != 1 then "JOBS:\(length)"
                else audited_conclusions | join("\t")
                end' jobs.json)
            if [[ $verdict == JOBS:* ]]; then
              echo "::error::$column: expected exactly one job, found ${verdict#JOBS:}"; failed=1; continue
            fi
            IFS=$'\t' read -r nothing suite repeat <<<"$verdict"
            if [ "$NEEDS_TESTING" = false ]; then
              case "$nothing/$suite/$repeat" in
                success/skipped/skipped) echo "ok    $column: nothing to test, and the suite did not run";;
                *) echo "::error::$column: nothing to test, yet Nothing to test / Run the suite / again -> $verdict"
                   failed=1;;
              esac
              continue
            fi
            if [ "$nothing" != skipped ]; then
              echo "::error::$column: needs testing, yet Nothing to test -> $nothing"; failed=1; continue
            fi
            case "$suite" in
              success|failure) echo "ok    $column: Run the suite -> $suite";;
              *)               echo "::error::$column: Run the suite -> $suite; the suite did not run on this column"; failed=1;;
            esac
            if [ "$repeats" = true ]; then
              case "$suite/$repeat" in
                */success|*/failure) echo "ok    $column: Run the suite again -> $repeat";;
                failure/skipped)     echo "ok    $column: Run the suite again -> skipped, after a red first pass";;
                *)                   echo "::error::$column: Run the suite again -> $repeat; the repetitions did not run on this column"; failed=1;;
              esac
            fi
          done < expected.txt
          exit $failed
