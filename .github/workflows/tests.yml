name: tests

# The one place that knows how to build and run sequoia. coarse, fine and rigorous
# are callers differing only in which columns they ask for and what they pass the
# runner, so the tiers cannot drift apart in how they build.
#
# The tiers are ordered by strictness, not by containment: fine and rigorous replace
# coarse's plain columns with sanitized ones rather than adding to them. A tier must
# be at least as strict as the one below, or a pass at one says nothing about the
# next.
on:
  workflow_call:
    inputs:
      columns:
        description: 'JSON array of matrix entries: name, os, configure, build, cc/cxx where the preset takes them from the environment, and pkg where the apt package providing the compiler is not spelt like the binary (clang++ comes from clang; g++-15 is its own package).'
        required: true
        type: string
      exec_args:
        description: 'Arguments for the test executable, via the EXEC_ARGS cache variable. Semicolon-separated for more than one.'
        required: false
        type: string
        default: ''
      warnings_as_errors:
        description: 'Fail the build on any compiler warning. The gating tiers set this; the reporting tier counts them instead.'
        required: false
        type: boolean
        default: false
      false_negative:
        description: 'Corrupt the checkout so that every column MUST go red, one versioned output and one prediction. The control for the gate itself: a run in this mode that comes back green means the gate cannot see. Roadmap item 148.'
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # Every column reports. Cancelling the rest on the first red would collect
      # one answer where the point is to collect all of them.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.columns) }}

    # bash everywhere, Windows included, so one set of steps serves every column
    # rather than each acquiring a shell dialect of its own.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          # docs/ is ~96MB of committed doxygen render; nothing here reads it.
          fetch-depth: 1

      # Two corruptions, because the columns do not share a detector. The summary
      # file is rewritten by every toolchain, so appending to it is drift wherever
      # `--check-versioned-output` is on; the prediction is what StreamingFreeTest
      # compares its output against, so rewriting it is a soft failure everywhere,
      # including the column that carries no drift check. Each target is checked
      # to exist first: a control that mutates nothing is the false negative it is
      # meant to catch.
      - name: Corrupt the tree, so that every column must go red
        if: ${{ inputs.false_negative }}
        run: |
          summary=output/TestSummaries/Tests/Core/Meta/type_algorithms_free_test.txt
          prediction=TestMaterials/Streaming/streaming_free_test/Prediction/Foo.txt
          for f in "$summary" "$prediction"; do
            [ -f "$f" ] || { echo "::error::$f is not where the control expects it"; exit 1; }
          done
          echo "false-negative control: the run must report this line as drift" >> "$summary"
          echo "false-negative control: the test must fail against this" > "$prediction"
          git diff --stat

      # Package presence is tested against `apt-cache pkgnames`, which matches
      # names exactly. `apt-get install` does not: given a name with regex
      # metacharacters that matches no package it treats the name as a regex, so
      # `g++-15` on noble resolves to clang-15, flang-15 and llvm-15, installs all
      # three, and exits 0.
      - name: Install the toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          # The compiler binary and the package providing it are not the same string:
          # g++-15 is both, but clang++ is shipped by `clang`. A column may therefore
          # name the package separately, defaulting to the binary where they agree.
          for pkg in "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y "${{ matrix.pkg || matrix.cxx }}" ninja-build libtbb-dev
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # A macOS column carries `--exclude-performance` as the Windows ones do: it is
      # the suite's timing assertions, not the rest of it, which a hosted runner
      # cannot hold.
      - name: Install the toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list tbb   >/dev/null 2>&1 || brew install tbb
          brew list llvm  >/dev/null 2>&1 || brew install llvm
          echo "CC=$(brew --prefix llvm)/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      # An exit status says the tool ran, not that it did what was asked.
      - name: Report the toolchain actually in use
        run: |
          if [ -n "${CXX:-}" ]; then
            command -v "$CXX" || { echo "::error::$CXX is not on PATH"; exit 1; }
            "$CXX" --version
          else
            echo "No CXX set; the preset selects the compiler (Windows/MSVC)."
          fi
          cmake --version

      # `--version` does not identify the compiler: Ubuntu ships post-release
      # snapshots of a branch under the release's version number, so a g++ reporting
      # 15.2.0 may be well beyond it. The changelog says which. The same is true of
      # a distro clang, so this reads the changelog of whichever package the column
      # installed rather than naming one compiler.
      - name: What the distribution's compiler actually is
        if: runner.os == 'Linux'
        # A report must not be able to fail the job - hence the trailing `|| true`,
        # and `sed` rather than `head`, since head exits early, gzip takes SIGPIPE,
        # and `-o pipefail` would turn a report into a failure.
        run: |
          pkg="${{ matrix.pkg || matrix.cxx }}"
          log=$(dpkg -L "$pkg" 2>/dev/null | grep -m1 'changelog.Debian.gz$' || true)
          if [ -n "$log" ]; then
            zcat "$log" | sed -n '1,20p' || true
          else
            echo "No Debian changelog found for $pkg; $CXX --version above is all we have."
          fi

      # The generated project's `git init` is followed by a commit, and git refuses
      # to commit without an identity. Every developer machine has one configured;
      # a fresh runner does not.
      - name: Give git an identity
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      # Once a generated project vendors a copy of sequoia inside itself, the
      # TestMaterials tree passes 260 characters. sequoia declares itself
      # long-path aware in resources/win/longpaths.manifest, but Windows also
      # requires the machine-wide switch, and git its own.
      #
      # In PowerShell because Git bash's MSYS layer rewrites bare switches like
      # /v and /f into Windows paths before reg.exe sees them.
      - name: Let Windows and git see long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled

      # A column may carry `exec_args` of its own, for a platform which cannot run the
      # whole suite. It replaces the tier's rather than adding to them, so a column
      # taking this route out of a tier which passes `--check-versioned-output` must
      # repeat it.
      - name: Configure
        working-directory: TestAll
        run: |
          # A column's exec_args replaces the tier's. `||` cannot express this: an
          # explicitly empty string is falsy, so a column asking for NO flags would
          # silently inherit the tier's. toJSON distinguishes absent from empty.
          if [ '${{ toJSON(matrix.exec_args) }}' = 'null' ]; then
            args='${{ inputs.exec_args }}'
          else
            args='${{ matrix.exec_args }}'
          fi
          cmake --preset ${{ matrix.configure }} \
                "-DEXEC_ARGS=$args" \
                -DWARNINGS_AS_ERRORS=${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}

      # Separate from the run below so a compile failure and a test failure are
      # distinguishable, and so the suite can carry its own ceiling. The log is kept
      # so warnings can be counted where they are not fatal.
      - name: Build
        working-directory: TestAll
        run: cmake --build --preset ${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Distinct sites rather than raw lines: gcc and clang repeat a warning once per
      # instantiation, so a raw count says more about templates than about code.
      # MSVC spells it "warning Cnnnn"; the others "warning:".
      - name: Report compiler warnings
        if: ${{ !inputs.warnings_as_errors }}
        run: |
          log="$RUNNER_TEMP/build.log"
          sites=$({ grep -oE '[^ ]+:[0-9]+:[0-9]+: warning:|warning C[0-9]+' "$log" || true; } | sort -u | wc -l | tr -d ' ')
          total=$(grep -cE 'warning:|warning C[0-9]+' "$log" || true)
          if [ "${sites:-0}" -gt 0 ]; then
            echo "::warning title=Compiler warnings::${{ matrix.name }}: $sites distinct site(s), $total line(s)"
            {
              echo "### ${{ matrix.name }}: $sites distinct warning site(s)"
              echo '```'
              grep -E 'warning:|warning C[0-9]+' "$log" | sort -u | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compiler warnings."
          fi

      # A `run-` preset is named `run-` plus the preset it runs, and builds the
      # `run` target, whose command is the test executable; the binary is already
      # built, so this step is the suite and nothing else.
      #
      # timeout-minutes on the step rather than timeout(1) around the command:
      # macOS ships no GNU coreutils, and the step form additionally distinguishes
      # "the suite timed out" from "the job timed out" in the run summary. One
      # branch has already spun for 36 minutes against an 18s baseline.
      # A column may set `advisory: true` to run without gating on the result, for
      # a platform whose failures are understood and being worked on. There is no
      # build-without-running option: a suite that is not run tells you nothing,
      # and the audit below refuses a column whose suite step did not run.
      #
      # The tee is safe only because `shell: bash` runs steps under
      # `--noprofile --norc -eo pipefail`: without pipefail the tee would donate its
      # own exit status to the step, which is how a red suite comes to look green.
      # The Build step above already depends on this; it is written down here
      # because the dependency is invisible at the call site.
      - name: Run the suite
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: TestAll
        timeout-minutes: 30
        run: cmake --build --preset run-${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/run.log"

      # An advisory column still has to be *read*, and its failures are not equally acceptable.
      # TestRunnerPerformanceTest asserts absolute wall-clock times - eight 25ms sleeps against a
      # 60ms +- 35 window - which a shared hosted runner cannot hold; the same commit has returned
      # 196ms and 603ms. Everything else is a defect.
      #
      # Classified by the *test that failed*, not by the summary row: those timing assertions are
      # `check(within_tolerance{...}, ...)`, which count in the standard row, since the performance
      # rows count `check_relative_performance` alone. Every failing file is named either way, so a
      # new one cannot hide behind a tolerated one.
      - name: Triage the advisory run
        if: ${{ always() && matrix.advisory == true }}
        run: |
          log="$RUNNER_TEMP/run.log"
          if [ ! -f "$log" ]; then
            echo "::error title=Advisory run::${{ matrix.name }}: the suite produced no log"
            exit 0
          fi

          # Tests whose failures are understood and tracked: roadmap items 38 and 102.
          tolerated_tests='TestRunnerPerformanceTest\.cpp'

          failing=$({ grep -oE 'Tests/[A-Za-z0-9/_]+\.cpp, Line [0-9]+' "$log" || true; } \
                      | sed 's/, Line.*//' | sort -u)
          actionable=$({ echo "$failing" | grep -vE "$tolerated_tests" || true; } | sed '/^$/d')

          {
            echo "### ${{ matrix.name }} - advisory run"
            echo ""
            if [ -n "$failing" ]; then
              echo "Failing tests:"
              echo '```'
              echo "$failing"
              echo '```'
            else
              echo "No failing tests."
            fi
            echo ""
            echo '```'
            sed -n '/Grand Totals/,$p' "$log" | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$actionable" ]; then
            echo "::error title=Advisory run needs action::${{ matrix.name }}: $(echo "$actionable" | tr '\n' ' '). This column does not gate, so the job is green; the failures are real."
          elif [ -n "$failing" ]; then
            echo "::warning title=Advisory run::${{ matrix.name }}: only the timing assertions this runner cannot hold (roadmap 38, 102). Nothing to act on."
          else
            echo "::notice title=Advisory run::${{ matrix.name }}: the suite passed outright."
          fi

      # Kept with the artifact so an advisory column can be reviewed after the fact,
      # rather than only through the annotations.
      - name: Keep the run log
        if: always()
        run: |
          mkdir -p run-log
          cp "$RUNNER_TEMP/run.log" run-log/ 2>/dev/null || true

      # Where drift detection is on, the switch fails the run but reports only
      # that a bit is set; this names the files. It also sees the whole tree,
      # where the switch sees only what this toolchain rewrites, and `git status`
      # names a file the run added, which `git diff` would not.
      - name: Name any file whose versioned output moved
        if: always()
        run: git status --short -- output/ TestMaterials/ || true

      - name: Upload the run's output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build }}-output
          path: |
            output/TestSummaries/
            output/DiagnosticsOutput/
            output/TestsTemporaryData/TestFramework/TestRunnerEndToEndFreeTest/WorkingCopy/InitOutput/
            run-log/
          if-no-files-found: warn

  # A column that reported without running the suite looks exactly like one that
  # passed: `gh run list` says success either way, and so does the tick. It has
  # happened - for a day in 2026-09-08/09 every column of every tier skipped the
  # run and went green. This reads the run's own jobs back through the API and
  # insists that each column named in `columns` exists, once, and that its
  # `Run the suite` step concluded - success or failure, but not skipped and not
  # absent. Passing is the column's own business; RUNNING is checked here. The
  # expectation is the columns input itself, so there is no second list to drift.
  audit:
    name: Every column ran the suite
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COLUMNS: ${{ inputs.columns }}
    steps:
      - name: Read this run's jobs back and check each column's suite step
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate --jq '.jobs[]' \
            | jq -s . > jobs.json
          echo "jobs in this run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          jq -r '.[].name' <<<"$EXPECTED_COLUMNS" > expected.txt
          [ -s expected.txt ] || { echo "::error::no columns to audit"; exit 1; }

          failed=0
          while IFS= read -r column; do
            verdict=$(jq -r --arg c "$column" '
              [.[] | select(.name | endswith(" / " + $c))]
              | if length != 1 then "JOBS:\(length)"
                else ([.[0].steps[] | select(.name == "Run the suite") | .conclusion] | first) // "ABSENT"
                end' jobs.json)
            case "$verdict" in
              success|failure) echo "ok    $column: Run the suite -> $verdict";;
              JOBS:*)          echo "::error::$column: expected exactly one job, found ${verdict#JOBS:}"; failed=1;;
              *)               echo "::error::$column: Run the suite -> $verdict; the suite did not run on this column"; failed=1;;
            esac
          done < expected.txt
          exit $failed
