# Scratch: overshoot probe for roadmap item 374; never merged
name: scratch-win-timer-probe
on:
  push:
    branches: [scratch-win-timer-probe]
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-latest-b, windows-2022]
    runs-on: ${{ matrix.os == 'windows-latest-b' && 'windows-latest' || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        run: |
          set -o pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          root=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          echo "VS at $root; image $ImageOS $ImageVersion"
          cmd //c build_and_run.bat "$(cygpath -w "$root")\\VC\\Auxiliary\\Build\\vcvars64.bat"
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set -o pipefail
          echo "image $ImageOS $ImageVersion"; g++ --version | head -1
          g++ -std=c++20 -O2 probe.cpp -o probe_release -pthread
          g++ -std=c++20 -O0 -g probe.cpp -o probe_debug -pthread
          for b in release debug; do for m in "default" "default load"; do echo "===== $b $m"; ./probe_$b $m; done; done
