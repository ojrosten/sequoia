name: performance-against-reference

# Whether the runner has slowed down. PerformanceAgainstReference builds one
# project of tests which do little twice: against the tree under test, the
# candidate, and against an earlier tree, the reference. Its checks fail if the
# candidate's runner takes distinguishably longer than a fixed multiple of the
# reference's time to run the tests, net of a request for help, or to answer a
# request for help alone. The two builds' runs interleave, in one job on one
# machine, so the comparison needs no stored record of any machine's speed.
#
# On a pull request, the candidate is GitHub's merge of the pull request into
# its base, the commit the other tiers test, and the reference is that merge's
# first parent, the tip of the base. So the comparison sees the pull request's
# change alone, and a slowdown spread over many pull requests, each within the
# bound, passes every one of them.
#
# Once a week, and on dispatch, the candidate is instead the branch's tip and
# the reference the anchor: the commit .github/performance-anchor names, which
# must be an ancestor of the candidate. That comparison sees the slowdown
# accumulated since the anchor, but not which pull request caused it; the
# per-pull-request comparison says that. Moving the anchor, by a reviewed
# commit, accepts the slowdown up to the new anchor. The anchor alone would not
# do: speed-ups since the anchor would leave room for a regression to pass, a
# pull request that tipped accumulated drift over the bound would be blamed for
# all of it, and an anchor the current toolchain no longer builds would fail
# every pull request at once.
#
# The columns are Linux · GCC · Debug and Windows · MSVC · Debug, the latter
# since MSVC's debug build is among the slowest a user runs. The test's bound,
# 1.05, rests on measurements of 2026-10-30, on hosted ubuntu-26.04 runners
# whose CPUs were AMD EPYC 7763, 9V45 and 9V74, and Intel Xeon 6973P-C and
# Platinum 8573C. The checks ran with a bound of 1.1, and each printed its
# interval of speed-ups. A check stops at its first attempt that passes, so the
# outcome at 1.05 of a check that passed at 1.1 follows from its interval only
# if the interval's upper end lies above 0.952:
#   - 600 checks compared trees that do not differ in what the runner does: one
#     commit built twice, and two pairs of neighbouring commits of staging.
#     None failed. No interval's upper end lay below 0.973, so none would
#     fail at 1.05 either.
#   - 180 checks gave the candidate a known regression: prepare_materials
#     removing the previous run's materials on the test's own thread, the
#     moved{false} mutant. At 1.1, 160 failed; 18 of the 20 that passed ran on
#     a Xeon 8573C. At 1.05, from 164 to 178 would fail.
#   - On hosted Windows runners (MSVC, Ninja, EPYC 7763), none of 60 checks of
#     one commit built twice would fail at 1.05, and the regression above
#     failed 19 of 20 at 1.1, and from 19 to 20 would fail at 1.05.
#   - On hosted macOS runners, up to 3 of 140 checks of one commit built twice
#     would fail at 1.05, and the regression above failed none of 80 at 1.1.
#     So macOS has no column.
# A confirmation pass at 1.05 itself, 2026-11-01, each check 20 times per job:
#   - One commit built twice: none of 80 serial-run checks, and none of 80
#     checks of a request for help, failed on Linux (EPYC 7763 and 9V45, Xeon
#     8370C and 8573C), and none of 40 and 40 on Windows (EPYC 7763, Xeon
#     8370C).
#   - The moved{false} mutant: the serial-run check failed 78 of 80 on Linux,
#     both passes on a Xeon 8573C, and 38 of 40 on Windows, both passes on an
#     EPYC 9V74. The check of a request for help alone, whose work the mutant
#     does not touch, failed none of 80 and 40.
# A start-up mutant, 2026-11-02: a 50 ms sleep at the top of test_runner's
# constructor, in the candidate alone, each check 5 times per job:
#   - The check of a request for help alone failed 20 of 20 on Linux (EPYC
#     7763 and 9V45), at speed-ups from 0.08 to 0.12, and 20 of 20 on Windows
#     (EPYC 7763 and 9V74), from 0.37 to 0.41. The serial-run check, net of a
#     request for help, failed none of 20 and 20.
#   - Without the mutant, neither check failed in 10 runs on Linux (EPYC 7763
#     and 9V45), nor in 10 on Windows (EPYC 7763 and 9V74).
#
# The workflow runs on every pull request whose change the suite reads, as
# scope.yml decides, and on every scheduled or dispatched run. With nothing to
# test, the job is skipped rather than passed, which wedges a pull request only
# if the check is made required.
on:
  pull_request:
  # Early Sunday, an hour after the nightly's tick, to spread the runners'
  # load. The minute is off the hour, as rigorous.yml's is.
  schedule:
    - cron: '1 2 * * 0'
  workflow_dispatch:

# A push to a pull request cancels that pull request's run in flight.
# Scheduled and dispatched runs each get a group of their own, so nothing
# cancels them, as in rigorous.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  compare:
    name: ${{ matrix.name }}
    needs: scope
    if: ${{ needs.scope.outputs.suite == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'Linux · GCC · Debug',    os: ubuntu-26.04,   preset: gcc-env, cc: gcc-15, cxx: g++-15}
          - {name: 'Windows · MSVC · Debug', os: windows-latest, preset: msvc-ninja}
    defaults:
      run:
        shell: bash
    steps:
      # On a pull request, the merge and both its parents. Against the anchor,
      # the whole history, so that the anchor's ancestry can be checked, without
      # the blobs of commits not checked out, as in watchdog.yml.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: ${{ github.event_name != 'pull_request' && 'blob:none' || '' }}

      # Before the reference's worktree, whose paths under RUNNER_TEMP reach 249
      # characters of Windows' 260, and the workload's nested builds, 236.
      # Shortened from tests.yml's step of the same name, which says why.
      - name: Let Windows and git see long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
                           -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null

      # HEAD^1 is the base's tip only if HEAD is GitHub's merge. An anchor that
      # is not an ancestor of HEAD would measure a branch's divergence rather
      # than the slowdown since the anchor.
      - name: Check out the reference
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git rev-parse --verify -q HEAD^2 > /dev/null \
              || { echo "::error::$(git rev-parse HEAD) is not a merge, so HEAD^1 is not the base's tip"; exit 1; }
            reference=$(git rev-parse HEAD^1)
          else
            anchor=$(< .github/performance-anchor)
            # A name such as main would move with the candidate.
            [[ $anchor =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::.github/performance-anchor holds '$anchor', which is no full commit hash"; exit 1; }
            reference=$(git rev-parse --verify -q "$anchor^{commit}") \
              || { echo "::error::.github/performance-anchor names '$anchor', which is no commit"; exit 1; }
            git merge-base --is-ancestor "$reference" HEAD \
              || { echo "::error::the anchor $reference is not an ancestor of $(git rev-parse HEAD)"; exit 1; }
          fi
          git worktree add --detach "$RUNNER_TEMP/reference" "$reference"
          echo "Candidate $(git rev-parse HEAD), reference $reference"

      # Copied from tests.yml's "Install the toolchain (Linux)", which says why
      # each part exists; symbol-table.yml holds another copy. A change to how
      # tests.yml installs belongs here too. gdb is left out, since nothing
      # here reads a stack.
      - name: Install the toolchain (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo scripts/retry.sh 3 180 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh update -qq --error-on=any \
            || { echo "::error::apt-get update failed: each attempt above says why"; exit 1; }
          packages=("$CXX" ninja-build libtbb-dev)
          names=$(apt-cache pkgnames)
          for pkg in "${packages[@]}"; do
            grep -qFx -- "$pkg" <<< "$names" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo scripts/retry.sh 3 300 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh \
            install -y --download-only "${packages[@]}"
          sudo apt-get install -y --no-download "${packages[@]}"
          "$CXX" --version
          cmake --version

      # Shortened from tests.yml's step of the same name, which says why each
      # part exists, and tests.yml's MSVC step names this copy.
      - name: Enter the MSVC environment (Windows, Ninja)
        if: runner.os == 'Windows'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          root=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          [ -n "$root" ] || { echo "::error::no VC toolset reported by vswhere"; exit 1; }
          vcvars="$(cygpath -u "$root")/VC/Auxiliary/Build/vcvars64.bat"
          [ -f "$vcvars" ] || { echo "::error::$vcvars does not exist"; exit 1; }
          bat="$RUNNER_TEMP/vcvars_dump.bat"
          printf '@echo off\r\necho PATH_BEFORE=%%PATH%%\r\ncall "%s" >nul || exit /b 1\r\nset\r\n' "$(cygpath -w "$vcvars")" > "$bat"
          dump=$(cmd //c "$(cygpath -w "$bat")" | tr -d '\r')
          printf '%s\n' "$dump" | grep -iE '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=' >> "$GITHUB_ENV"
          before=$(printf '%s\n' "$dump" | grep '^PATH_BEFORE=' | sed 's/^[^=]*=//' | tr ';' '\n')
          after=$(printf '%s\n' "$dump"  | grep -iE '^PATH='     | sed 's/^[^=]*=//' | tr ';' '\n')
          added=$(printf '%s\n' "$after" | grep -vxF -f <(printf '%s\n' "$before") | grep -v '^$' | grep -vF 'CommonExtensions\Microsoft\CMake\')
          printf '%s\n' "$added" >> "$GITHUB_PATH"
          PATH="$(cygpath -pu "$(printf '%s\n' "$added" | paste -sd ';')"):$PATH" command -v ninja \
            || choco install ninja -y

      # The comparison's spread depends on the host, so the log names it.
      - name: Report the runner's hardware
        timeout-minutes: 1
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux)   cpu=$(grep -m1 '^model name' /proc/cpuinfo | sed 's/^[^:]*: //' || true) ;;
            Windows) cpu=$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' || true); cpu=${cpu%$'\r'} ;;
          esac
          echo "CPU: $cpu"
          echo "Logical processors: $(getconf _NPROCESSORS_ONLN || true)"

      - name: Configure
        working-directory: PerformanceAgainstReference
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: PerformanceAgainstReference
        run: cmake --build --preset ${{ matrix.preset }}

      # The test builds the workload twice before it times anything, so most
      # of this step is compilation.
      - name: Compare the runner's performance with the reference's
        working-directory: build/PerformanceAgainstReference/${{ matrix.preset }}
        run: ./PerformanceAgainstReference --check-versioned-output --reference-root "$RUNNER_TEMP/reference"
