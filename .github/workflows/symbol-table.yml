name: symbol-table

# Records the symbol table of the commit at the head of each push to staging,
# and stores the record on the data branch `metrics`, at
# symbol-table/linux-gcc-debug/<commit>.json. The branch holds the history of
# TestAll's symbol table, which no artifact could, since artifacts expire.
# A dispatch with a list of commits records each commit in the list, in a job
# of its own. A backfill records commits older than the workflow this way.
# A commit whose presets lack `gcc-env`, as every commit before 2026-09-06
# does, cannot be recorded: its job fails at "Configure".
# scripts/symbol_table_report.py says what a record holds, and
# scripts/symbol_table_provenance.py what it adds to it. The step which adds
# the count of prune's analysis, and the step which adds the cost of leftover
# materials, each also adds `cpu_model` to its section: the model name of the
# CPU of the runner which ran the job. scripts/store_symbol_table_record.sh
# says how the store treats it.
#
# The workflow builds TestAll and runs its suite once, only to leave prune a
# stamp. It then runs `TestAll prune` under callgrind, to count the
# instructions of prune's analysis. A record carries the count as
# `prune_dependency_analysis`, with the exit status of the stamping run, which
# the dashboard does not plot. The workflow is apart from the tiers, so that a
# failure to measure cannot fail a test column, and cancelling a superseded
# run of a tier loses no record.
#
# After prune's measurement, the workflow builds TestFrameworkDiagnostics, the
# executable which tests the test runner, and runs its suite twice under
# callgrind: first with no materials left by an earlier run, then with those
# which the first run left. Each run counts what the runner does while it sets
# tests up, not what the tests do. A record carries the counts as
# `leftover_materials_setup`, with the number of entries which the second run
# found left, and for each run its instructions and the number of tests it
# executed. The second run's instructions less the first run's are what the
# leftover materials cost the runner's setup. Running callgrind twice adds
# about 6 minutes to the job. A record made before this step existed may hold
# `runner_setup`, the counts of one run: no step writes it now.
#
# A commit already recorded can be recorded again, to add the fields its
# record lacks, such as `prune_dependency_analysis` or
# `leftover_materials_setup`. The job rebuilds what the counts need, and the
# store replaces the held record with one which keeps every field and adds the
# new ones (scripts/store_symbol_table_record.sh). A commit whose runner leaves
# prune no stamp is recorded without the field, and its job succeeds.
#
# Every job uploads its record as an artifact. A run dispatched on a branch
# other than staging stores nothing.
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      commits:
        description: >-
          The commits to record, as a JSON array of full lowercase hashes, each
          on the first-parent history of the commit the run is dispatched on.
          If empty, that commit.
        type: string
        default: ''

# The workflow has no concurrency group, since each push to staging stores
# its own commit's record. A group cancels runs even without
# cancel-in-progress: GitHub keeps one pending run per group, and cancels it
# when a newer run joins the group. Two runs may store at once: each record is
# a file of its own, and scripts/store_symbol_table_record.sh retries a push
# which another run beat.

jobs:
  symbol-table:
    name: Symbol table · Linux · GCC · Debug
    # Each job builds one commit with that commit's presets. It installs the
    # toolchain, measures and stores with the steps and the scripts of the
    # commit the run is on, so that an old commit is measured as a push to
    # staging would measure it today.
    strategy:
      fail-fast: false
      # Without a cap, a backfill of more commits than the account may run
      # jobs at once would take every runner, and the tiers' jobs would queue
      # behind it.
      max-parallel: 5
      matrix:
        commit: ${{ fromJSON(inputs.commits || format('["{0}"]', github.sha)) }}
    # The configuration of coarse's Linux column, so that a move in the
    # records is a move in a build which coarse tests.
    #
    # The runner, the compiler and the packages are named here, as they stood
    # in coarse's column on 2026-10-22, and do not follow a later change to
    # it. The presets are shared, so at every commit the record and coarse's
    # column build with the same presets. Each record names its toolchain, so
    # a change of toolchain shows as a break in the history.
    runs-on: ubuntu-26.04
    # The job also builds TestFrameworkDiagnostics and runs it twice under
    # callgrind, which is many times slower than a native run. The timeout
    # allows for all three.
    timeout-minutes: 75
    # "Store the record on the data branch" pushes, which needs
    # `contents: write`. The job asks for it, so that it keeps working if the
    # repository's default token becomes read-only.
    permissions:
      contents: write
    # As in tests.yml, so that a failure within a pipe fails its step.
    defaults:
      run:
        shell: bash
    env:
      CC: gcc-15
      CXX: g++-15
      DATA_BRANCH: metrics
    steps:
      # Two checkouts, side by side: `tooling`, the commit the run is on,
      # whose steps install the toolchain, measure and store; and `tree`, the
      # commit measured. The build writes only to tree/build, which the
      # tree's .gitignore lists, so the tree stays clean, as the store
      # requires. On a push both are github.sha.
      #
      # `tooling` holds the run's commit's whole history, without trees or
      # blobs, so that the history can be checked below. git fetches a tree
      # or a blob from the remote when a command needs it.
      - name: Check out the tooling
        uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          filter: tree:0

      - name: Check out the commit to record
        uses: actions/checkout@v7
        with:
          path: tree
          ref: ${{ matrix.commit }}
          fetch-depth: 1

      # actions/checkout takes a ref which is not a full hash as a branch or
      # a tag, so the commit checked out could differ from the one asked for.
      - name: Check that the commit checked out is the commit asked for
        env:
          COMMIT: ${{ matrix.commit }}
        run: |
          checked_out=$(git -C tree rev-parse HEAD)
          [ "$checked_out" = "$COMMIT" ] \
            || { echo "::error::The commit checked out is $checked_out, not '$COMMIT'"; exit 1; }

      # A record stays on the data branch once stored, since nothing rewrites
      # the branch. So the job refuses, before building, a commit off the
      # first-parent history of the run's commit: a commit of a merged topic
      # branch, as well as a commit of a branch never merged. grep reads the
      # whole list, so that rev-list never meets a closed pipe.
      - name: Check that the commit checked out is on the run's first-parent history
        run: |
          checked_out=$(git -C tree rev-parse HEAD)
          git -C tooling rev-list --first-parent HEAD | grep -xF "$checked_out" > /dev/null \
            || { echo "::error::$checked_out is not on the first-parent history of $GITHUB_SHA"; exit 1; }

      # tests.yml is the tiers' one recipe for building and running the
      # suite. This job runs no suite, so it copies the steps it needs from
      # tests.yml's "Install the toolchain (Linux)", "Configure" and "Build",
      # which say why each part exists. A change to how tests.yml installs
      # (the retries, the repositories removed) belongs here too; a change of
      # toolchain does not, as above.
      #
      # The copy leaves out gdb, which reads a failed suite's stacks. It
      # configures without EXEC_ARGS, which only the `run` target reads, and
      # without WARNINGS_AS_ERRORS, whose default is coarse's value, OFF.
      - name: Install the toolchain
        working-directory: tooling
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo scripts/retry.sh 3 180 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh update -qq --error-on=any \
            || { echo "::error::apt-get update failed: each attempt above says why"; exit 1; }
          packages=("$CXX" ninja-build libtbb-dev)
          names=$(apt-cache pkgnames)
          for pkg in "${packages[@]}"; do
            grep -qFx -- "$pkg" <<< "$names" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo scripts/retry.sh 3 300 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh \
            install -y --download-only "${packages[@]}"
          sudo apt-get install -y --no-download "${packages[@]}"
          "$CXX" --version
          cmake --version

      - name: Configure
        working-directory: tree/TestAll
        run: cmake --preset gcc-env

      - name: Build
        working-directory: tree/TestAll
        run: cmake --build --preset gcc-env

      - name: Record the symbol table
        run: |
          mkdir "$RUNNER_TEMP/symbol-table"
          symbol_table_record="$RUNNER_TEMP/symbol-table/linux-gcc-debug.json"
          python3 -B tooling/scripts/symbol_table_report.py tree/build/TestAll/gcc-env TestAll \
            > "$RUNNER_TEMP/report.json"
          python3 -B tooling/scripts/symbol_table_provenance.py "$RUNNER_TEMP/report.json" \
            > "$symbol_table_record"
          jq -c '{commit, clean, executable, toolchain}' "$symbol_table_record"
          echo "SYMBOL_TABLE_RECORD=$symbol_table_record" >> "$GITHUB_ENV"

      # The instruction count of prune's dependency analysis, as a field of
      # the record. These steps are tolerated to fail: a record without the
      # field is a record, and a failure to measure must not lose the symbol
      # table. They follow "Record the symbol table", which measures before
      # the suite writes into the tree.
      #
      # `TestAll prune` runs the tests which are stale, and runs every test
      # when the previous run has left no stamp. So one full run of the suite,
      # whose outcome is ignored, leaves the stamp, and the measured run then
      # selects only what the stamping run failed or left out: nothing, when
      # the suite passes. As in tests.yml, git is given an identity before the
      # suite runs. The stamping run's exit status goes in the record, so that
      # a failing run can be told apart if its count ever stands out.
      #
      # callgrind counts the instructions, since only callgrind has the option
      # --toggle-collect. With it, callgrind collects while inside
      # test_runner::prune and the functions it calls, so the count is of the
      # analysis alone, not of the runner's startup or of any test the measured
      # run executes. The name is matched, with wildcards, against the
      # demangled name, which may or may not carry the parameter list, so the
      # pattern ends in `*`. A count of zero means no function matched, as when
      # prune is renamed, and the record has no field.
      - name: Install valgrind
        continue-on-error: true
        run: sudo apt-get install -y valgrind

      - name: Give git an identity
        continue-on-error: true
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      - name: Leave prune a stamp, with one run of the suite
        continue-on-error: true
        timeout-minutes: 30
        working-directory: tree/build/TestAll/gcc-env
        run: |
          status=0
          ./TestAll || status=$?
          echo "$status" > "$RUNNER_TEMP/stamping_exit_status.txt"
          [ "$status" -eq 0 ] || echo "The suite failed (status $status), which this step ignores; the record will say so."

      - name: Count the instructions of prune's analysis
        continue-on-error: true
        timeout-minutes: 30
        working-directory: tree/build/TestAll/gcc-env
        run: |
          function='sequoia::testing::test_runner::prune*'
          # The job's shell sets pipefail, so a failing run reaches the || through tee.
          valgrind --tool=callgrind --toggle-collect="$function" --callgrind-out-file="$RUNNER_TEMP/callgrind.out" \
            ./TestAll prune --serial 2>&1 | tee "$RUNNER_TEMP/measured.txt" \
            || echo "The measured run failed, which this step ignores; its count stands."
          # The count stands only if the analysis ran and selected from the stamp. An
          # older commit's runner may not have left a stamp, or may not take the
          # arguments, and then prune runs every test, or nothing, under callgrind.
          if ! grep -qF 'Analyzing dependencies' "$RUNNER_TEMP/measured.txt" \
             || grep -qE 'unable to prune|prune is ignored' "$RUNNER_TEMP/measured.txt"; then
            echo "::warning::prune did not analyse from a stamp, so the record has no prune_dependency_analysis"
            exit 0
          fi
          # The file holds "summary: <Ir>" and "totals: <Ir>", of the events collected
          # inside the function; the count stands only if both are there and equal.
          instructions=$(awk '$1 == "summary:" {print $2}' "$RUNNER_TEMP/callgrind.out" 2>/dev/null)
          totals=$(awk '$1 == "totals:" {print $2}' "$RUNNER_TEMP/callgrind.out" 2>/dev/null)
          case "$instructions" in
            ''|*[!0-9]*|0)
              echo "::warning::no instructions were collected inside '$function' (summary '${instructions}'), so the record has no prune_dependency_analysis"
              exit 0;;
          esac
          if [ "$totals" != "$instructions" ]; then
            echo "::warning::callgrind's summary ($instructions) and totals ('${totals}') differ or are missing, so the record has no prune_dependency_analysis"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/stamping_exit_status.txt" ]; then
            echo "::warning::the stamping run left no exit status, so the record has no prune_dependency_analysis"
            exit 0
          fi
          jq -n --argjson instructions "$instructions" --arg function "$function" \
            --argjson stamping_exit_status "$(cat "$RUNNER_TEMP/stamping_exit_status.txt")" \
            '{function: $function, instructions: $instructions, stamping_exit_status: $stamping_exit_status}' \
            > "$RUNNER_TEMP/prune_dependency_analysis.json"

      # Counts what the runner does while it sets tests up, as instructions,
      # once with no materials left by an earlier run and once with the
      # materials which that run left. TestFrameworkDiagnostics is a project of
      # its own, which "Build" does not build, so it is built here, and run
      # under callgrind after the measurement of prune: its runs write stamps
      # of their own, and callgrind slows a run, neither of which may touch
      # prune's count. It is the smaller suite, so each run under callgrind, many times
      # slower than a native run even while collection is off, is of a length
      # which a step can allow.
      #
      # test_to_run::execute runs once per test. The test runs in
      # execution_timer::time_execution, which times it, and the runner's work
      # for the test is what is left of execute. --toggle-collect toggles
      # collection on entry to, and on exit from, each function it names, and
      # implies that collection is off at the start. So collection switches on
      # when a test's execute starts, off inside time_execution, and on again
      # after it, and the counts are of execute outside the tests. The names
      # are matched, with wildcards, against the demangled name, which carries
      # the parameter list, so execute is named both with and without the
      # list. The pattern `execute*` would also match execute_and_record,
      # whose lambda is the test and would switch collection on inside it. The
      # return type of a function template is part of its demangled name, so
      # time_execution's pattern begins with `*`.
      #
      # A test's execute clears the materials which an earlier run left for the
      # test. The first run follows the removal of output/TestsTemporaryData,
      # so it finds none. The second run finds the tree which the first left,
      # so the measurement does not depend on an earlier step having left one.
      # The second run's instructions less the first run's are the work which
      # clearing leftover materials adds on the thread running the tests.
      # Collection is per thread, so work on another thread is not counted.
      #
      # The step counts the entries of the tree between the runs, and wraps
      # `find` so that an absent tree counts as none, since a failed command
      # in a pipe fails the step. A record whose count is 0 is still written:
      # it says that the second run found nothing to clear, so that the
      # difference measures nothing. The dashboard is to read the count for
      # that; no code of its reads it yet.
      #
      # --collect-systime=yes adds the event sysCount, which
      # scripts/runner_setup_record.sh requires and the section leaves out.
      # The runs are serial, as collection is switched by the thread which runs
      # the test. The tests are not counted from callgrind's calls into
      # execute: the runner's own tests run runners of their own, whose calls
      # into execute callgrind counts but does not collect, since it toggles
      # collection only on the call at recursion depth 0. They are counted from
      # the runner's execution records, a file for each test the run executed,
      # so the directory is emptied before each run.
      # scripts/runner_setup_record.sh reads the totals and the records of each
      # run, and scripts/leftover_materials_setup_record.sh joins the two. The
      # `boundary` must change whenever the functions counted, the executable,
      # its options or the construction of the two runs do.
      #
      # --exclude-performance leaves out the performance tests: they are timed
      # by the clock, so they retry and report according to the speed of the
      # machine, which moved the count by 0.34% between two runs of one commit,
      # and callgrind's slowing of the run can fail them. The spread without
      # them is in scripts/store_symbol_table_record.sh.
      #
      # `exclude OutputFreeTest.cpp` leaves out the one test file with a check
      # which fails under callgrind: "Long double values in a class-type
      # template argument" fails there, most likely because valgrind computes
      # x87 80-bit arithmetic at 64-bit precision.
      - name: Build TestFrameworkDiagnostics
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tree/TestFrameworkDiagnostics
        run: |
          cmake --preset gcc-env
          cmake --build --preset gcc-env

      - name: Count the setup cost of leftover materials
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tree/build/TestFrameworkDiagnostics/gcc-env
        run: |
          execute='sequoia::testing::test_to_run::execute'
          timed='*sequoia::testing::test_to_run::execution_timer::time_execution*'
          records="$GITHUB_WORKSPACE/tree/output/ExecutionRecords/TestFrameworkDiagnostics/gcc-env"
          materials="$GITHUB_WORKSPACE/tree/output/TestsTemporaryData"
          boundary="test_to_run::execute outside execution_timer::time_execution, TestFrameworkDiagnostics --serial --exclude-performance exclude OutputFreeTest.cpp, a run with no output/TestsTemporaryData and the run after it"
          scripts="$GITHUB_WORKSPACE/tooling/scripts"

          # measure <name>: one run under callgrind, with no execution records
          # of an earlier run, and its counts in $RUNNER_TEMP/<name>.json
          measure() {
            local status=0 out="$RUNNER_TEMP/$1.callgrind.out"
            rm -rf "$records"
            valgrind --tool=callgrind --collect-systime=yes \
              --toggle-collect="$execute" --toggle-collect="$execute(*" --toggle-collect="$timed" \
              --callgrind-out-file="$out" ./TestFrameworkDiagnostics --serial --exclude-performance exclude OutputFreeTest.cpp > "$RUNNER_TEMP/$1_suite.txt" 2>&1 || status=$?
            tail -n 30 "$RUNNER_TEMP/$1_suite.txt"
            "$scripts/runner_setup_record.sh" "$out" "$records" "$status" "$boundary" > "$RUNNER_TEMP/$1.json"
          }

          rm -rf "$materials"
          measure fresh
          previous_entries=$({ find "$materials" -mindepth 1 || true; } | wc -l | tr -d ' ')
          measure seeded
          "$scripts/leftover_materials_setup_record.sh" "$RUNNER_TEMP/fresh.json" "$RUNNER_TEMP/seeded.json" "$previous_entries" \
            > "$RUNNER_TEMP/leftover_materials_setup.json"
          cat "$RUNNER_TEMP/leftover_materials_setup.json"

      # The model name is read where the section is added, so that a refusal
      # to read it costs the section and not the record.
      - name: Add the count of prune's analysis to the record
        id: add_analysis
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/prune_dependency_analysis.json" ]; then
            cpu_model=$(python3 -B tooling/scripts/symbol_table_provenance.py --cpu-model)
            jq -S --slurpfile analysis "$RUNNER_TEMP/prune_dependency_analysis.json" --arg cpu_model "$cpu_model" \
              '. + {prune_dependency_analysis: ($analysis[0] + {cpu_model: $cpu_model})}' \
              "$SYMBOL_TABLE_RECORD" > "$RUNNER_TEMP/with_analysis.json"
            mv "$RUNNER_TEMP/with_analysis.json" "$SYMBOL_TABLE_RECORD"
          else
            echo "::warning::prune's analysis was not measured, so the record has no prune_dependency_analysis"
          fi

      - name: Add the setup cost of leftover materials to the record
        id: add_leftover
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/leftover_materials_setup.json" ]; then
            cpu_model=$(python3 -B tooling/scripts/symbol_table_provenance.py --cpu-model)
            jq -S --slurpfile leftover "$RUNNER_TEMP/leftover_materials_setup.json" --arg cpu_model "$cpu_model" \
              '. + {leftover_materials_setup: ($leftover[0] + {cpu_model: $cpu_model})}' \
              "$SYMBOL_TABLE_RECORD" > "$RUNNER_TEMP/with_leftover.json"
            mv "$RUNNER_TEMP/with_leftover.json" "$SYMBOL_TABLE_RECORD"
          else
            echo "::warning::the setup cost of leftover materials was not counted, so the record has no leftover_materials_setup"
          fi

      - name: Say that prune's analysis was lost
        if: steps.add_analysis.outcome == 'failure'
        run: echo "::warning::adding prune's analysis failed, so the record has no prune_dependency_analysis"

      - name: Say that the setup cost of leftover materials was lost
        if: steps.add_leftover.outcome == 'failure'
        run: echo "::warning::adding the setup cost of leftover materials failed, so the record has no leftover_materials_setup"

      - name: Upload the record
        uses: actions/upload-artifact@v7
        with:
          name: symbol-table-linux-gcc-debug-${{ matrix.commit }}
          path: ${{ env.SYMBOL_TABLE_RECORD }}
          if-no-files-found: error

      - name: Store the record on the data branch
        if: github.ref == 'refs/heads/staging'
        working-directory: tooling
        run: |
          scripts/store_symbol_table_record.sh origin "$DATA_BRANCH" symbol-table/linux-gcc-debug \
            "$SYMBOL_TABLE_RECORD"

      - name: Store nothing off staging
        if: github.ref != 'refs/heads/staging'
        run: echo "Only a run on staging stores its record; this run is on $GITHUB_REF."
