name: symbol-table

# Records the symbol table of the commit at the head of each push to staging,
# and stores the record on the data branch `metrics`, at
# symbol-table/linux-gcc-debug/<commit>.json. The branch holds the history of
# TestAll's symbol table, which no artifact could, since artifacts expire.
# A dispatch with a list of commits records each commit in the list, in a job
# of its own. A backfill records commits older than the workflow this way.
# A commit whose presets lack `gcc-env`, as every commit before 2026-09-06
# does, cannot be recorded: its job fails at "Configure".
# scripts/symbol_table_report.py says what a record holds, and
# scripts/symbol_table_provenance.py what it adds to it.
#
# The workflow builds TestAll and runs the suite as a test of nothing: its one
# run is to leave prune a stamp, for the instruction count of prune's
# analysis, which a record carries as `prune_analysis`. The workflow is
# apart from the tiers, so that a failure to measure cannot fail a test
# column, and cancelling a superseded run of a tier loses no record.
#
# A second run of the suite, after prune's measurement, is under
# `strace -f -c`, which counts the system calls of the runner and of everything
# it starts: a record carries the counts as `runner_overhead`, with the number
# of tests the run reported. The counts are totals for the run, so a move shows
# in the dashboard's per-test lines.
#
# A commit already recorded can be recorded again, to add the field
# `prune_analysis`: the job rebuilds TestAll, which the count needs, and the
# store replaces the held record with one which keeps its every field and
# adds fields (scripts/store_symbol_table_record.sh). A commit whose runner
# leaves prune no stamp is recorded without the field, and its job succeeds.
#
# Every job uploads its record as an artifact. A run dispatched on a branch
# other than staging stores nothing.
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      commits:
        description: >-
          The commits to record, as a JSON array of full lowercase hashes, each
          on the first-parent history of the commit the run is dispatched on.
          If empty, that commit.
        type: string
        default: ''

# The workflow has no concurrency group, since each push to staging stores
# its own commit's record. A group cancels runs even without
# cancel-in-progress: GitHub keeps one pending run per group, and cancels it
# when a newer run joins the group. Two runs may store at once: each record is
# a file of its own, and scripts/store_symbol_table_record.sh retries a push
# which another run beat.

jobs:
  symbol-table:
    name: Symbol table · Linux · GCC · Debug
    # Each job builds one commit with that commit's presets. It installs the
    # toolchain, measures and stores with the steps and the scripts of the
    # commit the run is on, so that an old commit is measured as a push to
    # staging would measure it today.
    strategy:
      fail-fast: false
      # Without a cap, a backfill of more commits than the account may run
      # jobs at once would take every runner, and the tiers' jobs would queue
      # behind it.
      max-parallel: 5
      matrix:
        commit: ${{ fromJSON(inputs.commits || format('["{0}"]', github.sha)) }}
    # The configuration of coarse's Linux column, so that a move in the
    # records is a move in a build which coarse tests. On 2026-10-21, removing
    # SEQUOIA_FORCE_INLINE from erased_target's constructor added 12,982
    # symbols (+1.91%) to this configuration's TestAll: the regression the
    # records exist to show.
    #
    # The runner, the compiler and the packages are named here, as they stood
    # in coarse's column on 2026-10-22, and do not follow a later change to
    # it. The presets are shared, so at every commit the record and coarse's
    # column build with the same presets. Each record
    # names its toolchain, so a change of toolchain shows as a break in the
    # history.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # "Store the record on the data branch" pushes, which needs
    # `contents: write`. The job asks for it, so that it keeps working if the
    # repository's default token becomes read-only.
    permissions:
      contents: write
    # As in tests.yml, so that a failure within a pipe fails its step.
    defaults:
      run:
        shell: bash
    env:
      CC: gcc-15
      CXX: g++-15
      DATA_BRANCH: metrics
    steps:
      # Two checkouts, side by side: `tooling`, the commit the run is on,
      # whose steps install the toolchain, measure and store; and `tree`, the
      # commit measured. The build writes only to tree/build, which the
      # tree's .gitignore lists, so the tree stays clean, as the store
      # requires. On a push both are github.sha.
      #
      # `tooling` holds the run's commit's whole history, without trees or
      # blobs, so that the history can be checked below. git fetches a tree
      # or a blob from the remote when a command needs it.
      - name: Check out the tooling
        uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          filter: tree:0

      - name: Check out the commit to record
        uses: actions/checkout@v7
        with:
          path: tree
          ref: ${{ matrix.commit }}
          fetch-depth: 1

      # actions/checkout takes a ref which is not a full hash as a branch or
      # a tag, so the commit checked out could differ from the one asked for.
      - name: Check that the commit checked out is the commit asked for
        env:
          COMMIT: ${{ matrix.commit }}
        run: |
          checked_out=$(git -C tree rev-parse HEAD)
          [ "$checked_out" = "$COMMIT" ] \
            || { echo "::error::The commit checked out is $checked_out, not '$COMMIT'"; exit 1; }

      # A record stays on the data branch once stored, since nothing rewrites
      # the branch. So the job refuses, before building, a commit off the
      # first-parent history of the run's commit: a commit of a merged topic
      # branch, as well as a commit of a branch never merged. grep reads the
      # whole list, so that rev-list never meets a closed pipe.
      - name: Check that the commit checked out is on the run's first-parent history
        run: |
          checked_out=$(git -C tree rev-parse HEAD)
          git -C tooling rev-list --first-parent HEAD | grep -xF "$checked_out" > /dev/null \
            || { echo "::error::$checked_out is not on the first-parent history of $GITHUB_SHA"; exit 1; }

      # tests.yml is the tiers' one recipe for building and running the
      # suite. This job runs no suite, so it copies the steps it needs from
      # tests.yml's "Install the toolchain (Linux)", "Configure" and "Build",
      # which say why each part exists. A change to how tests.yml installs
      # (the retries, the repositories removed) belongs here too; a change of
      # toolchain does not, as above.
      #
      # The copy leaves out gdb, which reads a failed suite's stacks. It
      # configures without EXEC_ARGS, which only the `run` target reads, and
      # without WARNINGS_AS_ERRORS, whose default is coarse's value, OFF.
      - name: Install the toolchain
        working-directory: tooling
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo scripts/retry.sh 3 180 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh update -qq --error-on=any \
            || { echo "::error::apt-get update failed: each attempt above says why"; exit 1; }
          packages=("$CXX" ninja-build libtbb-dev)
          names=$(apt-cache pkgnames)
          for pkg in "${packages[@]}"; do
            grep -qFx -- "$pkg" <<< "$names" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo scripts/retry.sh 3 300 -- scripts/apt_get_demoting_preferred_mirrors_on_retry.sh \
            install -y --download-only "${packages[@]}"
          sudo apt-get install -y --no-download "${packages[@]}"
          "$CXX" --version
          cmake --version

      - name: Configure
        working-directory: tree/TestAll
        run: cmake --preset gcc-env

      - name: Build
        working-directory: tree/TestAll
        run: cmake --build --preset gcc-env

      - name: Record the symbol table
        run: |
          mkdir "$RUNNER_TEMP/symbol-table"
          symbol_table_record="$RUNNER_TEMP/symbol-table/linux-gcc-debug.json"
          python3 -B tooling/scripts/symbol_table_report.py tree/build/TestAll/gcc-env TestAll \
            > "$RUNNER_TEMP/report.json"
          python3 -B tooling/scripts/symbol_table_provenance.py "$RUNNER_TEMP/report.json" \
            > "$symbol_table_record"
          jq -c '{commit, clean, executable, toolchain}' "$symbol_table_record"
          echo "SYMBOL_TABLE_RECORD=$symbol_table_record" >> "$GITHUB_ENV"

      # The instruction count of prune's dependency analysis, as a field of
      # the record. These steps are tolerated to fail: a record without the
      # field is a record, and a failure to measure must not lose the symbol
      # table. They follow "Record the symbol table", which measures before
      # the suite writes into the tree.
      #
      # `TestAll prune` runs the tests which are stale, and runs every test
      # when the previous run has left no stamp. So one full run of the suite,
      # whose outcome is ignored, leaves the stamp, and the measured run then
      # selects only what that run failed, or left out: nothing, when the
      # suite passes, which is why git is given an identity first. A failing
      # measured run still yields the count, so its outcome is ignored too.
      # The measured run
      # covers startup, the runner's reading of the build's records
      # (build.ninja, .ninja_deps) and its walk of the sources for changes,
      # and the file system reads of both; it does not cover the compiler.
      # cachegrind counts the instructions of the executable, and of the
      # libraries it calls, from the first to the last.
      - name: Install valgrind
        continue-on-error: true
        run: sudo apt-get install -y valgrind

      - name: Give git an identity
        continue-on-error: true
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      - name: Leave prune a stamp, with one run of the suite
        continue-on-error: true
        timeout-minutes: 30
        working-directory: tree/build/TestAll/gcc-env
        run: ./TestAll || echo "The suite failed, which this step ignores."

      - name: Count the instructions of prune's analysis
        continue-on-error: true
        timeout-minutes: 30
        working-directory: tree/build/TestAll/gcc-env
        run: |
          # The job's shell sets pipefail, so a failing run reaches the || through tee.
          valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file="$RUNNER_TEMP/cachegrind.out" \
            ./TestAll prune --serial 2>&1 | tee "$RUNNER_TEMP/measured.txt" \
            || echo "The measured run failed, which this step ignores; its count stands."
          # The count stands only if the analysis ran and selected from the stamp. An
          # older commit's runner may not have left a stamp, or may not take the
          # arguments, and then prune runs every test, or nothing, under cachegrind.
          if ! grep -qF 'Analyzing dependencies' "$RUNNER_TEMP/measured.txt" \
             || grep -qE 'unable to prune|prune is ignored' "$RUNNER_TEMP/measured.txt"; then
            echo "::warning::prune did not analyse from a stamp, so the record has no prune_analysis"
            exit 0
          fi
          # The file's summary line is "summary: <Ir>"
          instructions=$(awk '$1 == "summary:" {print $2}' "$RUNNER_TEMP/cachegrind.out")
          jq -n --argjson instructions "$instructions" \
            '{invocation: "TestAll prune --serial, after a full run, under cachegrind", instructions: $instructions}' \
            > "$RUNNER_TEMP/prune_analysis.json"

      # The runner's overhead, as system calls. The suite runs once more, under
      # strace, after the measurement of prune: the second run rewrites the
      # stamp, and strace slows the run, neither of which may touch prune's
      # count. `-f` follows every process and thread the runner starts; `-c`
      # prints strace's own table of counts, in strace's format, which
      # "Count the runner's system calls" reads. --seccomp-bpf stops the tracee
      # only at the system calls named. Only a verbose run prints a report of
      # "[Runner Overhead: ...]" under each test's name (and under a suite's
      # name, if the run is serial), so the run is verbose, and its output is
      # kept to count those reports. The run's outcome is ignored. If strace
      # cannot trace, as in a container which forbids ptrace, it leaves no
      # table and the record has no runner_overhead.
      - name: Install strace
        continue-on-error: true
        run: sudo apt-get install -y strace

      - name: Run the suite under strace
        continue-on-error: true
        timeout-minutes: 30
        working-directory: tree/build/TestAll/gcc-env
        run: |
          traced=(getdents64 getdents newfstatat statx fstat lstat stat openat open openat2 clone clone3 fork vfork execve execveat)
          status=0
          strace -f -qq --seccomp-bpf -c -e trace="$(IFS=,; echo "${traced[*]}")" -o "$RUNNER_TEMP/strace.txt" \
            ./TestAll --verbose > "$RUNNER_TEMP/suite.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/suite.txt"
          echo "$status" > "$RUNNER_TEMP/suite_exit_status.txt"

      - name: Count the runner's system calls
        continue-on-error: true
        run: |
          # The strace step leaves no table when strace could not trace.
          if [ ! -s "$RUNNER_TEMP/strace.txt" ] || [ ! -s "$RUNNER_TEMP/suite_exit_status.txt" ]; then
            echo "::warning::there is no table of counts, so the record has no runner_overhead"
            exit 0
          fi
          # strace -c prints "% time seconds usecs/call calls errors syscall" and a row
          # for each system call: the calls are the fourth field, the name the last, and
          # the errors are blank when there are none. The totals row is named "total".
          awk '$1 == "%" && $2 == "time" { ok = ($5 == "calls" && $NF == "syscall"); next }
               ok && $1 ~ /^[0-9]+[.][0-9]+$/ && $NF != "total" { print $NF, $4 }' \
            "$RUNNER_TEMP/strace.txt" > "$RUNNER_TEMP/syscall_counts.txt"
          [ -s "$RUNNER_TEMP/syscall_counts.txt" ] \
            || { echo "::warning::strace's table held no counts, so the record has no runner_overhead"; exit 0; }
          # The runner reports the overhead of each test, in the lines of its output
          # between the start and "Grand Totals", where a line holds only the report.
          # No count is taken of a run which did not reach its totals.
          tests=$(awk '/^-+Grand Totals-+$/ { reached = 1; exit }
                       /^[ \t]+\[Runner Overhead: [0-9.]+[a-z]+\]$/ { ++n }
                       END { if (reached && n > 0) print n }' "$RUNNER_TEMP/suite.txt")
          [ -n "$tests" ] || echo "::warning::the suite's output reports no tests, so runner_overhead has no count of them"
          jq -n -R --argjson tests "${tests:-null}" --argjson exit_status "$(cat "$RUNNER_TEMP/suite_exit_status.txt")" '
            [inputs | split(" ") | {key: .[0], value: (.[1] | tonumber)}] | from_entries as $calls
            | def total(names): [names[] as $name | $calls[$name] // 0] | add;
              {invocation: "TestAll, after a full run, under strace -f -c",
               exit_status: $exit_status,
               tests: $tests,
               syscalls: {directory_walks: total(["getdents64", "getdents"]),
                          metadata_reads:  total(["newfstatat", "statx", "fstat", "lstat", "stat"]),
                          opens:           total(["openat", "open", "openat2"]),
                          clones:          total(["clone", "clone3", "fork", "vfork"]),
                          execs:           total(["execve", "execveat"])}}' \
            < "$RUNNER_TEMP/syscall_counts.txt" > "$RUNNER_TEMP/runner_overhead.json"
          cat "$RUNNER_TEMP/runner_overhead.json"

      - name: Add the count to the record
        run: |
          if [ -s "$RUNNER_TEMP/prune_analysis.json" ]; then
            jq -S --slurpfile analysis "$RUNNER_TEMP/prune_analysis.json" '. + {prune_analysis: $analysis[0]}' \
              "$SYMBOL_TABLE_RECORD" > "$RUNNER_TEMP/with_analysis.json"
            mv "$RUNNER_TEMP/with_analysis.json" "$SYMBOL_TABLE_RECORD"
          else
            echo "::warning::prune's analysis was not measured, so the record has no prune_analysis"
          fi

      - name: Add the runner's overhead to the record
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/runner_overhead.json" ]; then
            jq -S --slurpfile overhead "$RUNNER_TEMP/runner_overhead.json" '. + {runner_overhead: $overhead[0]}' \
              "$SYMBOL_TABLE_RECORD" > "$RUNNER_TEMP/with_overhead.json"
            mv "$RUNNER_TEMP/with_overhead.json" "$SYMBOL_TABLE_RECORD"
          else
            echo "::warning::the runner's system calls were not counted, so the record has no runner_overhead"
          fi

      - name: Upload the record
        uses: actions/upload-artifact@v7
        with:
          name: symbol-table-linux-gcc-debug-${{ matrix.commit }}
          path: ${{ env.SYMBOL_TABLE_RECORD }}
          if-no-files-found: error

      - name: Store the record on the data branch
        if: github.ref == 'refs/heads/staging'
        working-directory: tooling
        run: |
          scripts/store_symbol_table_record.sh origin "$DATA_BRANCH" symbol-table/linux-gcc-debug \
            "$SYMBOL_TABLE_RECORD"

      - name: Store nothing off staging
        if: github.ref != 'refs/heads/staging'
        run: echo "Only a run on staging stores its record; this run is on $GITHUB_REF."
