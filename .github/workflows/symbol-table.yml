name: symbol-table

# Records the symbol table of each commit pushed to staging, and stores the
# record on the data branch `metrics`, at
# symbol-table/linux-gcc-debug/<commit>.json. The branch holds the history of
# TestAll's symbol table, which no artifact could, since artifacts expire.
# scripts/symbol_table_report.py says what a record holds, and
# scripts/symbol_table_provenance.py what it adds to it.
#
# The workflow builds TestAll and does not run the suite. The workflow is
# apart from the tiers, so that a failure to measure cannot stop a column
# testing, and cancelling a superseded run of a tier loses no record.
#
# Every run keeps its record as an artifact. A run dispatched on a branch
# other than staging stores nothing.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

# The workflow has no concurrency group, since each push to staging stores
# its own commit's record. A group cancels runs even without
# cancel-in-progress: GitHub keeps one pending run per group, and cancels it
# when a newer run joins the group. Two runs may store at once: each record is
# a file of its own, and scripts/store_symbol_table_record.sh retries a push
# which another run beat.

jobs:
  symbol-table:
    name: Record the symbol table · Linux · GCC · Debug
    # The configuration of coarse's Linux column, so that the records compare
    # with that column's builds. Removing SEQUOIA_FORCE_INLINE from
    # erased_target's constructor added 12,982 symbols (+1.91%) to this
    # configuration's TestAll on 2026-10-21, so the records show regressions
    # of that size. This job names its own toolchain, so a change to coarse's
    # column does not change it. Each record names its toolchain, so a change
    # of toolchain shows as a step in the history.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # The store pushes to the data branch, so the job keeps working if the
    # repository's default token becomes read-only.
    permissions:
      contents: write
    env:
      CC: gcc-15
      CXX: g++-15
      STORES_RECORD: ${{ github.ref == 'refs/heads/staging' }}
      DATA_BRANCH: metrics
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # tests.yml is the tiers' one recipe for building and running the
      # suite. This job runs no suite, so it copies the steps it needs from
      # tests.yml's "Install the toolchain (Linux)", "Configure" and "Build",
      # which say why each part exists. The copy leaves out gdb, which reads a
      # failed suite's stacks, and the configure step's EXEC_ARGS, which only
      # the `run` target reads.
      - name: Install the toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo scripts/retry.sh 3 180 -- apt-get update -qq --error-on=any \
            || { echo "::error::The apt indexes could not be fetched: each attempt above says why"; exit 1; }
          packages=("$CXX" ninja-build libtbb-dev)
          names=$(apt-cache pkgnames)
          for pkg in "${packages[@]}"; do
            grep -qFx -- "$pkg" <<< "$names" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo scripts/retry.sh 3 300 -- apt-get install -y "${packages[@]}"
          "$CXX" --version
          cmake --version

      - name: Configure
        working-directory: TestAll
        run: cmake --preset gcc-env

      - name: Build
        working-directory: TestAll
        run: cmake --build --preset gcc-env

      - name: Record the symbol table
        run: |
          mkdir "$RUNNER_TEMP/symbol-table"
          record="$RUNNER_TEMP/symbol-table/linux-gcc-debug.json"
          python3 -B scripts/symbol_table_report.py build/TestAll/gcc-env TestAll > "$RUNNER_TEMP/report.json"
          python3 -B scripts/symbol_table_provenance.py "$RUNNER_TEMP/report.json" > "$record"
          jq -c '{commit, clean, executable, toolchain}' "$record"
          echo "RECORD=$record" >> "$GITHUB_ENV"

      - name: Upload the record
        uses: actions/upload-artifact@v7
        with:
          name: symbol-table-linux-gcc-debug
          path: ${{ env.RECORD }}
          if-no-files-found: error

      - name: Store the record on the data branch
        if: env.STORES_RECORD == 'true'
        run: scripts/store_symbol_table_record.sh origin "$DATA_BRANCH" symbol-table/linux-gcc-debug "$RECORD"

      - name: Nothing to store
        if: env.STORES_RECORD != 'true'
        run: echo "Only a run on staging stores its record; this run is on $GITHUB_REF."
