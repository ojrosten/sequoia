name: fine-on-retarget

# Starts fine on a pull request that has just been retargeted to staging.
#
# Why this exists. fine runs on a pull request's opened, synchronize and reopened
# events. A stacked pull request is one whose base is another pull request's
# branch. It gets no fine run, and needs none while stacked. When the base pull
# request merges, GitHub retargets the stacked one to staging. The retarget is an
# `edited` event, so fine does not run, and staging's required "Every job ran and
# every job gates" never reports. #178 sat BLOCKED with every visible check green
# until a push to its head (2026-10-04).
#
# Why fine.yml does not take `edited` itself. A title or body edit is also an
# `edited` event. A run guarded by `if: github.event.changes.base` would skip
# every job on such an edit, and a skipped job reports success. GitHub judges a
# pull request by the latest check run of each name, so the skipped audit
# replaces a red one. The edit's run would also join the pull request's
# concurrency group, and so cancel a gate in flight. Both were measured on
# scratch PR #199 on 2026-10-04. With the audit red, a title edit took the pull
# request's mergeStateStatus from UNSTABLE to CLEAN. A title edit during a run
# cancelled the run, and GitHub then reported CLEAN, although the gate had never
# finished. An edit's skipped run of this workflow masks nothing and cancels
# nothing only while both of these hold: this workflow's job is not a required
# check, and the workflow has no concurrency group.
#
# Why a dispatch. A workflow_dispatch is the one event by which the GITHUB_TOKEN
# can start a run at once on a branch of its choosing. GitHub documents that any
# other event the GITHUB_TOKEN causes starts no run, except that a pull request's
# opened, synchronize or reopened event starts one that waits for approval.
#
# Why the dispatched run makes its own merge. Even a pull_request run would test
# the wrong tree: GitHub's merge ref can stay merged into the old base for minutes
# after a retarget. On scratch PR #201 the ref was still stale three minutes after
# the retarget. The retarget's own `edited` run checked out the stale merge, and
# so did a run started by reopening the pull request. So the dispatched fine run
# merges the head into staging itself, through tests.yml's `merge_into`. Do not
# close and reopen a pull request to start fine: in that window, the reopen's run
# tests the stale merge and reports on the head commit, where the gate counts it.
#
# A dispatched run builds with the head branch's workflows, not the merged ones.
# tests.yml's merge step therefore fails the run if staging has changed .github
# or scripts since its merge-base with the head. Otherwise the gate could pass
# on a recipe that staging has replaced.
#
# What would invalidate this. fine.yml could take the retarget in place of this
# workflow only if both of these became true: a pull_request trigger could filter
# on what an edit changed, so that a title edit started no run; and GitHub
# recomputed the merge ref at a retarget.
#
# Not covered, each failing loudly or waiting as before:
#   - A pull request from a fork. This repository can dispatch only its own
#     branches, so the job fails and says so. Such a pull request waits on
#     coarse's audit in any case, as coarse.yml says.
#   - A head branch without this change. A pull_request run takes its workflows
#     from the merge commit, and after a retarget that is the stale merge. If
#     neither the head nor the old base holds this file, nothing runs, and the
#     pull request waits as before. If this file runs but the head's fine.yml has no
#     workflow_dispatch, GitHub is documented to refuse the dispatch, and the job
#     fails. Neither case has been seen here. A push starts fine in both.
#   - A pull request that conflicts with its new base. GitHub starts no
#     pull_request run for such a pull request, so neither this workflow nor fine
#     runs. Resolving the conflict needs a push, and the push starts fine.
on:
  pull_request:
    types: [edited]
    branches: [staging]

jobs:
  dispatch:
    name: Start fine on a retarget to staging
    if: github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FROM: ${{ github.event.changes.base.ref.from }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch fine on the head branch
        run: |
          echo "Retargeted from $FROM to staging; head $HEAD_REPO:$HEAD_REF at $HEAD_SHA"
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "::error::the head branch is in $HEAD_REPO, and only a branch of $GH_REPO can be dispatched; the pull request waits on coarse's audit in any case"
            exit 1
          fi
          # The run's details come back from the dispatch itself, so a dispatch
          # that started nothing cannot pass for one that did.
          if ! run=$(gh api -X POST "repos/$GH_REPO/actions/workflows/fine.yml/dispatches" \
                       -f ref="$HEAD_REF" -F return_run_details=true --jq .workflow_run_id); then
            echo "::error::GitHub refused to dispatch fine on $HEAD_REF: push to the pull request to start fine"
            exit 1
          fi
          if [ -z "$run" ] || [ "$run" = null ]; then
            echo "::error::the dispatch returned no run: check fine's runs on $HEAD_REF, and push to the pull request if none started"
            exit 1
          fi
          echo "fine run $run: https://github.com/$GH_REPO/actions/runs/$run"
          # The dispatch has succeeded, so a failure to read the run back only warns.
          if ! tested=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha); then
            echo "::warning::could not read back which commit fine run $run tests"
          elif [ "$tested" != "$HEAD_SHA" ]; then
            echo "::warning::fine run $run tests $tested, not $HEAD_SHA, the head at the retarget: the branch has moved since, and its push starts a second fine run on the same head"
          else
            echo "fine run $run tests $tested, the head at the retarget"
          fi
