name: fine

# One of staging's two gates, beside coarse: coarse's three platforms, sanitized,
# plus --check-versioned-output so a change which moves committed diagnostics
# fails here rather than surfacing later as a git diff.
#
# fine also runs coverage.yml, whose gate fails a PR that leaves a function of
# Source uncalled without listing it in coverage_reports/uncalled_functions.txt.
#
# These columns do not repeat coarse's plain ones, since a PR into staging must
# pass coarse as well. ASan is behaviour-neutral on this suite, leaving check
# counts and output/ unchanged.
#
# ASan and UBSan share one build. TSan cannot join them, being mutually exclusive
# with ASan, so it is a column of its own in rigorous.
#
# The macOS column runs with `--exclude-performance`, for the reason, and on
# the measurement, that coarse.yml gives. The Linux and Windows columns run the
# performance tests.
#
# Every column also carries `--check-versioned-output`, spelt out per column
# because a column's `exec_args` REPLACES the tier's rather than adding to it.
# The Windows one did not until 2026-09-11, on the claim that the committed
# `_msvc` forks had decayed past the point where a drift check could mean
# anything. They had not: a count in rigorous.yml settles it. Do not drop the
# flag on that reasoning again.
#
# macOS joined on 2026-09-11, when work started arriving from a Windows machine
# and "we develop on the Mac" stopped covering it; see coarse.yml.
#
# TestRunnerTest runs here again, having been excluded from this column between
# 2026-09-09 and 2026-09-11 over a sharing violation on Windows. A violation
# here after 2026-09-11 is evidence against the fix rigorous.yml describes,
# rather than a flake to re-run; rigorous.yml gives the mechanism and the rates
# per configuration, and every MSVC column in every tier runs the test.
#
# No path filter: see scope.yml for why, and for how a
# column with nothing to test still reports.
on:
  pull_request:
    branches: [staging]
  # fine-on-retarget.yml dispatches this workflow on the head branch of a pull
  # request retargeted to staging, because the retarget starts no pull_request
  # run here. The dispatched run tests the head merged into staging, as the pull
  # request's own run would. The dispatched run's audit also posts its outcome
  # on the head commit as a commit status; the audit's last step says why.
  workflow_dispatch:

# A push to a PR that already has a run in flight cancels that run: a superseded
# run gates nothing, and Windows runners are scarce. The group is per PR, so runs
# for different PRs never cancel each other. A dispatched run's group is its
# branch, so a push to the pull request during that run does not cancel it; the
# push starts a run of its own on the new head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SCRATCH (roadmap 394): a job the audit does not need, so the audit's second
  # step fails and the run is red.
  scratch_red:
    runs-on: ubuntu-latest
    steps:
      - run: echo scratch

  # One decision for the whole run, which every job below takes as an input.
  scope:
    uses: ./.github/workflows/scope.yml

  # `!cancelled()` rather than the implied success(), so that a failed decision
  # still runs the columns, which then fail on the missing answer.
  fine:
    needs: scope
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/tests.yml
    with:
      needs_testing: ${{ needs.scope.outputs.suite }}
      # A pull_request run checks out GitHub's merge commit, so it needs no merge
      # of its own. A dispatched run checks out the branch it was dispatched on.
      merge_into: ${{ github.event_name == 'workflow_dispatch' && 'staging' || '' }}
      # Fatal at the gates, where preventing accumulation interrupts nobody's work.
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan",   "os": "ubuntu-26.04",   "configure": "gcc-env-asan-ubsan",  "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15", "exec_args": "--check-versioned-output"},
          {"name": "macOS · Clang · ASan+UBSan", "os": "macos-latest",   "configure": "llvm-env-asan-ubsan", "build": "llvm-env-asan-ubsan", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · ASan",      "os": "windows-latest", "configure": "msvc-asan",           "build": "msvc-asan", "exec_args": "--check-versioned-output"}
        ]

  # The gate on functions of Source that no test calls; coverage.yml says what
  # the job does. Its merge_into is the columns'.
  coverage:
    needs: scope
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/coverage.yml
    with:
      needs_testing: ${{ needs.scope.outputs.coverage }}
      merge_into: ${{ github.event_name == 'workflow_dispatch' && 'staging' || '' }}

  # The tier's own shape, checked. A job skipped by a wrong `if:` renders the same
  # as one that passed; `needs` reports `skipped` where the tick shows green.
  # Staging requires this job and none of the others, so a job missing from this
  # job's `needs` would gate nothing, however red. The second step fails if any
  # other job is missing. The third fails unless staging's rule names this job,
  # pinned to the app that reports this job, so that a rename here, or an edit to
  # the rule, shows as a red check rather than only as a PR that waits on a name
  # nothing reports, or merges ungated. The second and third steps run even when
  # an earlier step fails, so each reports independently. Same shape as
  # rigorous's audit, without the modes.
  audit:
    name: Every job ran and every job gates
    needs: [scope, fine, coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check each job's result
        run: |
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$RESULTS"
          failed=0
          for job in $(jq -r 'keys[]' <<<"$RESULTS"); do
            actual=$(jq -r --arg j "$job" '.[$j].result' <<<"$RESULTS")
            if [ "$actual" = success ]; then echo "ok    $job"; else echo "::error::$job: expected success, was $actual"; failed=1; fi
          done
          exit $failed

      - name: Insist this job needs every other job of the workflow
        if: ${{ !cancelled() }}
        run: |
          # The workflow file is fetched at GITHUB_WORKFLOW_SHA, the commit this run
          # read it from. Its jobs and this job's `needs` are compared both ways, so
          # that a file read wrongly - no jobs, or the wrong ones - fails the step.
          set -o pipefail
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          workflow=${workflow%%@*}
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/$workflow?ref=$GITHUB_WORKFLOW_SHA" \
            | yq -r '.jobs | keys | .[]' | grep -vxF "$GITHUB_JOB" | sort > jobs.txt
          jq -r 'keys[]' <<<"$RESULTS" | sort > needed.txt
          echo "jobs of $workflow but this one:"; sed 's/^/  /' jobs.txt
          echo "jobs this one needs:"; sed 's/^/  /' needed.txt
          if ! diff -u needed.txt jobs.txt; then
            echo "::error::$GITHUB_JOB must need every other job of $workflow: a job it does not need gates nothing, however red"
            exit 1
          fi
          echo "$GITHUB_JOB needs every other job of $workflow"

      - name: Insist staging requires this job, pinned to the app that reports it
        if: ${{ !cancelled() }}
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          # The branches endpoint returns a branch's required checks to any token;
          # the protection endpoint would need admin rights.
          check=$(gh api "repos/$GH_REPO/check-runs/$CHECK_RUN_ID" --jq '"\(.app.id) \(.name)"')
          gh api "repos/$GH_REPO/branches/staging" \
              --jq '.protection.required_status_checks.checks[] | "\(.app_id) \(.context)"' > required.txt
          echo "this check, as app and name: $check"
          echo "required on staging:"; sed 's/^/  /' required.txt
          if ! grep -qxF "$check" required.txt; then
            echo "::error::staging does not require '${check#* }' from app ${check%% *}: a PR would wait on a name nothing reports, or merge without this check"
            exit 1
          fi
          echo "staging requires this job, pinned to the app that reports it"

      # GitHub does not count a dispatched run's checks towards a pull
      # request's required checks. GitHub's page "Troubleshooting required
      # status checks" says so under "Checks from some workflow jobs are not
      # evaluated", naming workflow_dispatch. So a dispatched run also posts
      # this job's outcome as a commit status, named as this job, on the
      # commit the run tested. The status is success if every step above
      # succeeded, and failure otherwise.
      #
      # Staging's rule accepts the status, because GitHub Actions, the app the
      # rule pins, posts it. The status cannot mask a red check: when a check
      # and a status share a required name, GitHub requires both to pass. A red
      # status holds the pull request until a dispatched run on the same commit
      # passes, or a push starts fine on a new head.
      #
      # Scratch PR #345 measured this on 2026-10-21. A retarget to staging by
      # hand fired the same `edited` event, with `changes.base`, as GitHub's
      # automatic retarget. The dispatched audit passed on the head, but the
      # pull request stayed BLOCKED, and the audit was missing from its checks.
      # A commit status of this name, posted from a dispatched run, took the
      # pull request to CLEAN.
      #
      # The status would merely repeat the check if GitHub began to count a
      # dispatched run's checks.
      - name: Post this job's outcome on a dispatched commit
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; else state=failure; fi
          name=$(gh api "repos/$GH_REPO/check-runs/$CHECK_RUN_ID" --jq .name)
          gh api -X POST "repos/$GH_REPO/statuses/$GITHUB_SHA" -f state="$state" -f context="$name" \
            -f description="dispatched run: $OUTCOME" -f target_url="$RUN_URL" > /dev/null
          echo "posted '$name' as $state on $GITHUB_SHA"
