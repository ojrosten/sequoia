name: fine

# The gate on staging: coarse's two platforms, sanitized, plus
# --check-versioned-output so a change which moves committed diagnostics fails here
# rather than surfacing later as a git diff.
#
# These columns replace coarse's rather than adding to them - a sanitized build
# misses nothing the plain one catches, and ASan is behaviour-neutral on this suite,
# leaving check counts and output/ unchanged.
#
# ASan and UBSan share one build. TSan cannot join them, being mutually exclusive
# with ASan, so it is a column of its own in rigorous.
#
# The Windows column runs the suite with `--exclude-performance`. It is only the
# timing assertions a hosted runner cannot hold - TestRunnerPerformanceTest asserts
# 60ms +- 35 for eight 25ms sleeps run concurrently, and this runner returned 196ms
# and then 603ms for the same commit - so excluding those buys back everything else.
#
# Every column carries `--check-versioned-output`. The Windows one did not until
# 2026-09-11, on the grounds that the committed `_msvc` forks were stale; that was
# measured on 2026-09-10 and found false - 339 of the 340 files a real MSVC run
# writes already matched, and the one straggler is fixed - and rigorous's MSVC
# columns have carried the flag, green, since. Catching MSVC drift here rather than
# at promotion is what this tier is for.
# The Linux column carries `--exclude-performance` alongside the tier's flag:
# TestRunnerPerformanceTest asserts 60ms +- 35 for eight 25ms sleeps run
# concurrently, which a hosted runner cannot hold - this column returned 164ms on
# 2026-09-10, under ASan's slowdown. Both flags are spelt out because a column's
# `exec_args` REPLACES the tier's rather than adding to it.
# The MSVC ASan columns leave out TestRunnerTest: its instability-analysis cleanup
# calls fs::remove_all on a folder a just-exited sandbox subprocess still has open,
# and Windows refuses the delete. Every check in it passes - the run dies in
# teardown - and it has cost 3 of 6 gating runs. It is ASan-specific: the
# uninstrumented Windows column runs the same test to 55 checks and is green, so
# the exclusion is scoped to the sanitized columns rather than to Windows.
# Roadmap item 134 tracks the fix; this is a stop-gap, not a verdict.
on:
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'

jobs:
  fine:
    uses: ./.github/workflows/tests.yml
    with:
      # Fatal at the gates, where preventing accumulation interrupts nobody's work.
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan", "exec_args": "--check-versioned-output;--exclude-performance;--exclude;Tests/TestFramework/TestRunnerTest.cpp"}
        ]
