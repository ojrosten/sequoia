name: fine

# The gate on staging: coarse's two platforms, sanitized, plus
# --check-versioned-output so a change which moves committed diagnostics fails here
# rather than surfacing later as a git diff.
#
# These columns replace coarse's rather than adding to them - a sanitized build
# misses nothing the plain one catches, and ASan is behaviour-neutral on this suite,
# leaving check counts and output/ unchanged.
#
# ASan and UBSan share one build. TSan cannot join them, being mutually exclusive
# with ASan, so it is a column of its own in rigorous.
#
# The Windows columns build but do not run, temporarily. TestRunnerPerformanceTest
# asserts absolute wall-clock times - 60ms +- 35 for eight 25ms sleeps run
# concurrently - and the hosted Windows runner returned 196ms and then 603ms for
# the same commit. No tolerance spans that and still means anything. Building is
# still guarded, which is where MSVC divergences usually appear; restore `run` when
# roadmap items 38 and 102 land.
on:
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'

jobs:
  fine:
    uses: ./.github/workflows/tests.yml
    with:
      # Fatal at the gates, where preventing accumulation interrupts nobody's work.
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan", "run": false}
        ]
