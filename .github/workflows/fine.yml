name: fine

# The gate on staging: coarse's three platforms, sanitized, plus
# --check-versioned-output so a change which moves committed diagnostics fails here
# rather than surfacing later as a git diff.
#
# These columns replace coarse's rather than adding to them - a sanitized build
# misses nothing the plain one catches, and ASan is behaviour-neutral on this suite,
# leaving check counts and output/ unchanged.
#
# ASan and UBSan share one build. TSan cannot join them, being mutually exclusive
# with ASan, so it is a column of its own in rigorous.
#
# Every column runs with `--exclude-performance`: TestRunnerPerformanceTest
# asserts 60ms +- 35 for eight 25ms sleeps run concurrently, which a hosted
# runner cannot hold - Windows returned 196ms and then 603ms for the same
# commit, and Linux 164ms under ASan's slowdown on 2026-09-10 - so excluding
# those buys back everything else.
#
# Every column also carries `--check-versioned-output`, spelt out per column
# because a column's `exec_args` REPLACES the tier's rather than adding to it.
# The Windows one did not until 2026-09-11, on the grounds that the committed
# `_msvc` forks were stale; that was measured on 2026-09-10 and found false: of
# the 340 files a real MSVC run writes, 339 already matched, and the one
# straggler is fixed.
#
# macOS joined on 2026-09-11, when work started arriving from a Windows machine
# and "we develop on the Mac" stopped covering it; see coarse.yml.
#
# The MSVC column leaves out TestRunnerTest: its instability-analysis cleanup
# calls fs::remove_all on a folder something on Windows still has open, and the
# delete is refused. Every check in it passes - the run dies in teardown - and it
# is close to a coin toss. It was thought ASan-specific, on the strength of one
# uninstrumented run passing; on 2026-09-11 the uninstrumented MSVC Release column
# failed the same way, so it is Windows-wide and ASan only widens the window.
# Roadmap item 134 tracks the fix; this is a stop-gap, not a verdict.
on:
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'

jobs:
  fine:
    uses: ./.github/workflows/tests.yml
    with:
      # Fatal at the gates, where preventing accumulation interrupts nobody's work.
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan",   "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan",  "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "macOS · Clang · ASan+UBSan", "os": "macos-latest",   "configure": "llvm-env-asan-ubsan", "build": "llvm-env-asan-ubsan", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · ASan",      "os": "windows-latest", "configure": "msvc-asan",           "build": "msvc-asan", "exec_args": "--check-versioned-output;--exclude-performance;--exclude;Tests/TestFramework/TestRunnerTest.cpp"}
        ]

  # The tier's own shape, checked. A job skipped by a wrong `if:` renders the same
  # as one that passed; `needs` reports `skipped` where the tick shows green. And
  # every job that ran must be a required check on staging: a column that is not
  # required gates nothing, however red. Same shape as rigorous's audit, without
  # the modes.
  audit:
    name: Every job ran and every job gates
    needs: [fine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: ${{ toJSON(needs) }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check each job's result
        run: |
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$RESULTS"
          actual=$(jq -r '.fine.result' <<<"$RESULTS")
          if [ "$actual" != success ]; then
            echo "::error::fine: expected success, was $actual"; exit 1
          fi

      - name: Insist every job of this run is a required check on staging
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion != "skipped") | .name' \
            | sort > jobs.txt
          gh pr checks "$PR" --required --json name --jq '.[].name' | sort > required.txt
          echo "jobs in this run:"; sed 's/^/  /' jobs.txt
          echo "required on the base branch:"; sed 's/^/  /' required.txt
          missing=$(comm -23 jobs.txt required.txt)
          if [ -n "$missing" ]; then
            echo "::error::these jobs run on every PR to staging but gate nothing, because staging does not require them:"
            echo "$missing" | sed 's/^/  /'
            exit 1
          fi
          echo "every job of this run is required on the base branch"
