name: fine

# The gate on staging: the same two platforms coarse runs, sanitized, plus
# --check-versioned-output so a change which moves committed diagnostics fails
# here rather than being noticed later as a git diff.
#
# The columns *replace* coarse's rather than extending them, because a sanitized
# build dominates the plain one it is built from: same compiler, same flags plus
# instrumentation, so nothing the plain leg catches at compile time is missed, and
# ASan is behaviour-neutral on this suite - the same check counts, and the same
# output/, since output_discriminator() keys on compiler_name() regardless of
# sanitizer. A plain leg here would cost a build and detect nothing extra.
#
# So the invariant across the tiers is **at least as strict as**, not "contains the
# columns of". Coarse is deliberately the weak, fast tier - uninstrumented because
# uninstrumented builds are quicker - and this is where strictness starts.
#
# ASan and UBSan are combined into one build rather than run as two columns; TSan
# cannot join them, since it is mutually exclusive with ASan, so it stays a column
# of its own in rigorous.
on:
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'

jobs:
  fine:
    uses: ./.github/workflows/tests.yml
    with:
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan"}
        ]
