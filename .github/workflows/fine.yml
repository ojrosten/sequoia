name: fine

# SCRATCH STUB (roadmap 394): reports fine's required check at once, red if the
# checkout holds scratch-red. A dispatch may also post the result by another
# route, chosen by `post`.
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      post:
        description: 'none, status or check'
        required: false
        type: string
        default: none

jobs:
  audit:
    name: Every job ran and every job gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      POST: ${{ inputs.post }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Gate
        id: gate
        run: |
          echo "event=$GITHUB_EVENT_NAME sha=$SHA post=$POST"
          if [ -e scratch-red ]; then echo "::error::scratch-red present"; exit 1; fi
      - name: Post
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.post != 'none' }}
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; conclusion=success; else state=failure; conclusion=failure; fi
          case "$POST" in
            status) gh api -X POST "repos/$GH_REPO/statuses/$SHA" -f state=$state -f context='Every job ran and every job gates' -f description="dispatched: $OUTCOME" ;;
            check)  gh api -X POST "repos/$GH_REPO/check-runs" -f name='Every job ran and every job gates' -f head_sha="$SHA" -f status=completed -f conclusion=$conclusion ;;
          esac
