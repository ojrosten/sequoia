name: coarse

# Every push, every branch. The question is only "does it build and does the suite
# pass?", on the two platforms that disagree with each other: clang and gcc share
# enough heritage that their agreement is weak evidence about MSVC, and the
# divergences catalogued for this project run to seven distinct families.
#
# No drift check and no sanitizer: this is the tier that trades strictness for
# latency, and an uninstrumented build is the quickest one there is. Fine does not
# extend these columns, it replaces them with sanitized builds of the same two
# platforms - a sanitized build dominates the plain one, so keeping both would buy
# nothing. The invariant across tiers is therefore "at least as strict as", not
# "contains the columns of". Running on main and staging too gives cheap
# post-merge confirmation of what landed.
#
# Note a push to a branch with an open PR fires both `push` and `synchronize`, so
# coarse and the PR's tier both run. Coarse is a subset, so the cost is real but
# the answer is not wrong, and there is no native way to suppress it.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:

jobs:
  coarse:
    uses: ./.github/workflows/tests.yml
    with:
      columns: >-
        [
          {"name": "Linux · GCC · Debug",   "os": "ubuntu-latest",  "configure": "gcc-env", "build": "gcc-env", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · Debug", "os": "windows-latest", "configure": "msvc",   "build": "msvc"}
        ]
