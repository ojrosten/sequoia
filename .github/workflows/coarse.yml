name: coarse

# Every push, every branch: does it build, and does the suite pass? Uninstrumented,
# because this tier is bought for latency, and because it is the only per-push
# build running at native speed with the system allocator.
#
# Windows is here rather than only in the gates because clang and gcc agreeing is
# weak evidence about MSVC. macOS is here since 2026-09-11, when work started
# arriving from a Windows machine as well as the Mac: "we develop on the Mac" had
# been the reason a Mac column at the cheap tiers measured nothing new, and it
# stopped being true. The user's words: the absence "has gone from convenient to
# a glaring hole".
#
# A push to a branch with an open PR fires both `push` and `synchronize`, so this
# runs alongside that PR's tier. There is no native way to suppress it, and it is
# not wasted: it is what keeps an uninstrumented build in the picture once a branch
# is under review.
#
# The Windows column runs the suite but does not gate on it. Compilation still
# gates - that is where MSVC divergences usually appear - while test failures are
# reported and triaged rather than fatal.
#
# The Windows and macOS columns run with `--exclude-performance`, because
# TestRunnerPerformanceTest asserts absolute wall-clock times - 60ms +- 35 for
# eight 25ms sleeps run concurrently - and the hosted Windows runner returned
# 196ms and then 603ms for the same commit, which is what cost macOS its column
# on 2026-09-08 too. No tolerance spans that and still means anything. The
# Windows column is advisory only until it has been green for long enough to
# gate on; the triage step raises anything that fails as an error annotation
# meanwhile. The macOS column gates, as the Linux one does.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:

jobs:
  coarse:
    uses: ./.github/workflows/tests.yml
    with:
      # Counted and annotated, not fatal: a red run here should mean the code is
      # broken rather than untidy. The gates refuse warnings outright.
      warnings_as_errors: false
      columns: >-
        [
          {"name": "Linux · GCC · Debug",   "os": "ubuntu-latest",  "configure": "gcc-env", "build": "gcc-env", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "macOS · Clang · Debug",   "os": "macos-latest",   "configure": "llvm-env", "build": "llvm-env", "exec_args": "--exclude-performance"},
          {"name": "Windows · MSVC · Debug", "os": "windows-latest", "configure": "msvc",   "build": "msvc", "advisory": true, "exec_args": "--exclude-performance"}
        ]

  # Also in rigorous. It costs seconds and no compilation, so there is no reason to
  # defer it to promotion time.
  docs:
    uses: ./.github/workflows/docs.yml

  # The tier's own shape, checked: a job skipped by a wrong `if:` renders the same
  # as one that passed, and `needs` reports `skipped` where the tick shows green.
  # Nothing here gates, so there is no required set to hold it against.
  audit:
    name: Every job ran
    needs: [coarse, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check each job's result
        run: |
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$RESULTS"
          failed=0
          for job in coarse docs; do
            actual=$(jq -r --arg j "$job" '.[$j].result' <<<"$RESULTS")
            if [ "$actual" = success ]; then echo "ok    $job"; else echo "::error::$job: expected success, was $actual"; failed=1; fi
          done
          exit $failed
