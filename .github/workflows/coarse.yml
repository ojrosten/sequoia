name: coarse

# Every push, every branch but main: does it build, does the suite pass, and
# did the output it versions move?
# Uninstrumented, because this tier is bought for latency, and because it is the
# only per-push build running at native speed with the system allocator.
#
# Not main, because main moves only by promotion and carries nothing but merge
# commits, so a promotion's tree is staging's tree - which had this tier on the
# push to staging and rigorous on the promotion PR minutes before, and usually
# fine on the PR into staging too. A run here would answer a question two tiers
# have answered, at the price of three runners, Windows the scarce one. staging
# stays: a merge into it can produce a tree nothing has tested, since "require
# branches up to date" is deliberately off.
#
# Windows is here rather than only in the gates because clang and gcc agreeing is
# weak evidence about MSVC. macOS joined on 2026-09-11, when work started arriving
# from a Windows machine as well as the Mac: "we develop on the Mac" had been the
# reason a Mac column at the cheap tiers measured nothing new, and it stopped
# being true - the absence "has gone from convenient to a glaring hole".
#
# A push to a branch with an open PR fires both `push` and `synchronize`, so this
# runs alongside that PR's tier. There is no native way to suppress it, and it is
# not wasted: it is what keeps an uninstrumented build in the picture once a branch
# is under review.
#
# Every column is fatal, the Windows one since 2026-09-22. It had been advisory
# from 2026-09-09 - the suite run and triaged, a failure reported on a green job -
# because it was red on every push from PR #80 onwards for one cause: the nested
# test projects' compiler probes overran MAX_PATH, roadmap item 197, fixed by
# hashing the object paths (build_system/ShortObjectPaths.cmake). A column that
# nothing can make red is a report rather than a gate; this one gates.
#
# The Windows column builds with Ninja, not msbuild: the same cl.exe, the faster
# of the two builds, and the generator a client outside the IDE would use, so a
# preset defect only Ninja shows surfaces on every push rather than in someone's
# next Windows session. The Visual Studio generator keeps running in both gates,
# which is where the checks on the generated .vcxproj live - and since every
# committed vcxproj prediction is checked by any Visual Studio column, this
# column's absence from that generator leaves none of them unverified.
#
# The Windows and macOS columns run with `--exclude-performance`, because
# TestRunnerPerformanceTest asserts absolute wall-clock times - 60ms +- 35 for
# eight 25ms sleeps run concurrently - which a hosted runner cannot hold: Windows
# returned 196ms and then 603ms for the same commit, and macOS 172ms, which is
# what cost it its column on 2026-09-08. No tolerance spans that and still means
# anything.
#
# Every column checks the versioned output, since 2026-09-22. The check is a
# comparison of files the run has just written, and costs nothing this tier's
# latency can see. It was left to the gates until a commit reached staging by a
# direct push, which this tier alone sees: its committed diagnostics output was
# stale, coarse passed it, and the drift surfaced the next morning in every
# column of the promotion's rigorous run. As in the gates, the flag is spelt
# per column, because a column's `exec_args` REPLACES the tier's: a column
# naming only its exclusion would silently lose the check.
#
# Drift fails the column it is found on, Windows included: no column here is
# advisory any more, so nothing routes a red suite step through the triage step.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:

# A push to a branch that already has a run in flight cancels that run: it
# answers a question nobody is asking any more, and Windows runners are scarce.
# Runs on different branches never share a group; a dispatch on a branch shares
# the branch's group, and tests the same head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coarse:
    uses: ./.github/workflows/tests.yml
    with:
      # Counted and annotated, not fatal: a red run here should mean the code is
      # broken rather than untidy. The gates refuse warnings outright.
      warnings_as_errors: false
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · Debug",   "os": "ubuntu-latest",  "configure": "gcc-env", "build": "gcc-env", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "macOS · Clang · Debug", "os": "macos-latest",   "configure": "llvm-env", "build": "llvm-env", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · Debug", "os": "windows-latest", "configure": "msvc-ninja", "build": "msvc-ninja", "exec_args": "--check-versioned-output;--exclude-performance"}
        ]

  # Also in rigorous. It costs seconds and no compilation, so there is no reason to
  # defer it to promotion time.
  docs:
    uses: ./.github/workflows/docs.yml

  # The tier's own shape, checked: a job skipped by a wrong `if:` renders the same
  # as one that passed, and `needs` reports `skipped` where the tick shows green.
  # Nothing here gates, so there is no required set to hold it against.
  audit:
    name: Every job ran
    needs: [coarse, docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check each job's result
        run: |
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$RESULTS"
          failed=0
          for job in coarse docs; do
            actual=$(jq -r --arg j "$job" '.[$j].result' <<<"$RESULTS")
            if [ "$actual" = success ]; then echo "ok    $job"; else echo "::error::$job: expected success, was $actual"; failed=1; fi
          done
          exit $failed
