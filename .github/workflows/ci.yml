name: CI

# Push-triggered on every branch while the matrix is being grown: the workflow can
# only be exercised on a branch that carries it, so restricting this to the trunk
# would make it untestable before it lands there.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where a GCC new enough for sequoia can be got on a hosted image. The README
  # pins g++ 15.2.0; noble carries 14 and nothing newer, so a source for 15 has to
  # be found rather than assumed.
  #
  # Package presence is tested against `apt-cache pkgnames`, which matches names
  # exactly. `apt-get install` and `apt-cache policy` do not: given a name with
  # regex metacharacters that matches no package, they fall back to treating it as
  # a regex - so `g++-15` on noble resolves to clang-15, flang-15 and llvm-15, and
  # apt-get installs all three and exits 0. That is how the first run of this
  # workflow reported a successful toolchain install and then failed to find a
  # compiler.
  gcc-source-probe:
    name: Probe - where GCC 15 comes from
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The image
        run: |
          cat /etc/os-release | head -2
          cmake --version | head -1
          ninja --version 2>/dev/null || echo "ninja: absent"

      - name: Stock archives
        run: |
          sudo apt-get update -qq
          apt-cache pkgnames | grep -E '^g\+\+-[0-9]+$' | sort -V || echo "no versioned g++ at all"

      - name: With ubuntu-toolchain-r/test added
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          echo "--- versioned g++ now offered:"
          apt-cache pkgnames | grep -E '^g\+\+-[0-9]+$' | sort -V
          echo "--- candidate for each:"
          for v in 15 16; do
            if apt-cache pkgnames | grep -qx "g++-$v"; then
              apt-cache madison "g++-$v" | head -3
            else
              echo "g++-$v: not offered"
            fi
          done

  # The alternative source, and the one that would pin a version rather than take
  # whatever a distribution happens to ship. Also settles whether the image carries
  # the rest of what sequoia needs.
  container-probe:
    name: Probe - the official gcc container
    runs-on: ubuntu-latest
    container: gcc:15
    timeout-minutes: 15
    steps:
      - name: What the container has
        run: |
          cat /etc/os-release | head -2
          g++ --version | head -1
          cmake --version 2>/dev/null | head -1 || echo "cmake: absent"
          ninja --version 2>/dev/null || echo "ninja: absent"
          git --version
      - name: What it can install
        run: |
          apt-get update -qq
          for pkg in cmake ninja-build libtbb-dev; do
            if apt-cache pkgnames | grep -qx "$pkg"; then
              apt-cache madison "$pkg" | head -1
            else
              echo "$pkg: not offered"
            fi
          done

  # The first real column: Linux, GCC, Debug, no sanitizer.
  #
  # GCC rather than Clang deliberately. Clang-on-Linux means libstdc++, a pairing
  # sequoia has never been built with, so a Clang column would be red on its first
  # run for reasons unrelated to CI - and a leg that has never passed teaches its
  # readers to ignore it. The Clang/libstdc++ column is tracked separately.
  #
  # TestAll rather than all four executables: its source set is a strict superset
  # of TestChamber, TestFrameworkDiagnostics and TestFrameworkHarness, so the other
  # three would add build time and no coverage.
  linux-gcc:
    name: Linux / GCC / Debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/html is ~96MB of committed doxygen render; nothing here reads it.
          fetch-depth: 1

      - name: Install the toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          # Exact-match check first: apt-get would otherwise resolve an absent
          # package name as a regex and install whatever it happened to match.
          for pkg in "$CXX" ninja-build libtbb-dev; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y "$CXX" ninja-build libtbb-dev

      # The install step's exit status is not evidence that a compiler exists;
      # this is.
      - name: Report the toolchain actually in use
        run: |
          command -v "$CXX" || { echo "::error::$CXX installed but not on PATH"; exit 1; }
          "$CXX" --version
          cmake --version
          ninja --version

      - name: Configure
        working-directory: TestAll
        run: cmake --preset gcc-env

      # Separate from the run below so that a compile failure and a test failure
      # are distinguishable at a glance, and so the suite can carry its own
      # wall-clock ceiling.
      - name: Build
        working-directory: TestAll
        run: cmake --build --preset gcc-env

      # `run-gcc-env` builds the `run` target, whose command is the test executable;
      # the binary is already built, so this step is the suite and nothing else.
      #
      # The timeout is the suite's own, well below the job's: a non-terminating test
      # otherwise arrives as an unattributed job timeout with no output at all.
      - name: Run the suite
        working-directory: TestAll
        run: timeout --signal=TERM --kill-after=30 1800 cmake --build --preset run-gcc-env

      # The runner rewrites versioned output as it goes. A Linux column regenerates
      # the `_gcc` forks, which have been frozen since macOS last wrote them, so a
      # diff here is expected on the first run and is information, not failure.
      # Drift is gated behind --check-versioned-output and is not enabled yet.
      - name: Report any movement in the versioned output
        if: always()
        run: git diff --stat -- output/ TestMaterials/ || true

      - name: Upload the run's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gcc-output
          path: |
            output/TestSummaries/
            output/DiagnosticsOutput/
          if-no-files-found: warn
