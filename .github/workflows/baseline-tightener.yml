name: baseline-tightener
# The ratchet of the gate on uncalled functions. coverage.yml fails a run in
# which a function of Source is uncalled and is not listed in
# coverage_reports/uncalled_functions.txt. A listed function that has since
# been called, or has gone, gives only a notice. Left alone, its entry would
# stay, and the function could stop being called again with no gate to see it.
# So each night this workflow measures staging and proposes the baseline
# without every entry the measurement no longer needs: one PR into staging,
# set to merge itself once its gate is green, as the promotion PR is.
# scripts/propose_tightened_baseline.sh opens, keeps or closes the PR, and
# says what it refuses.
#
# The PR only removes entries, so it cannot loosen the gate. A function newly
# uncalled is not listed, so its own PR still fails.
#
# A scheduled run starts from main's copy of this file, which may lag
# staging's by a promotion. So the scheduled run only dispatches this workflow
# on staging, and the dispatched run measures and proposes with staging's own
# workflows and scripts, on staging's commit. Nothing comes from another
# workflow's run, so nothing a fork's PR could supply. The scheduled run
# dispatches nothing when the last successful dispatched run measured the
# commit staging is at, since the measurement costs a coverage build, about
# twenty minutes of a Linux runner.
#
# The PR is gated like any other PR into staging. Since only the baseline
# changes, scope.yml runs the coverage job and skips the test columns. The
# gate measures the PR merged with staging as it is when the gate runs. A PR
# merged after that, which stops a listed function being called, would pass
# its own gate, since the function is still listed. If this PR then removes
# the entry, the next PR into staging fails, naming the function.
#
# Each removal rests on one measurement. Over five fine runs of one tree,
# 2026-10-07, every run left the same functions uncalled. A function whose
# calls varied between runs would be removed by a lucky run and named by the
# next PR's gate, so the PR lists what it removes.
#
# A dispatch on any branch measures that branch and proposes into it, so the
# workflow can be tried on a scratch branch.
#
# The PR needs a token other than GITHUB_TOKEN, for the reason rigorous.yml's
# promote job gives: a PR or push that token makes starts no workflow, so the
# PR's gate would never report. PROMOTION_TOKEN is that job's token. A
# dispatch is the exception, so the scheduled run dispatches with
# GITHUB_TOKEN.
on:
  # watchdog.yml checks that this schedule fires. Its tick must stay more than
  # GitHub's delay, up to six and a half hours, before the watchdog's. It is
  # in the evening, so that the PR is usually merged before the nightly run
  # opens the promotion PR, whose gate a change to staging would restart.
  schedule:
    - cron: '1 22 * * *'
  workflow_dispatch:
# One run at a time on each branch, so that an older measurement cannot
# overwrite a newer proposal. A run queued behind a running one is replaced by
# any run queued after it, and none is cancelled while running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    name: Dispatch the measurement on staging
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          staging=$(gh api "repos/$GH_REPO/commits/heads/staging" --jq .sha)
          measured=$(gh run list --workflow baseline-tightener.yml --branch staging --event workflow_dispatch \
                       --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ "$staging" = "$measured" ]; then
            echo "staging is at $staging, which the last successful measurement measured; nothing dispatched"
            exit 0
          fi
          gh workflow run baseline-tightener.yml --ref staging
          echo "dispatched a measurement of staging at $staging; the last successful one measured ${measured:-nothing}"

  coverage:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/coverage.yml
    with:
      needs_testing: 'true'
      merge_into: ''
      ref: ''

  propose:
    name: Propose the tightened baseline
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROMOTION_TOKEN }}
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          name: uncalled-functions-tightened
          path: ${{ runner.temp }}/tightened

      - name: Open, keep or close the PR
        run: |
          scripts/propose_tightened_baseline.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/tightened/uncalled_functions.txt" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
