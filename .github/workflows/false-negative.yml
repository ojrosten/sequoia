name: false-negative

# The controls for CI's gates and alarms. A gate never seen to go red has not
# been shown to see anything: each of its green runs is consistent with a
# suite that never ran, a flag that never reached the runner, or a detector
# that fires on nothing. sequoia's own test framework has a false-negative mode
# for this reason, and CI gets the same treatment.
#
# Each of the first two jobs makes a change that its subjects must fail on,
# dispatches runs of the subjects on the change, waits for them, and reads
# their jobs back. Each subject must fail at the step its rule names. The
# subject's log must also hold the finding which its rule prints for the
# change. A subject red for another reason proves nothing about whether it can
# see, so the job fails on that too.
#
# `control` dispatches rigorous with `false_negative: true`, which corrupts the
# checkout before building:
#   - Each column has a versioned output and a prediction corrupted. Every
#     column must have failed, its suite red and its drift step accounting for
#     the corruption.
#   - The docs job has a documentation comment holding a command doxygen does
#     not know. The gate on documentation defects must have failed, with
#     doxygen's warning of the command.
#   - The coverage job has a function of Source which nothing calls, and an
#     entry of the baseline naming a function which does not exist. The gate on
#     uncalled functions must have failed, with an error naming the function.
#     It must also have given a notice of the entry: baseline-tightener.yml
#     removes the entries which such notices name.
#   - The column audit within the run must have passed: the columns ran, and
#     went red.
#   - The run's audit, which checks every job's result against the run's mode,
#     must have passed.
#
# `metrics` pushes two commits, each on a branch of its own, and deletes the
# branches when it is done:
#   - A merge into the commit the job runs on. The merge adds symbols with long
#     names, and work to prune's analysis. metrics-gate.yml, dispatched on the
#     merge, must fail each of its three series on its rise: the symbols, the
#     bytes of their names and prune's instructions.
#   - The commit the job runs on, with #182's fix undone: each test's setup
#     again removes the previous run's materials itself. symbol-table.yml,
#     dispatched on it, must fail its check of the setup cost of leftover
#     materials on that cost.
#
# `records` checks the dashboard's data branch, `metrics`. For each commit
# which symbol-table.yml and baseline-tightener.yml measured on staging in the
# last eight days, the branch must hold a record with every series. The steps
# adding prune's count and the cost of leftover materials to a record are
# tolerated to fail, as is baseline-tightener.yml's job storing its record. So
# a lost series turns nothing red but this job.
#
# The workflow runs weekly rather than nightly, since it costs a full rigorous
# run and three builds of TestAll. It measures the subjects' ability to fail,
# which changes only when the workflows or scripts do. Run it by hand after any
# change to them.
#
# GITHUB_TOKEN may dispatch: the guard that stops a GITHUB_TOKEN push or PR
# from triggering workflows exempts workflow_dispatch.
on:
  # Saturday evening, so that the result is in by Sunday morning even when the
  # scheduler is hours late, and four hours clear of the nightly's tick. The
  # minute is off the hour, as rigorous.yml's is.
  schedule:
    - cron: '1 21 * * 6'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  control:
    name: The gate on main can still go red
    runs-on: ubuntu-latest
    # The subject run's columns may each take 90 minutes, after however long
    # they queue. The margin beyond that also holds the wait in
    # scripts/read_settled_jobs.sh.
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # The steps below confirm that the run found is a corrupted one.
      - name: Dispatch a rigorous run that must fail, and find it
        id: dispatch
        run: |
          id=$(scripts/dispatch_and_find_run.sh rigorous.yml "$GITHUB_REF_NAME" -f false_negative=true)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # `gh run watch` exits with the run's status only under --exit-status,
      # which is not passed, since the run is meant to fail.
      - name: Wait for it
        run: gh run watch "${{ steps.dispatch.outputs.id }}" --interval 60 > /dev/null

      - name: Every column was corrupted and failed, and the run's audits passed
        run: |
          id=${{ steps.dispatch.outputs.id }}

          # The columns are those that rigorous.yml gives the subject run,
          # read at the commit the run tested. The run's own jobs cannot
          # supply them: the list a check is held to must not come from what
          # it judges. A column the API had not yet listed with its steps
          # would otherwise drop out of the check unjudged.
          sha=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_sha)
          rigorous=$(gh api -H 'Accept: application/vnd.github.raw' \
                       "repos/$GH_REPO/contents/.github/workflows/rigorous.yml?ref=$sha")
          yq -o=json '.jobs.rigorous.with.columns' <<<"$rigorous" | jq -r 'fromjson | .[].name' > expected.txt \
            && [ -s expected.txt ] || { echo "::error::no columns were read from rigorous.yml at $sha"; exit 1; }

          # The run's audit is rigorous.yml's last job. It checks each job's
          # result against the run's mode, which here requires the columns to
          # fail. It also checks that it needs every other job, and that main
          # does not require its name. Nothing else reads a red result there,
          # since the run is red anyway.
          #
          # rigorous.yml names the job with an expression on
          # `inputs.false_negative`, and the name is read from the branch taken
          # when that input is true. The pattern matches the whole expression,
          # so any other shape is refused. `''` is an apostrophe in the
          # expression's strings. `[$][{][{]` stands for the expression's
          # opening, since Actions would substitute that opening, spelt out, in
          # this script. A name that cannot be read fails this job, but the
          # columns are still judged.
          failed=0
          name_expression=$(yq -r '.jobs.audit.name' <<<"$rigorous")
          pattern="^[$][{][{] inputs\.false_negative == true && '(([^']|'')+)' [|][|] '(([^']|'')+)' [}][}]$"
          if [[ $name_expression =~ $pattern ]]; then
            q="'"
            run_audit=${BASH_REMATCH[1]//"$q$q"/"$q"}
          else
            echo "::error::no false-negative name for the run's audit was read from rigorous.yml at $sha: $name_expression"
            failed=1 run_audit=
          fi

          # Each column must show:
          #   - The corruption step having succeeded. A column red for another
          #     reason, such as a genuine break or an outage, proves nothing
          #     about whether it can see.
          #   - The job having failed.
          #   - The suite step having failed. A column whose suite passed was
          #     turned red by something other than the suite.
          #   - The drift step having succeeded. Red alone does not say which
          #     detector saw the corruption. The drift step is the drift
          #     detector's own account: a patch which, reversed, restores the
          #     corruption.
          # Both audits within the subject run must also have passed: the
          # column audit, which checks that every column ran its suite, and
          # the run's audit. Each must be exactly one job, as each column must.
          readers='
            def column_jobs($c): [.[] | select(.name | endswith(" / " + $c))];
            def conclusion(step): ([.steps[]? | select(.name | step) | .conclusion] | first) // "absent";
            def judged:
              [.conclusion // "absent",
               conclusion(startswith("Corrupt the tree")),
               conclusion(. == "Run the suite"),
               conclusion(startswith("The drift was reported"))];
            def job_verdict(job):
              [.[] | select(.name | job)] | if length != 1 then "JOBS:\(length)" else .[0].conclusion // "absent" end;
            def column_audit: job_verdict(endswith(" / Every column ran the suite"));
            def run_audit($name): job_verdict(. == $name);
            def awaited: . == "absent" or . == "JOBS:0";'

          # The jobs are read until each of these has a conclusion: both
          # audits, each column's job, and each step of that job that `judged`
          # reads. `gh run watch` returns once the run has completed, but the
          # jobs API can lag behind it. read_settled_jobs.sh gives the
          # measurement, and what happens if the conclusions never arrive.
          scripts/read_settled_jobs.sh "$id" jobs.json "$readers"'
            . as $jobs
            | [($columns | split("\n")[]
                | select(. as $c | $jobs | column_jobs($c)
                         | length == 0 or (.[0] | judged | any(. == "absent")))),
               (select(column_audit | awaited) | "the column audit"),
               (select($run_audit != "" and (run_audit($run_audit) | awaited)) | "the run\u0027s audit")]
            | join(", ")' --arg columns "$(cat expected.txt)" --arg run_audit "$run_audit"
          echo "jobs in the subject run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          while IFS= read -r column; do
            verdict=$(jq -r --arg c "$column" "$readers"'
              column_jobs($c)
              | if length != 1 then "JOBS:\(length)" else .[0] | judged | join("\t") end' jobs.json)
            if [[ $verdict == JOBS:* ]]; then
              echo "::error::$column: expected exactly one job, found ${verdict#JOBS:}"; failed=1; continue
            fi
            IFS=$'\t' read -r conclusion corrupted suite drift <<<"$verdict"
            if [[ $'\t'$verdict$'\t' == *$'\t'absent$'\t'* ]]; then
              echo "::error::$column: the jobs API gave no conclusion to the job, or to a step judged here: job / corruption / suite / drift -> ${verdict//$'\t'/ / }"; failed=1
            elif [ "$corrupted" != success ]; then
              echo "::error::$column: the corruption step concluded '$corrupted', so this is not a false-negative run"; failed=1
            elif [ "$conclusion" != failure ]; then
              echo "::error::$column came back $conclusion on a corrupted tree: this column cannot see"; failed=1
            elif [ "$suite" != failure ]; then
              echo "::error::$column went red, but its suite concluded '$suite': the suite did not see the corruption"; failed=1
            elif [ "$drift" != success ]; then
              echo "::error::$column went red, but its drift step concluded '$drift': the patch did not account for the corruption"; failed=1
            else
              echo "ok    $column was corrupted, its suite went red, and its patch accounts for the corruption"
            fi
          done < expected.txt

          audit=$(jq -r "$readers"'column_audit' jobs.json)
          case "$audit" in
            success) echo "ok    the column audit passed: every column ran";;
            JOBS:*)  echo "::error::the column audit: expected exactly one job, found ${audit#JOBS:}"; failed=1;;
            *)       echo "::error::the column audit concluded '$audit'"; failed=1;;
          esac

          if [ -n "$run_audit" ]; then
            audit=$(jq -r --arg name "$run_audit" "$readers"'run_audit($name)' jobs.json)
            case "$audit" in
              success) echo "ok    the run's audit passed: '$run_audit'";;
              JOBS:*)  echo "::error::the run's audit, '$run_audit': expected exactly one job, found ${audit#JOBS:}"; failed=1;;
              *)       echo "::error::the run's audit, '$run_audit', concluded '$audit'. Its log gives the reason: $(jq -r --arg name "$run_audit" '.[] | select(.name == $name) | .html_url' jobs.json)"
                       failed=1;;
            esac
          fi
          exit $failed


      # Each of the two jobs must show:
      #   - The corruption step having succeeded.
      #   - The step which measures having succeeded: doxygen's run, or the
      #     coverage run of the suite. A job red there proves nothing about
      #     its gate.
      #   - The gate's step, and the job, having failed.
      #   - The gate's finding of each corruption, in the job's log. A gate red
      #     on other findings alone did not see the corruption.
      # The jobs are named here, rather than read from docs.yml and
      # coverage.yml. A job renamed is then absent from the run, which fails
      # this step.
      - name: Docs and coverage were corrupted, and each gate failed on its corruption
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' }}
        run: |
          id=${{ steps.dispatch.outputs.id }}
          subjects='[
            {"job": "docs / Docs · Doxygen",
             "measure": "Generate, into a directory nobody keeps", "gate": "Fail on any documentation defect"},
            {"job": "coverage / Coverage · Linux · GCC",
             "measure": "Measure", "gate": "Check for uncalled functions"}]'
          readers='
            def conclusion(step): ([.steps[]? | select(.name == step) | .conclusion] | first) // "absent";
            def verdict($subject):
              [.[] | select(.name == $subject.job)]
              | if length != 1 then "JOBS:\(length)"
                else .[0] | [.conclusion // "absent",
                             conclusion("Corrupt the tree, so that the gate must go red"),
                             conclusion($subject.measure),
                             conclusion($subject.gate)] | join("\t") end;'
          scripts/read_settled_jobs.sh "$id" jobs.json "$readers"'
            . as $jobs
            | [$subjects[] | select(. as $subject | $jobs | verdict($subject) | test("^JOBS:0$|absent")) | .job]
            | join(", ")' --argjson subjects "$subjects"

          # judge <subject> (<finding> <extended regular expression>)...:
          # judges the job of $subjects[<subject>], and then whether, for each
          # finding, a line of the job's log matches the expression in full.
          # Prints a line for each, and returns 1 if any fails.
          judge() {
            local subject job verdict conclusion corrupted measured gated job_id log status=0
            subject=$(jq -c ".[$1]" <<<"$subjects")
            shift
            job=$(jq -r .job <<<"$subject")
            verdict=$(jq -r --argjson subject "$subject" "$readers"'verdict($subject)' jobs.json)
            if [[ $verdict == JOBS:* ]]; then
              echo "::error::$job: expected exactly one job, found ${verdict#JOBS:}"; return 1
            fi
            IFS=$'\t' read -r conclusion corrupted measured gated <<<"$verdict"
            if [[ $'\t'$verdict$'\t' == *$'\t'absent$'\t'* ]]; then
              echo "::error::$job: the jobs API gave no conclusion to the job, or to a step judged here: job / corruption / measurement / gate -> ${verdict//$'\t'/ / }"; return 1
            elif [ "$corrupted" != success ]; then
              echo "::error::$job: the corruption step concluded '$corrupted', so this is not a false-negative run"; return 1
            elif [ "$measured" != success ]; then
              echo "::error::$job: its measurement concluded '$measured', so its gate did not judge the corruption"; return 1
            elif [ "$conclusion" != failure ] || [ "$gated" != failure ]; then
              echo "::error::$job came back $conclusion, its gate $gated, on a corrupted tree: the gate cannot see"; return 1
            fi
            echo "ok    $job was corrupted, measured the corruption, and failed at its gate"
            job_id=$(jq -r --arg name "$job" '.[] | select(.name == $name) | .id' jobs.json)
            log=$(scripts/job_log.sh "$job_id") || { echo "::error::$job: its log could not be read"; return 1; }
            while [ $# -gt 0 ]; do
              if grep -qxE -- "$2" <<<"$log"; then
                echo "ok    $job gave $1"
              else
                echo "::error::$job gave no $1: its log has no line matching '$2'"; status=1
              fi
              shift 2
            done
            return $status
          }

          # The findings, as each gate prints them. Doxygen's warning names
          # the header, relative to the checkout, and its line.
          failed=0
          judge 0 "warning of the unknown command" \
              'Source/sequoia/TestFramework/TestRunner\.hpp:[0-9]+: warning: .*false_negative_control_unknown_command.*' \
            || failed=1
          judge 1 "error for the uncalled function" \
              'error: uncalled, and not in the baseline: Source/sequoia/TestFramework/TestRunner\.cpp: sequoia::testing::false_negative_control_uncalled\(\) \(lines [^)]*\)' \
            "notice for the entry naming no function" \
              'notice: no longer present, so it can leave the baseline: Source/sequoia/TestFramework/TestRunner\.cpp: sequoia::testing::false_negative_control_absent\(\)' \
            || failed=1
          exit $failed

  metrics:
    name: The gates on metrics, and the check of leftover materials, can still go red
    runs-on: ubuntu-latest
    # Each run dispatched builds TestAll, and one also builds
    # TestFrameworkDiagnostics and runs it twice under callgrind: 15 to 45
    # minutes, after however long they queue. The margin also holds the waits
    # in scripts/read_settled_jobs.sh.
    timeout-minutes: 120
    # The commits are pushed, and their branches deleted, with GITHUB_TOKEN,
    # whose pushes start no workflow.
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      METRICS_BRANCH: false-negative/metrics-gate-${{ github.run_id }}-${{ github.run_attempt }}
      LEFTOVER_BRANCH: false-negative/leftover-materials-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The corruptions, each sized against TestAll at 5769a33fe, whose record
      # holds 710,693 symbols, 257,187,335 bytes of their names, and
      # 1,224,068,781 instructions of prune's analysis:
      #   - 12,000 functions, each named within a namespace with a name of 363
      #     characters, add 12,000 symbols, 1.69%, and 4,704,795 bytes of
      #     names, 1.83% (run 41439574572). Each rise is above the 1 in 200 at
      #     which its gate fails, and below the 1 in 20 at which prune's does,
      #     so the gate's verdict tells the two thresholds apart.
      #   - A loop of 25,000,000 iterations over a volatile counter, in
      #     test_runner::prune, adds 199,939,146 instructions to prune's count,
      #     16.3%, above its gate's 1 in 20 (the same run).
      #   - `moved{false}` stops the runner moving the previous run's
      #     materials aside for its remover thread, so that each test's setup
      #     removes them itself. In an experiment of 2026-10-26 that cost about
      #     1,650 instructions per leftover entry, against the check's limit of
      #     400.
      # The symbols are functions which nothing calls, in a file already
      # compiled, so the work of prune's analysis and of the tests' setup is
      # as before. The loop adds no symbol, and runs only in prune's analysis.
      #
      # Each corruption checks that its file holds the text it changes exactly
      # once: a control that corrupts nothing is the false negative it exists
      # to catch.
      - name: Make the commits each gate must fail, on branches of their own
        id: commits
        run: |
          git config user.name "sequoia CI"
          git config user.email ci@example.invalid
          base=$(git rev-parse HEAD)
          source=Source/sequoia/TestFramework/TestRunner.cpp
          symbols=12000 namespace_padding=340 loop_iterations="25'000'000"

          # replace_once <file> <text> <replacement>
          replace_once() {
            python3 -B - "$@" <<'REPLACE'
          import sys
          path, text, replacement = sys.argv[1:]
          with open(path, encoding="utf-8") as f:
              held = f.read()
          if held.count(text) != 1:
              sys.exit(f"::error::{path} holds {held.count(text)} copies of {text!r}, not one")
          with open(path, "w", encoding="utf-8") as f:
              f.write(held.replace(text, replacement))
          REPLACE
          }

          analysis_banner='stream() << "\nAnalyzing dependencies...\n" << std::flush;'
          replace_once "$source" "$analysis_banner" \
            "$analysis_banner for(volatile std::size_t i{}; i < $loop_iterations; i = i + 1) {}"
          namespace=false_negative_control_$(printf "%0${namespace_padding}d" 0 | tr 0 x)
          { echo
            echo "namespace sequoia::$namespace"
            echo '{'
            seq "$symbols" | sed 's/.*/  void symbol_&() {}/'
            echo '}'
          } >> "$source"
          git add "$source"
          git commit -q -m "False-negative control: symbols, and work in prune's analysis"
          raising=$(git rev-parse HEAD)
          git checkout -q "$base"
          git merge -q --no-ff -m "False-negative control: the merge which the gates on metrics must fail" "$raising"
          merge=$(git rev-parse HEAD)

          git checkout -q "$base"
          replace_once "$source" 'const bool moved{!leftoverFailure && try_rename(temporaryRoot, discardedRoot)};' \
            'const bool moved{false};'
          git add "$source"
          git commit -q -m "False-negative control: each test's setup removes the previous run's materials"
          leftover=$(git rev-parse HEAD)

          # GitHub refuses to let GITHUB_TOKEN create a branch whose workflows
          # differ from main's: run 41437875246, from a branch which changed
          # them, was refused both. A branch of main with a change to Source
          # was accepted, from that branch (run 41439127441). The branches
          # here are of the commit this job runs on, main on the schedule.
          git push -q origin "$merge:refs/heads/$METRICS_BRANCH" "$leftover:refs/heads/$LEFTOVER_BRANCH" \
            || { echo "::error::the branches were refused: GITHUB_TOKEN may not create a branch whose workflows" \
                      "differ from main's, so this job runs only on a commit whose workflows are main's"; exit 1; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "$METRICS_BRANCH: $merge, the merge of $raising into $base"
          echo "$LEFTOVER_BRANCH: $leftover, on $base"
          { echo "base=$base"; echo "merge=$merge"; echo "leftover=$leftover"; } >> "$GITHUB_OUTPUT"

      # The steps below confirm that each run found is the one dispatched, by
      # the commits it measured.
      - name: Dispatch the runs that must fail, and find them
        id: dispatch
        run: |
          metrics=$(scripts/dispatch_and_find_run.sh metrics-gate.yml "$METRICS_BRANCH" \
                      -f needs_testing=true -f false_negative=true)
          leftover=$(scripts/dispatch_and_find_run.sh symbol-table.yml "$LEFTOVER_BRANCH" \
                       -f check_leftover_materials=true)
          { echo "metrics=$metrics"; echo "leftover=$leftover"; } >> "$GITHUB_OUTPUT"

      # As in `control`, without --exit-status, since each run is meant to
      # fail.
      - name: Wait for them
        run: |
          gh run watch "${{ steps.dispatch.outputs.metrics }}" --interval 60 > /dev/null
          gh run watch "${{ steps.dispatch.outputs.leftover }}" --interval 60 > /dev/null

      # The run must show:
      #   - Both commits measured: the merge's first parent, and the merge.
      #   - The comparison failed, every step before it having succeeded.
      #   - In the comparison's log, the measured record of the merge and the
      #     baseline's of the commit this job runs on, and for each series the
      #     error which its rise gives.
      #   - No other error in the comparison's log. A missing count, a break in
      #     the series and a tree which was not clean each give errors of their
      #     own.
      - name: The gates on metrics failed every series on its rise
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' }}
        env:
          ID: ${{ steps.dispatch.outputs.metrics }}
          BASE: ${{ steps.commits.outputs.base }}
          MERGE: ${{ steps.commits.outputs.merge }}
        run: |
          compare="Metrics against the merge's first parent"
          readers='
            def conclusion(step): ([.steps[]? | select(.name == step) | .conclusion] | first) // "absent";
            def named($name): [.[] | select(.name == $name)];
            def measuring: [.[] | select(.name | startswith("measure / "))];
            def steps_judged:
              ["Insist both commits were measured", "Copy the record of each commit",
               "Read the pull request\u0027s description", "Compare the record with the baseline"];
            def unsettled: .conclusion == null or ([steps_judged[] as $s | conclusion($s)] | index("absent") != null);'
          scripts/read_settled_jobs.sh "$ID" jobs.json "$readers"'
            [(select(named("The commits to measure") | length != 1 or .[0].conclusion == null) | "the commits"),
             (select(measuring | length != 2 or any(.conclusion == null)) | "the measurements"),
             (select(named($compare) | length != 1 or (.[0] | unsettled)) | "the comparison")]
            | join(", ")' --arg compare "$compare"
          echo "jobs in the subject run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          failed=0
          subject=$(jq -r "$readers"'named("The commits to measure") | map(.conclusion) | join(" ")' jobs.json)
          [ "$subject" = success ] || { echo "::error::the job finding the commits concluded '$subject'"; failed=1; }
          measured=$(jq -r "$readers"'measuring | map(.conclusion) | sort | join(" ")' jobs.json)
          [ "$measured" = "success success" ] || { echo "::error::the measurements concluded '$measured', not two successes"; failed=1; }
          steps=$(jq -r --arg compare "$compare" "$readers"'
            named($compare) | if length != 1 then "JOBS:\(length)"
            else .[0] | [.conclusion // "absent", (steps_judged[] as $s | conclusion($s))] | join(" ") end' jobs.json)
          if [ "$steps" != "failure success success success failure" ]; then
            echo "::error::the comparison and its steps concluded '$steps', not 'failure success success success failure'"
            exit 1
          fi
          echo "ok    the commits were measured, and the comparison failed"

          log=$(scripts/job_log.sh "$(jq -r --arg compare "$compare" '.[] | select(.name == $compare) | .id' jobs.json)")
          if grep -qxF "notice: the measured record is of $MERGE, the baseline's of $BASE" <<<"$log"; then
            echo "ok    the comparison read the merge's record, and the baseline's of its first parent"
          else
            echo "::error::the comparison's log does not name the merge, $MERGE, as measured and $BASE as the baseline"; failed=1
          fi
          # A rise which fails prints three errors: the rise, and the line
          # accepting it with the sentence introducing that line.
          series='(symbols|symbol_name_bytes|prune_dependency_analysis)'
          rise="error: $series: [0-9]+ -> [0-9]+, \+[0-9]+ \([^)]*\), allowed \+[0-9]+ \(1 in [0-9]+ of the baseline\)"
          acceptance="error: $series: to accept this rise, .*|error:   metrics-gate: accept $series \+[0-9]+"
          for name in symbols symbol_name_bytes prune_dependency_analysis; do
            finding=$(grep -xE "${rise/"$series"/$name}" <<<"$log") \
              && echo "ok    $finding" \
              || { echo "::error::the comparison's log gives no error for the rise of $name"; failed=1; }
          done
          others=$(grep -E '^error: ' <<<"$log" | grep -vxE "$rise|$acceptance" || true)
          [ -z "$others" ] || { echo "::error::the comparison's log gives other errors:"; echo "$others"; failed=1; }
          exit $failed

      # The run must show its one job failing at the check, every step making
      # the count having succeeded, and the check's error for the cost.
      - name: The check of leftover materials failed on their cost
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' }}
        env:
          ID: ${{ steps.dispatch.outputs.leftover }}
          LEFTOVER: ${{ steps.commits.outputs.leftover }}
        run: |
          readers='
            def conclusion(step): ([.steps[]? | select(.name == step) | .conclusion] | first) // "absent";
            def steps_judged:
              ["Count the setup cost of leftover materials", "Add the setup cost of leftover materials to the record",
               "Upload the record", "Check the setup cost of leftover materials"];
            def unsettled: .conclusion == null or ([steps_judged[] as $s | conclusion($s)] | index("absent") != null);'
          scripts/read_settled_jobs.sh "$ID" jobs.json "$readers"'
            [select(length != 1 or (.[0] | unsettled)) | "the job"] | join(", ")'
          echo "jobs in the subject run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          steps=$(jq -r "$readers"'
            if length != 1 then "JOBS:\(length)"
            else .[0] | [.conclusion // "absent", (steps_judged[] as $s | conclusion($s))] | join(" ") end' jobs.json)
          if [ "$steps" != "failure success success success failure" ]; then
            echo "::error::the job and its steps concluded '$steps', not 'failure success success success failure'"
            exit 1
          fi
          name=$(jq -r '.[0].name' jobs.json)
          [[ $name == *"($LEFTOVER)" ]] || { echo "::error::the job '$name' did not measure $LEFTOVER"; exit 1; }
          echo "ok    $LEFTOVER was measured, and the check failed"

          log=$(scripts/job_log.sh "$(jq -r '.[0].id' jobs.json)")
          finding=$(grep -xE "error: leftover materials cost the runner's setup [0-9]+ instructions for [0-9]+ entries, [0-9.]+ per entry, on .*; the limit is [0-9]+ per entry" <<<"$log") \
            || { echo "::error::the job's log gives no error for the cost of leftover materials"; exit 1; }
          echo "ok    $finding"

      - name: Delete the branches
        if: ${{ always() && steps.commits.outputs.pushed == 'true' }}
        run: git push -q origin --delete "$METRICS_BRANCH" "$LEFTOVER_BRANCH"

  records:
    name: The dashboard's records were written
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The data branch's head, and enough of staging's history to find its
      # newest commit made three hours ago or more.
      - name: Fetch staging and the data branch
        run: |
          git fetch -q --depth=1 origin +refs/heads/metrics:refs/remotes/origin/metrics
          git fetch -q --depth=100 origin +refs/heads/staging:refs/remotes/origin/staging

      # The commits judged are those which symbol-table.yml's push runs and
      # baseline-tightener.yml's dispatched runs on staging measured in the
      # last eight days, one more than the schedule's period, and each run
      # succeeded. A failed run is red already. symbol-table.yml's commits
      # also include staging's newest commit made three hours ago or more,
      # longer than a push run takes: no run at all for it says that the
      # trigger stopped firing. A week in which nothing was measured judges
      # the newest commit measured, so that no run judges nothing.
      #
      # A symbol-table record must hold every series which the dashboard
      # plots and the gates read, and its leftover materials' counts. So a
      # series added to a record is required of every commit judged, and its
      # check fails until eight days of records hold it, unless a backfill
      # adds it to the earlier ones.
      - name: Check each record
        run: |
          window='8 days' settling='3 hours'
          since=$(date -u -d "$window ago" +%Y-%m-%dT%H:%M:%S+00:00)
          # measured <workflow> <event>: the commits which successful runs of
          # <workflow> on staging, made by <event>, measured since $since, or
          # the newest such commit if there are none.
          measured() {
            local commits
            commits=$(gh run list --workflow "$1" --branch staging --event "$2" --status success \
                        --created ">=$since" --limit 200 --json headSha --jq '.[].headSha')
            [ -n "$commits" ] || commits=$(gh run list --workflow "$1" --branch staging --event "$2" \
                                             --status success --limit 1 --json headSha --jq '.[].headSha')
            [ -n "$commits" ] || { echo "::error::no run of $1 on staging, made by $2, has succeeded" >&2; return 1; }
            echo "$commits"
          }
          newest=$(git rev-list --first-parent -1 --until="$settling ago" origin/staging)
          symbol_tables=$( { measured symbol-table.yml push; echo "$newest"; } | sort -u)
          uncalled=$(measured baseline-tightener.yml workflow_dispatch | sort -u)

          failed=0
          python3 -B scripts/check_metrics_records.py --data origin/metrics --directory symbol-table/linux-gcc-debug \
            --field executable.symbols executable.symbol_name_bytes prune_dependency_analysis.instructions \
                    leftover_materials_setup.leftover_entries leftover_materials_setup.without_leftovers.instructions \
                    leftover_materials_setup.with_leftovers.instructions \
            --commit $symbol_tables || failed=1
          python3 -B scripts/check_metrics_records.py --data origin/metrics --directory uncalled-functions/linux-gcc \
            --field uncalled_functions --commit $uncalled || failed=1
          exit $failed
