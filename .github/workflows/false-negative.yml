name: false-negative

# The control for the gate. A gate that has never been seen to go red has not
# been shown to see anything: every one of its green runs is consistent with a
# suite that was never run, a flag that never reached the runner, or a detector
# that fires on nothing. sequoia's own test framework has a false-negative mode
# for exactly this reason, and the gate gets the same treatment.
#
# This dispatches rigorous with `false_negative: true`, which corrupts one
# versioned output and one prediction before building, then waits for the run
# and reads its jobs back. Every column must have failed, and the column audit
# within the run must have passed - the columns ran, and went red. A column that
# comes back green here is a column that cannot see, and this job fails on it.
#
# Weekly rather than nightly: it costs a full rigorous run, and what it measures
# - the gate's ability to fail - changes only when the workflows do. Run it by
# hand after any change to them.
#
# Dispatching with GITHUB_TOKEN is allowed: the recursion guard that stops a
# GITHUB_TOKEN push or PR from triggering workflows exempts workflow_dispatch.
# Roadmap item 148.
on:
  # Saturday evening, so that the result is in by Sunday morning even when the
  # scheduler is hours late, and four hours clear of the nightly's tick. The
  # minute is off the hour on purpose, where GitHub's scheduler is slowest: see
  # the schedule in rigorous.yml.
  schedule:
    - cron: '1 21 * * 6'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  control:
    name: The gate can still go red
    runs-on: ubuntu-latest
    # The subject run's columns may each take 90 minutes, after however long they
    # queue. The margin beyond that also holds the wait in scripts/read_settled_jobs.sh.
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Dispatch a rigorous run that must fail, and find it
        id: dispatch
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          gh workflow run rigorous.yml --ref "$GITHUB_REF_NAME" -f false_negative=true

          # The dispatch returns nothing; the run appears a few seconds later. The
          # OLDEST run after the timestamp, since a second dispatch inside this
          # window would otherwise be judged in place of ours; and the step below
          # confirms the run it found is a corrupted one.
          id=""
          for _ in $(seq 1 12); do
            sleep 10
            id=$(gh run list --workflow rigorous.yml --branch "$GITHUB_REF_NAME" \
                   --event workflow_dispatch --created ">=$before" \
                   --json databaseId --jq 'last.databaseId // empty')
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "::error::the dispatched run never appeared"; exit 1; }
          echo "subject: https://github.com/$GH_REPO/actions/runs/$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # `gh run watch` exits by the run's own status only with --exit-status,
      # which is not passed: the run is SUPPOSED to fail.
      - name: Wait for it
        run: gh run watch "${{ steps.dispatch.outputs.id }}" --interval 60 > /dev/null

      - name: Every column was corrupted and failed, and the audit saw them all run
        run: |
          id=${{ steps.dispatch.outputs.id }}

          # The columns are those that rigorous.yml gives the subject run, read at the
          # commit the run tested. The run's own jobs cannot supply them: the list a check
          # is held to must not come from what it judges. A column the API had not yet
          # listed with its steps would otherwise drop out of the check unjudged.
          sha=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_sha)
          rigorous=$(gh api -H 'Accept: application/vnd.github.raw' \
                       "repos/$GH_REPO/contents/.github/workflows/rigorous.yml?ref=$sha")
          yq -o=json '.jobs.rigorous.with.columns' <<<"$rigorous" | jq -r 'fromjson | .[].name' > expected.txt \
            && [ -s expected.txt ] || { echo "::error::no columns were read from rigorous.yml at $sha"; exit 1; }

          # Each column must show:
          #   - The corruption step having succeeded. A column red for another reason,
          #     such as a genuine break or an outage, proves nothing about whether it can
          #     see.
          #   - The job having failed.
          #   - The suite step having failed. A column whose suite passed was turned red
          #     by something other than the suite.
          #   - The drift step having succeeded. Red alone does not say which detector
          #     saw the corruption. The drift step is the drift detector's own account:
          #     a patch which, reversed, restores the corruption.
          # The audit within the subject run must also have passed. It checks that every
          # column ran its suite.
          readers='
            def column_jobs($c): [.[] | select(.name | endswith(" / " + $c))];
            def conclusion(step): ([.steps[]? | select(.name | step) | .conclusion] | first) // "absent";
            def judged:
              [.conclusion // "absent",
               conclusion(startswith("Corrupt the tree")),
               conclusion(. == "Run the suite"),
               conclusion(startswith("The drift was reported"))];
            def audit: [.[] | select(.name | endswith(" / Every column ran the suite")) | .conclusion // "absent"] | first // "absent";'

          # The jobs are read until each of these has a conclusion: the audit, each
          # column's job, and each step of that job that `judged` reads. `gh run watch`
          # returns once the run has completed, but the jobs API can lag behind it.
          # read_settled_jobs.sh gives the measurement, and what happens if the
          # conclusions never arrive.
          scripts/read_settled_jobs.sh "$id" jobs.json "$readers"'
            . as $jobs
            | [($columns | split("\n")[]
                | select(. as $c | $jobs | column_jobs($c)
                         | length == 0 or (.[0] | judged | any(. == "absent")))),
               (select(audit == "absent") | "the column audit")]
            | join(", ")' --arg columns "$(cat expected.txt)"
          echo "jobs in the subject run:"
          jq -r '.[] | "  \(.name): \(.conclusion // .status)"' jobs.json

          failed=0
          while IFS= read -r column; do
            verdict=$(jq -r --arg c "$column" "$readers"'
              column_jobs($c)
              | if length != 1 then "JOBS:\(length)" else .[0] | judged | join("\t") end' jobs.json)
            if [[ $verdict == JOBS:* ]]; then
              echo "::error::$column: expected exactly one job, found ${verdict#JOBS:}"; failed=1; continue
            fi
            IFS=$'\t' read -r conclusion corrupted suite drift <<<"$verdict"
            if [[ $'\t'$verdict$'\t' == *$'\t'absent$'\t'* ]]; then
              echo "::error::$column: the jobs API gave no conclusion to the job, or to a step judged here: job / corruption / suite / drift -> ${verdict//$'\t'/ / }"; failed=1
            elif [ "$corrupted" != success ]; then
              echo "::error::$column: the corruption step concluded '$corrupted', so this is not a false-negative run"; failed=1
            elif [ "$conclusion" != failure ]; then
              echo "::error::$column came back $conclusion on a corrupted tree: this column cannot see"; failed=1
            elif [ "$suite" != failure ]; then
              echo "::error::$column went red, but its suite concluded '$suite': the suite did not see the corruption"; failed=1
            elif [ "$drift" != success ]; then
              echo "::error::$column went red, but its drift step concluded '$drift': the patch did not account for the corruption"; failed=1
            else
              echo "ok    $column was corrupted, its suite went red, and its patch accounts for the corruption"
            fi
          done < expected.txt

          audit=$(jq -r "$readers"'audit' jobs.json)
          if [ "$audit" = success ]; then
            echo "ok    the column audit passed: every column ran"
          else
            echo "::error::the column audit concluded '$audit'"; failed=1
          fi
          exit $failed
