name: selftests

# The scripts' selftests, each on the platforms whose branches its controls run.
# A selftest whose controls are one platform's says so and passes elsewhere, so
# each runner names the selftests it is to run rather than running them all.
#
# The coverage job runs the tracefile and uncalled-functions selftests itself,
# with the lcov release and the demanglers it installs.
on:
  workflow_call:
    inputs:
      needs_testing:
        description: 'Whether the change touches anything the suite reads, scripts included: `true` or `false`, from scope.yml. Anything else fails every job.'
        required: true
        type: string

jobs:
  selftests:
    name: Script selftests · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Every platform reports, as in tests.yml.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            selftests: compile_time_report read_settled_jobs snapshot_at_deadline
          # report_crashes' controls run on macOS alone, since the system writes
          # the crash reports they read. No control runs its Linux or Windows
          # branch: tests.yml's control crash checks that a dump appears, and
          # never runs the script on it.
          - name: macOS
            os: macos-latest
            selftests: report_crashes snapshot_at_deadline
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # As in tests.yml: the job runs whatever the change, so that its check
      # always reports, and any answer but `true` or `false` fails it.
      - name: Nothing to test
        if: inputs.needs_testing != 'true'
        env:
          NEEDS_TESTING: ${{ inputs.needs_testing }}
        run: |
          if [ "$NEEDS_TESTING" != false ]; then
            echo "::error::the scope job's answer is '$NEEDS_TESTING', neither true nor false"
            exit 1
          fi
          echo "Nothing to test; the scope job's summary says why."

      # gdb reads the stacks in snapshot_at_deadline's Linux branch; the image has
      # none. The package is checked by exact name first, as in tests.yml's
      # "Install the toolchain (Linux)", since apt-get takes a name as a pattern.
      - name: Install gdb
        if: inputs.needs_testing == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          names=$(apt-cache pkgnames)
          grep -qFx -- gdb <<< "$names" || { echo "::error::gdb is not available on this image"; exit 1; }
          sudo apt-get install -y gdb

      # Every selftest runs, whichever fail, and the step names each that failed.
      - name: Run the selftests
        if: inputs.needs_testing == 'true'
        env:
          SELFTESTS: ${{ matrix.selftests }}
        run: |
          failed=()
          for selftest in $SELFTESTS; do
            echo "::group::$selftest"
            scripts/tests/"$selftest"_selftest.sh || failed+=("$selftest")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            for selftest in "${failed[@]}"; do echo "::error title=Selftest failed::$selftest"; done
            exit 1
          fi
          echo "Every selftest passed: $SELFTESTS"
