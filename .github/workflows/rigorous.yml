name: rigorous

# The gate on main, and therefore the definition of what main means: main only
# advances by promoting staging, and a promotion only merges when this is green.
# So main is not "the latest work" but "the last state verified this thoroughly",
# which is the property a client needs from it.
#
# Promotion-triggered rather than scheduled because it is batched: several changes
# reach staging through the fine gate, and one promotion asks the expensive
# questions once. A schedule would answer them at times nobody is promoting.
#
# At least as strict as fine, which is the invariant - not "contains fine's
# columns". Fine's two sanitized columns carry over unchanged; rigorous adds the
# two questions a sanitized Debug build cannot answer: TSan, which is mutually
# exclusive with ASan and so needs a build of its own, and Release, where the
# optimizer is a different compiler in practice.
#
# Deliberately incomplete for now - no macOS column,
# since its performance tests cannot hold on a hosted runner; no coverage; no
# `locate`; no Windows Release, which needs a build preset distinct from its
# configure preset. Each is an addition, not a redesign.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:

jobs:
  rigorous:
    uses: ./.github/workflows/tests.yml
    with:
      # Warnings are errors, as in fine.
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan"},
          {"name": "Linux · GCC · TSan",       "os": "ubuntu-latest",  "configure": "gcc-env-tsan",       "build": "gcc-env-tsan",       "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Linux · GCC · Release",    "os": "ubuntu-latest",  "configure": "gcc-env-release",    "build": "gcc-env-release",    "cc": "gcc-15", "cxx": "g++-15"}
        ]

  docs:
    uses: ./.github/workflows/docs.yml

  # Coverage, measured and published but gating nothing. Phase one deliberately:
  # thresholds picked before anyone has seen the distribution would be round
  # numbers rather than judgements.
  #
  # What it produces is chosen for what comes next. coverage.info is an lcov
  # tracefile, which is both the baseline a per-file regression rule would compare
  # against and the input `diff-cover` reads to answer "how well is *new* code
  # covered" - so the artifact is the thing phase two consumes, not a screenshot of
  # a number.
  #
  # The toolchain steps repeat tests.yml rather than reusing it, because this job
  # is a different shape: coverage runs the suite through ctest, serially, not
  # through the `run` target.
  coverage:
    name: Coverage · Linux · GCC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install the toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          for pkg in g++-15 ninja-build libtbb-dev lcov; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y g++-15 ninja-build libtbb-dev lcov
          g++-15 --version | head -1
          lcov --version

      - name: Give git an identity
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      - name: Configure and build
        working-directory: TestAll
        run: |
          cmake --preset gcc-env-coverage
          cmake --build --preset gcc-env-coverage

      # The script runs the suite through ctest itself, so there is no separate run
      # step; Utilities.cmake registers the test with --serial under CODE_COVERAGE,
      # which is why this is slower than the ordinary columns.
      - name: Measure
        run: ./scripts/generate_coverage_report.sh build/TestAll/gcc-env-coverage

      - name: Report
        if: always()
        run: |
          info=build/TestAll/gcc-env-coverage/coverage.info
          [ -f "$info" ] || { echo "::error::no tracefile at $info"; exit 1; }
          summary=$(lcov --summary "$info" 2>&1 | grep -E 'lines|functions' || true)
          echo "$summary"
          {
            echo "### Coverage"
            echo '```'
            echo "$summary"
            echo '```'
            echo "_Reported only. No threshold is applied yet._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tracefile and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/TestAll/gcc-env-coverage/coverage.info
            coverage_reports/
          if-no-files-found: warn
