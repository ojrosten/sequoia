name: rigorous

# The gate on main, and so the definition of what main means: main advances only by
# promoting staging, and a promotion merges only when this is green. main is
# therefore the last state verified this thoroughly, not the latest work.
#
# Promotion-triggered rather than scheduled, so the expensive columns are paid for
# once per promotion rather than once per change.
#
# Over fine, this is MEANT to add the two questions a sanitized Debug build cannot
# answer: races, and what the optimizer does. Both columns are withdrawn as of
# 2026-09-10 - see below - so at present it adds only the docs and coverage jobs,
# and its build columns are identical to fine's in every respect: same two
# entries, same warnings_as_errors, same exec_args.
#
# Say plainly what that costs, because the promotion model above is written as
# though it were not true: while those columns are out, promoting staging to main
# verifies nothing that merging into staging did not already verify, bar docs and
# coverage. `main` still means "promoted deliberately", but it does not currently
# mean "verified more thoroughly". Restoring the two columns is what makes the
# sentence above true again.
#
# The Windows column runs the suite with `--exclude-performance`. It is only the
# timing assertions a hosted runner cannot hold - TestRunnerPerformanceTest asserts
# 60ms +- 35 for eight 25ms sleeps run concurrently, and this runner returned 196ms
# and then 603ms for the same commit - so excluding those buys back everything else.
#
# A column's `exec_args` replaces the tier's rather than adding to them, so this one
# deliberately does not carry `--check-versioned-output`: the committed `_msvc` forks
# of the diagnostics output are stale, and gating on their drift before an MSVC run
# has ever refreshed them would block the gate on a known backlog. The Linux column
# still carries it, so drift is caught. Give MSVC the flag once the forks it writes
# have been reviewed and committed.
#
# TWO COLUMNS ARE TEMPORARILY WITHDRAWN, 2026-09-10. Both failed for reasons that
# predate the work they were blocking, and a gate nobody can pass stops being a
# gate: it just diverts promotions around itself. They come back, and the
# conditions are written down so that "in due course" has a definition.
#
# Linux · GCC · Release - roadmap item 135. Dies at COMPILE time, because
# `warnings_as_errors` meets three sites GCC only diagnoses at Release-level
# inlining: MonotonicSequence.hpp:121 (-Wstringop-overflow, 53 lines),
# Spaces.hpp:3465 (-Wmaybe-uninitialized, 48) and Iterator.hpp:309
# (-Warray-bounds, 6). Reproduced under gcc 16.2 as well as the image's gcc 15,
# so it is not version-specific. Note the count: CI showed two sites because
# -Werror stops at the first, and a local warning build found the third - a
# -Werror log reports the first failures, never the backlog. Two of the three
# sit under std::function's erased _M_invoke, so the first experiment is whether
# the copyable_function work removes them without anything being suppressed.
# Restore this column when those three sites are resolved or knowingly waived.
#
# Linux · GCC · TSan - roadmap item 136. Reports 54 data races, every one inside
# oneAPI TBB - partitioner.h 28, blocked_range.h 13, parallel_for.h 10,
# _small_object_pool.h 3 - and none in sequoia. Under GCC, sequoia::execution::par
# is std::execution::par, which libstdc++ implements on TBB, so `accelerate`
# takes std::for_each and TSan instruments a library it cannot see the
# synchronisation of. Suppressing those frames would silence the column without
# making it assert anything about us, since our own thread pool is the branch GCC
# never takes.
#
# The fix is to run TSan under CLANG, where `par` is a stand-in int and
# `accelerate` routes to sequoia's thread_pool_policy - measured 2026-09-10 on
# 63ec01258 with clang 23.1.0: zero ThreadSanitizer reports, 19588 checks, 0
# failures. That is blocked only by sequoia not yet compiling under clang +
# libstdc++, which is its own item. Restore this column AS A CLANG COLUMN when
# that lands; restoring it as a GCC one would only bring the noise back.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:

jobs:
  rigorous:
    uses: ./.github/workflows/tests.yml
    with:
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan", "exec_args": "--exclude-performance"}
        ]

  docs:
    uses: ./.github/workflows/docs.yml

  # Measured and published; no threshold is applied. The uploaded coverage.info is
  # an lcov tracefile, which is what both a per-file regression rule and diff-cover
  # would read.
  #
  # The toolchain steps repeat tests.yml rather than calling it: coverage runs the
  # suite through ctest, serially, not through the `run` target.
  coverage:
    name: Coverage · Linux · GCC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install the toolchain
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          for pkg in g++-15 ninja-build libtbb-dev lcov; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y g++-15 ninja-build libtbb-dev lcov
          g++-15 --version | head -1
          lcov --version

      - name: Give git an identity
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      - name: Configure and build
        working-directory: TestAll
        run: |
          cmake --preset gcc-env-coverage
          cmake --build --preset gcc-env-coverage

      # The script runs the suite through ctest itself, so there is no separate run
      # step. Utilities.cmake registers the test with --serial under CODE_COVERAGE.
      - name: Measure
        run: ./scripts/generate_coverage_report.sh build/TestAll/gcc-env-coverage

      - name: Report
        if: always()
        run: |
          info=build/TestAll/gcc-env-coverage/coverage.info
          [ -f "$info" ] || { echo "::error::no tracefile at $info"; exit 1; }
          summary=$(lcov --summary "$info" 2>&1 | grep -E 'lines|functions' || true)
          echo "$summary"
          {
            echo "### Coverage"
            echo '```'
            echo "$summary"
            echo '```'
            echo "_Reported only. No threshold is applied yet._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tracefile and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/TestAll/gcc-env-coverage/coverage.info
            coverage_reports/
          if-no-files-found: warn
