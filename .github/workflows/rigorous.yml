name: rigorous

# The gate on main, and so the definition of what main means: main advances only by
# promoting staging, and a promotion merges only when this is green. main is
# therefore the last state verified this thoroughly, not the latest work.
#
# Promotion-triggered, so the expensive columns are paid for once per promotion
# rather than once per change - and scheduled, nightly, on main. The gate answers
# "is this change promotable" once, on one day; that cannot tell whether the suite
# passes CONSISTENTLY, since races and timings are probabilistic and each run is
# one trial, nor whether it still passes on TODAY'S environment, since the hosted
# images roll and the PPA's gcc-15 is a moving snapshot. Both need repetition on a
# fixed tree, and main is the tree that is supposed to be fixed. A scheduled run
# fires from the default branch, so nothing here needs to name it.
#
# The scheduled run is one of two things, decided by whether staging is ahead of
# main. If it is not, the columns run on main, as above. If it is, the run opens
# the promotion PR instead - set to merge itself when green - and the columns run
# on THAT, through the pull_request trigger, where the result is spendable as the
# gate. The two are never both paid for on one night. Work lands on staging
# silently, and without this it accumulated until someone remembered; the PR is
# the notification, green or red.
#
# Over fine, this adds the two questions a sanitized Debug build cannot answer:
# races, and what the optimizer does.
#
# Which columns run which tests is set out below, at the point it is decided. Both
# Windows columns exclude the performance tests, for the reason every hosted column
# has them off bar one. Their other exclusions differ, and neither carries the
# other's: MSVC ASan leaves out TestRunnerTest, whose teardown Windows
# intermittently refuses - roadmap item 134 - and MSVC Release leaves out
# TestRunnerProjectFiles, for the reason given below.
#
# Every column but Linux · GCC · Release carries `--check-versioned-output`,
# including the Windows and macOS ones, which for a time did not. That one
# exception is untested rather than justified, and is explained where it is set,
# below. The reason they did not - that the committed
# `_msvc` forks were stale - was measured and found false on 2026-09-10: of the 340
# output files a real MSVC run writes, 339 already matched, and the four
# `_FNOutput_msvc` forks long cited as decayed are byte-identical. The single
# genuine straggler was `test_runner_project_files_msvc.txt`, still carrying the
# display name the naming branch retired, because it is the one output a Mac cannot
# regenerate. It is fixed, so the flag can go on. A macOS run matched all 340.
#
# TestRunnerProjectFiles is left out of the MSVC Release column. It compares a
# generated TestAll.vcxproj against a prediction stored per preset -
# `ProjectFiles/<preset>`, taken from the build directory's name, which for this
# column is `msvc-release` - and predictions exist for `msvc` and `msvc-asan` only.
# A third would have to be generated on Windows and committed; until then the column
# would be comparing against a directory that does not exist. The test is a no-op on
# clang, so the macOS Release column needs no such exclusion.
#
# Note this column configures with `msvc-release`, not `msvc`. The Visual Studio
# generator is multi-config, so one configure preset can serve both Debug and
# Release out of a single build tree - and Commands.cpp derives BOTH halves of the
# nested project's build from that tree's NAME: `cmake --preset <dir>` at :31 and
# `cmake --build --preset <dir>` at :41. That is why the fix had to add a configure
# preset and not merely rename a build one: without `msvc-release` in the configure
# namespace the nested configure would fail outright. Pointed at a
# tree called `msvc`, it therefore rebuilt the nested end-to-end project as Debug
# while this column was Release, so the executable was never where the test looked.
# The run reported `versioned_output_diffs`, which was an artefact of
# `child_return_code` casting a child's exit status of 1 straight onto the
# bitmask - see roadmap item 146 - and not drift at all. A configure preset per
# configuration keeps directory, preset and configuration in agreement.
#
# Note the flag must be spelt out per column here, since `exec_args` REPLACES the
# tier's rather than adding to it - a column naming only its exclusions silently
# loses the drift check, which is how Windows came to be unchecked in the first
# place.
#
# The TSan column is macOS/Clang where every other column is Linux/GCC or MSVC,
# and that is deliberate. `Preprocessor.hpp` gives `sequoia::execution::par` the
# real `std::execution::par` only where `__cpp_lib_parallel_algorithm` is defined,
# which is a property of the standard library: libstdc++ has the parallel
# algorithms, on oneAPI TBB; libc++ does not. So under GCC, `accelerate` runs
# `std::for_each(par, ...)` and TSan instruments TBB rather than us - it reported
# 54 races on PR #41, 28 in partitioner.h, 13 in blocked_range.h, 10 in
# parallel_for.h, 3 in _small_object_pool.h, and none in sequoia, because TSan
# cannot see TBB's internal synchronisation unless TBB is built with TSan.
#
# Clang with libc++ takes the other branch, `thread_pool_policy`, so TSan
# observes the concurrency we actually wrote. Measured 2026-09-10 on 63ec01258
# with clang 23.1.0 on arm64: zero ThreadSanitizer reports, 19588 checks, 0
# failures. Suppressing the TBB frames instead would have left the column
# asserting nothing about our code, since our pool is the branch GCC never takes.
#
# It must be macOS rather than Linux, and that is the whole point: clang as
# shipped means libc++ on macOS but **libstdc++ on Linux**, where the feature
# macro is defined and TBB would come straight back. Do not "regularise" this to
# ubuntu-latest.
#
# macOS was dropped on 2026-09-08 over the timing assertions a hosted runner
# cannot hold; `--exclude-performance` is what buys it back, exactly as it does
# for the Windows columns.
#
# The Release column exists because -O3 asks questions Debug cannot, and it was
# withdrawn between 2026-09-10 and this commit while its warnings were understood.
# All 107 lines were false positives from three sites: 101 from gcc's loop
# vectorizer, which -fno-tree-loop-vectorize removes while leaving the diagnostics
# enabled, and 6 from an address computed in a branch of libstdc++'s
# __final_insertion_sort that a two-edge graph cannot reach. They are suppressed at
# the sites, each saying why - see roadmap item 135. Note that the suite had never
# actually run at -O3 before, the column having always died at compile time; it
# does now, 19588 checks, 0 failures.
#
# This column carries NO flags - an explicitly empty `exec_args`, which is not the
# same as omitting the key. The drift check was dropped here pre-emptively, off a
# macOS measurement: gcc at -O3 there mis-attributes std::source_location, so a run
# rewrites a diagnostics file with another translation unit's location. But the
# mechanism is ld64 discarding a Mach-O atom, which has no ELF counterpart, and this
# column has never actually tried the flag - every run that carried it died at
# compile time instead. Reported 2026-09-11 as a further instance of
# https://gcc.gnu.org/bugzilla/show_bug.cgi?id=126723 (roadmap item 139); restore
# the flag when gcc is fixed, and put it back sooner than that to find out whether
# this column was ever affected.
#
# The performance tests run HERE and nowhere else in this tier, which is
# deliberate. What makes them unreliable on a hosted runner is the slowdown, not
# the platform: TestRunnerPerformanceTest asserts 60ms +- 35 for eight 25ms sleeps
# run concurrently, and the sanitized columns cannot hold it - `fine`'s Linux
# ASan+UBSan returned 164ms on 2026-09-10, and MSVC gave 196ms then 603ms for one
# commit. Uninstrumented gcc can: `coarse`'s Linux Debug column has run them 20
# times out of 20 since 2026-09-09. This column is uninstrumented gcc, so it is
# the one that should carry them, and it is why the tier is not simply blind to
# performance.
#
# Hence the asymmetry in `exec_args` below: the sanitized Linux column excludes
# them and spells out BOTH flags, because a column's `exec_args` REPLACES the
# tier's - naming only the exclusion would silently lose the drift check - while
# this column carries an explicitly empty `exec_args`, which is not the same as
# omitting the key: it runs with no flags at all, and inherits nothing.
# The MSVC ASan columns leave out TestRunnerTest: its instability-analysis cleanup
# calls fs::remove_all on a folder a just-exited sandbox subprocess still has open,
# and Windows refuses the delete. Every check in it passes - the run dies in
# teardown - and it has cost 3 of 6 gating runs. It is ASan-specific: the
# uninstrumented Windows column runs the same test to 55 checks and is green, so
# the exclusion is scoped to the sanitized columns rather than to Windows.
# Roadmap item 134 tracks the fix; this is a stop-gap, not a verdict.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'coverage_reports/**'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  # Scheduled runs only: which of the two things this run is. The compare endpoint
  # rather than a checkout, so the merge commits that promotion leaves on main and
  # not on staging do not count as staging being behind.
  staging:
    name: Is staging ahead of main
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ahead: ${{ steps.compare.outputs.ahead }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: compare
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...staging" --jq .ahead_by)
          echo "staging is $ahead commit(s) ahead of main"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"

  # `!cancelled()` rather than the implied success(): the job above is skipped on
  # every event but the schedule, and a skipped dependency would otherwise skip
  # these too.
  rigorous:
    needs: staging
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    uses: ./.github/workflows/tests.yml
    with:
      warnings_as_errors: true
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan", "exec_args": "--check-versioned-output;--exclude-performance;--exclude;Tests/TestFramework/TestRunnerTest.cpp"},
          {"name": "Linux · GCC · Release",    "os": "ubuntu-latest",  "configure": "gcc-env-release",    "build": "gcc-env-release",    "cc": "gcc-15", "cxx": "g++-15", "exec_args": ""},
          {"name": "macOS · Clang · TSan",     "os": "macos-latest",   "configure": "llvm-env-tsan",      "build": "llvm-env-tsan", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · Release", "os": "windows-latest", "configure": "msvc-release",       "build": "msvc-release", "exec_args": "--check-versioned-output;--exclude-performance;--exclude;Tests/TestFramework/TestRunnerProjectFiles.cpp"},
          {"name": "macOS · Clang · Release",  "os": "macos-latest",   "configure": "llvm-env-release",   "build": "llvm-env-release", "exec_args": "--check-versioned-output;--exclude-performance"}
        ]

  docs:
    needs: staging
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    uses: ./.github/workflows/docs.yml

  # Measured and published; no threshold is applied. The uploaded coverage.info is
  # an lcov tracefile, which is what both a per-file regression rule and diff-cover
  # would read.
  #
  # The toolchain steps repeat tests.yml rather than calling it: coverage runs the
  # suite through ctest, serially, not through the `run` target.
  coverage:
    name: Coverage · Linux · GCC
    needs: staging
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install the toolchain
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          for pkg in g++-15 ninja-build libtbb-dev lcov; do
            apt-cache pkgnames | grep -qx "$pkg" \
              || { echo "::error::$pkg is not available on this image"; exit 1; }
          done
          sudo apt-get install -y g++-15 ninja-build libtbb-dev lcov
          g++-15 --version | head -1
          lcov --version

      - name: Give git an identity
        run: |
          git config --global user.name "sequoia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch trunk

      - name: Configure and build
        working-directory: TestAll
        run: |
          cmake --preset gcc-env-coverage
          cmake --build --preset gcc-env-coverage

      # The script runs the suite through ctest itself, so there is no separate run
      # step. Utilities.cmake registers the test with --serial under CODE_COVERAGE.
      - name: Measure
        run: ./scripts/generate_coverage_report.sh build/TestAll/gcc-env-coverage

      - name: Report
        if: always()
        run: |
          info=build/TestAll/gcc-env-coverage/coverage.info
          [ -f "$info" ] || { echo "::error::no tracefile at $info"; exit 1; }
          summary=$(lcov --summary "$info" 2>&1 | grep -E 'lines|functions' || true)
          echo "$summary"
          {
            echo "### Coverage"
            echo '```'
            echo "$summary"
            echo '```'
            echo "_Reported only. No threshold is applied yet._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tracefile and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/TestAll/gcc-env-coverage/coverage.info
            coverage_reports/
          if-no-files-found: warn

  # Opens the promotion PR and sets it to merge itself once the gate is green.
  # Needs a token other than GITHUB_TOKEN: a PR that token opens triggers no
  # pull_request workflow, so the gate would never report on it. PROMOTION_TOKEN
  # is a fine-grained PAT with Contents and Pull requests read/write on this
  # repository; when it expires this step fails, loudly, which is the point.
  #
  # One PR at a time. If one is already open it is left alone: the gate re-runs on
  # it whenever staging moves, and if it is red that is the thing to look at.
  promote:
    name: Promote staging
    needs: staging
    if: github.event_name == 'schedule' && needs.staging.outputs.ahead != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AHEAD: ${{ needs.staging.outputs.ahead }}
    steps:
      - name: Open the promotion PR, unless one is open
        run: |
          open=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "promotion PR #$open is already open"
            exit 0
          fi
          url=$(gh pr create --base main --head staging \
                  --title "Promote staging to main" \
                  --body "Opened by the scheduled rigorous run: staging is $AHEAD commit(s) ahead of main. Merges itself when the gate is green.")
          gh pr merge --auto --merge "$url"
          echo "opened $url"
