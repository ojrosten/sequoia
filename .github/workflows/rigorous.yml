name: rigorous

# The gate on main. Only a promotion of staging advances main, and a
# promotion merges only when this workflow is green. So main is the last state
# verified this thoroughly, not the latest work.
#
# The gate runs on the promotion PR, not on each change: once when the PR
# opens, and again each time staging moves while it is open. Changes reach
# main in batches, so the expensive columns are not paid for once per change.
# The nightly run on main checks two things that one run of the gate cannot:
#   - Does the suite pass consistently? Races and timings are probabilistic,
#     and each run is one trial.
#   - Does it still pass in today's environment? The hosted images roll, and
#     the PPA's gcc-15 is a moving snapshot.
# Both need repetition on a fixed tree, and main is the tree meant to be
# fixed. A scheduled run fires from the default branch, so nothing here names
# main.
#
# Whether staging is ahead of main decides what the scheduled run does:
#   - Not ahead: the columns run on main.
#   - Ahead, with no promotion PR open: the run opens one, set to merge itself
#     when green. The columns then run on the PR, through the pull_request
#     trigger, where their result gates the merge.
#   - Ahead, with the promotion PR already open: the run only makes sure the
#     PR is set to merge itself. The PR re-runs the gate whenever staging
#     moves.
# So no night pays for the columns twice. The promotion PR is also the
# notification that staging holds work to promote, whether its gate is green
# or red.
#
# Beyond fine, this tier tests whether the code races and what the optimizer
# does with it, which a sanitized Debug build cannot.
#
# Two columns add a second pass, which repeats the suite without the
# end-to-end test:
#   - TSan, twenty times. TSan reports only the interleavings that execute,
#     and repetition widens them.
#   - MSVC ASan, five times. It is the configuration in which the sharing
#     violation described below was most frequent.
# The end-to-end test dominates a pass, and most of the code where races live
# runs outside it. Each N is set by the 30-minute step ceiling against the
# time a pass takes on that column. Measured on run 34751872361, 2026-09-13:
#   - TSan: a full pass took 79s, and a pass without the end-to-end test
#     12-18s, so twenty took 259s.
#   - MSVC ASan: a full pass took 216s, and a pass without the end-to-end test
#     91-100s, rising with each repetition. Twenty overran the ceiling at the
#     nineteenth; five take about eight minutes.
# The first pass still runs every test once. The repetitions carry the drift
# flag, since a repetition that rewrote a versioned output would be an
# instability. statistical.yml repeats the whole suite but the performance
# tests on main every night, without the drift flag; the second pass here
# repeats everything but the end-to-end test on the candidate, before it
# lands.
#
# Every column but Linux · GCC · Release carries `--check-versioned-output`,
# and that exception is explained below. A column's `exec_args` replaces the
# tier's rather than adding to it, so each column spells the flag out. A
# column naming only its exclusions silently loses the drift check.
#
# The committed `_msvc` output forks are current, so the MSVC columns check
# the versioned output as the others do. On 2026-09-10 a real MSVC run matched
# 339 of the 340 output files it wrote, and the one that differed has been
# regenerated since. A macOS run matched all 340.
#
# The TSan column is macOS/Clang, where every other column is Linux/GCC or
# MSVC, and that is deliberate. `Preprocessor.hpp` gives
# `sequoia::execution::par` the real `std::execution::par` only where
# `__cpp_lib_parallel_algorithm` is defined, which is a property of the
# standard library. libstdc++ has the parallel algorithms, on oneAPI TBB, and
# libc++ does not. So under GCC, `accelerate` runs `std::for_each(par, ...)`,
# and TSan instruments TBB rather than sequoia. TSan cannot see TBB's internal
# synchronisation unless TBB is built with TSan: on PR #41 it reported 54
# races, all in TBB's headers and none in sequoia.
#
# Clang with libc++ takes the other branch, `thread_pool_policy`, so TSan
# observes the concurrency sequoia implements. On 2026-09-10 (63ec01258, clang
# 23.1.0, arm64) it gave zero reports over 19588 checks. Suppressing the TBB
# frames instead would leave the column asserting nothing about sequoia,
# since sequoia's pool is the branch GCC never takes.
#
# It must be macOS rather than Linux. Clang as shipped uses libc++ on macOS
# but libstdc++ on Linux, where the feature macro is defined and TBB comes
# straight back. Do not "regularise" this column to ubuntu-latest.
#
# Linux · GCC · Release exists because -O3 asks questions Debug cannot. Its
# `exec_args` is explicitly empty, which is not the same as omitting the key:
# the column runs with no flags, and inherits none of the tier's.
#
# It is the one column without the drift check. gcc at -O3 on macOS
# mis-attributes std::source_location, so a run there rewrites a diagnostics
# file with another translation unit's location
# (https://gcc.gnu.org/bugzilla/show_bug.cgi?id=126723). The mechanism is ld64
# discarding a Mach-O atom, which has no ELF counterpart, so this column may
# be unaffected: no run of it with the flag has yet reached the suite. Restore
# the flag when gcc is fixed, or sooner, to find out whether this column was
# ever affected.
#
# It is also the one column that runs the performance tests.
# TestRunnerPerformanceTest asserts 60ms +- 35 for eight 25ms sleeps run
# concurrently, and the other hosted columns cannot hold that:
#   - A sanitizer slows the run: Linux ASan+UBSan returned 164ms on
#     2026-09-10.
#   - The Windows runner's times vary: 196ms, then 603ms, for one commit.
#   - The macOS runner's sleeps overshoot even without instrumentation.
# Uninstrumented gcc on Linux can: since #181 made the test assert on raw
# times, coarse's Linux Debug column passed it in all 119 runs to 2026-10-05.
# Every other column here carries `--exclude-performance`, and this column
# keeps the tier from being blind to performance.
#
# Both MSVC columns run TestRunnerTest, as every MSVC column in every tier
# does. Its teardown's fs::remove_all used to fail on Windows with a sharing
# violation: under ASan in 2 runs of 4, Release 1 of 3, Debug 3 of 38.
# std::system spawned children with every open file inherited, so a spawn on
# one thread captured a file another thread had open. `invoke` now spawns
# with a handle list naming only the standard streams, and a deterministic
# test witnesses the mechanism. So a sharing violation on any MSVC column, in
# any tier, is evidence against that fix, not a flake to re-run.
#
# No path filter: scope.yml says why, and how a column with nothing to test
# still reports.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      false_negative:
        description: 'Corrupt the checkout so that every column must go red. The control for the gate: see false-negative.yml.'
        required: false
        type: boolean
        default: false
  # The minute is off the hour, on GitHub's advice that its scheduler is most
  # loaded at the start of an hour. That has not shortened the delay: over the
  # 20 nights to 2026-10-07, GitHub created the run 4h34m to 6h21m after its
  # tick, against 4h32m to 4h57m on the four nights at '0 3 * * *'.
  #
  # GitHub documents that it can drop a queued scheduled run under load. This
  # run's audit cannot report a run that never started; watchdog.yml does.
  schedule:
    - cron: '1 1 * * *'

# A push to the head of an open PR into main cancels that PR's run in flight:
# a superseded run gates nothing, and Windows runners are scarce. Scheduled
# and dispatched runs each get a group of their own, so nothing cancels them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Scheduled runs only: whether staging is ahead of main, which decides the
  # run's mode. The job asks the compare endpoint rather than comparing a
  # checkout, so that merge commits that promotion leaves on main but not on
  # staging do not count as staging being behind.
  staging:
    name: Is staging ahead of main
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ahead: ${{ steps.compare.outputs.ahead }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: compare
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...staging" --jq .ahead_by)
          echo "staging is $ahead commit(s) ahead of main"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"

  # One decision for the whole run, which every job below takes as an input.
  scope:
    uses: ./.github/workflows/scope.yml

  # `!cancelled()` replaces the implied success(). The staging job is skipped
  # on every event but the schedule, and a skipped dependency would otherwise
  # skip these jobs too. A failed scope job does not skip them either: they
  # run, and fail on the missing answer.
  rigorous:
    needs: [staging, scope]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    uses: ./.github/workflows/tests.yml
    with:
      needs_testing: ${{ needs.scope.outputs.suite }}
      merge_into: ''
      warnings_as_errors: true
      false_negative: ${{ inputs.false_negative == true }}
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan", "exec_args": "--check-versioned-output;--exclude-performance", "repeat_args": "locate;5;--check-versioned-output;--exclude-performance;exclude;Tests/TestFramework/TestRunnerEndToEndFreeTest.cpp"},
          {"name": "Linux · GCC · Release",    "os": "ubuntu-latest",  "configure": "gcc-env-release",    "build": "gcc-env-release",    "cc": "gcc-15", "cxx": "g++-15", "exec_args": ""},
          {"name": "macOS · Clang · TSan",     "os": "macos-latest",   "configure": "llvm-env-tsan",      "build": "llvm-env-tsan", "exec_args": "--check-versioned-output;--exclude-performance", "repeat_args": "locate;20;--check-versioned-output;--exclude-performance;exclude;Tests/TestFramework/TestRunnerEndToEndFreeTest.cpp"},
          {"name": "Windows · MSVC · Release", "os": "windows-latest", "configure": "msvc-release",       "build": "msvc-release", "exec_args": "--check-versioned-output;--exclude-performance"},
          {"name": "macOS · Clang · Release",  "os": "macos-latest",   "configure": "llvm-env-release",   "build": "llvm-env-release", "exec_args": "--check-versioned-output;--exclude-performance"}
        ]

  docs:
    needs: [staging, scope]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    uses: ./.github/workflows/docs.yml
    with:
      needs_testing: ${{ needs.scope.outputs.documentation }}

  # The gate on functions of Source that no test calls, and the published
  # coverage figures; coverage.yml says what the job does.
  coverage:
    needs: [staging, scope]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.staging.outputs.ahead == '0') }}
    uses: ./.github/workflows/coverage.yml
    with:
      needs_testing: ${{ needs.scope.outputs.coverage }}
      merge_into: ''

  # Opens the promotion PR and sets it to merge itself once the gate is green.
  # It needs a token other than GITHUB_TOKEN: a PR that token opens triggers no
  # pull_request workflow, so the gate would never report on it.
  # PROMOTION_TOKEN is a fine-grained PAT with Contents and Pull requests
  # read/write on this repository. When it expires, this step fails, as does
  # baseline-tightener.yml's propose job: renew it with the same permissions.
  #
  # One PR at a time. Whatever the previous night left, the step ends with one
  # promotion PR open and set to auto-merge, so an open PR without auto-merge
  # is given it. Creating the PR needs Pull requests: write, and enabling
  # auto-merge needs Contents: write as well, so either half can fail alone. A
  # step that left an open PR alone would leave a PR created without
  # auto-merge stuck for good. Whoever opened the PR, this step completes it,
  # so opening one by hand is fine.
  #
  # Only a PR from this repository's staging counts. `--head staging` also
  # matches a fork's branch named staging, and the step would otherwise arm
  # the fork's PR to merge into main. A PR whose field is missing does not
  # count either.
  #
  # `gh pr merge --auto` merges a PR at once if GitHub already reports it
  # mergeable, since GitHub refuses to arm auto-merge on a clean PR. Either way
  # main advances only when GitHub allows it. The step re-reads the PR
  # afterwards and reports which of the two happened.
  #
  # One shape is an error: the PR is mergeable, set to auto-merge, and still
  # open an hour after its last check completed. GitHub then has everything it
  # needs and has not acted, and every night would otherwise look fine. The
  # hour allows for auto-merge's delay, which has ranged from five seconds to
  # more than fifteen minutes, the latter during an outage of GitHub's Pull
  # Requests service. A PR whose gate is red is BLOCKED, not CLEAN, and its
  # own checks report it. A conflict (DIRTY) cannot arise while main moves only
  # by `--merge`-ing staging into it, and is reported as an error rather than
  # assumed away.
  promote:
    name: Promote staging
    needs: staging
    if: github.event_name == 'schedule' && needs.staging.outputs.ahead != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AHEAD: ${{ needs.staging.outputs.ahead }}
    steps:
      - name: Open the promotion PR and set it to auto-merge, whichever is missing
        run: |
          pr=$(gh pr list --base main --head staging --state open --json number,isCrossRepository \
                 --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')
          if [ -n "$pr" ]; then
            echo "promotion PR #$pr is already open"
          else
            url=$(gh pr create --base main --head staging \
                    --title "Promote staging to main" \
                    --body "Opened by the scheduled rigorous run: staging is $AHEAD commit(s) ahead of main. Merges itself when the gate is green.")
            pr=${url##*/}
            echo "opened $url"
          fi
          info=$(gh pr view "$pr" --json autoMergeRequest,mergeStateStatus --jq '"\(.autoMergeRequest != null) \(.mergeStateStatus)"')
          read -r armed state <<<"$info"
          case "$armed" in
            false)
              gh pr merge --auto --merge "$pr"
              after=$(gh pr view "$pr" --json state,autoMergeRequest --jq '"\(.state) \(.autoMergeRequest != null)"')
              case "$after" in
                "MERGED "*) echo "#$pr was already mergeable and has been merged";;
                "OPEN true") echo "#$pr is $state and now set to auto-merge";;
                *) echo "::error::#$pr reads '$after' after gh pr merge --auto"; exit 1;;
              esac;;
            true)
              case "$state" in
                CLEAN|UNSTABLE)
                  last_check=$(gh pr view "$pr" --json statusCheckRollup --jq '[.statusCheckRollup[].completedAt // empty] | max')
                  minutes_since=$(( ($(date -u +%s) - $(date -u -d "$last_check" +%s)) / 60 ))
                  if [ "$minutes_since" -lt 60 ]; then
                    echo "#$pr is $state and set to auto-merge, its last check ${minutes_since}m ago; GitHub's move"
                  else
                    echo "::error::#$pr is $state and set to auto-merge, its last check ${minutes_since}m ago, yet has not merged"; exit 1
                  fi;;
                DIRTY)
                  echo "::error::#$pr is DIRTY: staging conflicts with main, which merging staging into main cannot produce"; exit 1;;
                *)
                  echo "#$pr is $state and set to auto-merge; nothing to do";;
              esac;;
            *)
              echo "::error::cannot read #$pr: '$info'"; exit 1;;
          esac

  # Checks the run's own shape against what its mode requires. A job skipped
  # by a wrong `if:` shows the same green tick as one that passed, and most
  # jobs above carry an `if:`. Each job's result is read from `needs`, which
  # reports `skipped` where the tick shows green:
  #   - In gate mode the columns, docs and coverage must have run, and promote
  #     must not.
  #   - In promote mode, the reverse.
  #   - In the false-negative control the columns must have failed.
  #
  # The branch main requires this job and none of the others, so a job
  # missing from this job's `needs` would gate nothing, however red. The
  # second step fails if any other job is missing. The third fails unless
  # main's rule names this job, pinned to the app that reports it. A rename
  # here, or an edit to the rule, then shows as a red check, rather than as a
  # promotion that waits on a name nothing reports, or merges ungated. The
  # second and third steps run even when an earlier step fails, so each
  # reports independently.
  #
  # In the false-negative control this job passes on red columns, so it takes
  # another name there, and the third step insists main does not require that
  # name. If main did, the control would satisfy main's rule for the commit it
  # ran on: a promotion PR's head, if the control was dispatched on staging.
  audit:
    name: ${{ inputs.false_negative == true && 'Every column failed, as the false-negative control requires' || 'Every job ran as this run''s mode requires' }}
    needs: [staging, scope, rigorous, docs, coverage, promote]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      AHEAD: ${{ needs.staging.outputs.ahead }}
      RESULTS: ${{ toJSON(needs) }}
      FALSE_NEGATIVE: ${{ inputs.false_negative == true }}
    steps:
      - name: Check each job's result against the mode
        run: |
          if [ "$EVENT" = schedule ] && [ "$AHEAD" != 0 ]; then mode=promote; else mode=gate; fi
          echo "event: $EVENT; mode: $mode; false-negative control: $FALSE_NEGATIVE"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$RESULTS"

          failed=0
          expected=()
          expect() {
            expected+=("$1")
            actual=$(jq -r --arg j "$1" '.[$j].result' <<<"$RESULTS")
            if [ "$actual" = "$2" ]; then
              echo "ok    $1: $actual"
            else
              echo "::error::$1: expected $2 in $mode mode, was $actual"; failed=1
            fi
          }
          if [ "$EVENT" = schedule ]; then expect staging success; else expect staging skipped; fi
          expect scope success
          case "$mode" in
            gate)
              if [ "$FALSE_NEGATIVE" = true ]; then expect rigorous failure; else expect rigorous success; fi
              expect docs success
              expect coverage success
              expect promote skipped;;
            promote)
              expect promote success
              expect rigorous skipped
              expect docs skipped
              expect coverage skipped;;
          esac

          unexpected=$(comm -23 <(jq -r 'keys[]' <<<"$RESULTS" | sort) <(printf '%s\n' "${expected[@]}" | sort))
          if [ -n "$unexpected" ]; then
            echo "::error::no result is expected in $mode mode of: $unexpected"; failed=1
          fi
          exit $failed

      - name: Insist this job needs every other job of the workflow
        if: ${{ !cancelled() }}
        run: |
          # The step fetches the workflow file at GITHUB_WORKFLOW_SHA, the
          # commit this run read it from. It compares the file's jobs with this
          # job's `needs` both ways, so that a file read wrongly, giving no
          # jobs or the wrong ones, fails the step.
          set -o pipefail
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          workflow=${workflow%%@*}
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/$workflow?ref=$GITHUB_WORKFLOW_SHA" \
            | yq -r '.jobs | keys | .[]' | grep -vxF "$GITHUB_JOB" | sort > jobs.txt
          jq -r 'keys[]' <<<"$RESULTS" | sort > needed.txt
          echo "jobs of $workflow but this one:"; sed 's/^/  /' jobs.txt
          echo "jobs this one needs:"; sed 's/^/  /' needed.txt
          if ! diff -u needed.txt jobs.txt; then
            echo "::error::$GITHUB_JOB must need every other job of $workflow: a job it does not need gates nothing, however red"
            exit 1
          fi
          echo "$GITHUB_JOB needs every other job of $workflow"

      - name: Insist main requires this job, pinned to the app that reports it - or, in the false-negative control, does not
        if: ${{ !cancelled() }}
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          # The branches endpoint returns a branch's required checks to any
          # token; the protection endpoint would need admin rights.
          check=$(gh api "repos/$GH_REPO/check-runs/$CHECK_RUN_ID" --jq '"\(.app.id) \(.name)"')
          gh api "repos/$GH_REPO/branches/main" \
              --jq '.protection.required_status_checks.checks[] | "\(.app_id) \(.context)"' > required.txt
          echo "this check, as app and name: $check"
          echo "required on main:"; sed 's/^/  /' required.txt
          if [ "$FALSE_NEGATIVE" = true ]; then
            if cut -d' ' -f2- required.txt | grep -qxF "${check#* }"; then
              echo "::error::main requires '${check#* }', which passes on red columns"
              exit 1
            fi
            echo "main does not require the false-negative control's audit"
            exit 0
          fi
          if ! grep -qxF "$check" required.txt; then
            echo "::error::main does not require '${check#* }' from app ${check%% *}: a promotion would wait on a name nothing reports, or merge without this check"
            exit 1
          fi
          echo "main requires this job, pinned to the app that reports it"
