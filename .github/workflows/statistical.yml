name: statistical

# Measures how often main fails. The gate answers "does this tree pass" once,
# and one trial is the right sample for a deterministic question. Races and
# timings are probabilistic, so a single green says almost nothing about
# them. N greens on a fixed tree bound the per-run failure probability: by
# the rule of three, zero failures in N trials puts it below about 3/N with
# 95% confidence. Nights on the same tree add up, and the bound tightens until
# the next promotion changes the tree. The sum is made by hand, since nothing
# here aggregates the nights. The hosted images roll, so successive nights
# sample one tree in slightly different environments. This runs on main, the
# tree meant to be fixed, and not on staging or a promotion PR, so that the
# nights share a tree. A promotion ends the sample on the old tree, and the
# new tree gets its first trials the night after.
#
# This workflow is independent of rigorous: its own schedule, no sequencing,
# its own runners. A run samples whichever main it sees when it starts, and
# pins that SHA for its whole length, so a promotion landing mid-run changes
# nothing here. The summary names the SHA, since the sample is per tree.
#
# The instrument is the runner's own: `locate N` runs the suite N times in one
# process and reports the tests that failed in some repetitions and not
# others. A failure common to every repetition is not an instability, and the
# analysis says "No instabilities detected" over it, though the column is red.
#
# The repetitions share one process rather than each running as a fresh child
# under `--sandbox`, and the TSan column is the reason. TSan reports a race and
# carries on. At exit it ends the process with a status that no test runner
# gives: on macOS an abort, where a racy program exited 134. The test runner
# refuses a child with such a status and stops, so no later repetition starts.
# Under `--sandbox` the first race would therefore end the sample. In one
# process, TSan's status arrives only after all N repetitions. The other two
# columns' sanitizers end the process at the first error, so for them the two
# modes stop at the same point. `exec_args` is shared, so the TSan column
# decides. Sharing one process makes the trials less independent than the rule
# of three assumes, so the bound is optimistic. `--sandbox` would give the
# trials that independence if the test runner counted a refused child as a
# failed trial and carried on.
#
# The columns run without `--check-versioned-output`: the gate has already
# applied it to this tree. `locate N` composes with the flag, comparing once,
# after the last repetition, but that has been verified locally and not here.
# The performance tests are excluded. A performance check is a statistical
# judgement, which fails now and then by design, so it has no place in a
# sample that bounds the rate of failures which should never happen.
#
# The columns are those whose failures are rare by mechanism:
#   - TSan reports only the interleavings that actually execute, so
#     repetition is what widens its coverage.
#   - ASan+UBSan, for timing-dependent memory errors.
#   - MSVC ASan, the configuration in which the sharing violation that
#     rigorous.yml describes was most frequent: 2 runs of 4, against Debug's 3
#     of 38. rigorous.yml says why a recurrence would be evidence against the
#     fix.
# Release, coverage and docs are absent: the optimizer's questions are not
# statistical.
#
# N is an input, so the nightly value and a by-hand sweep with a larger one
# use the same file. The cost is wall-clock, not money, since standard runners
# are free on a public repository. A run is one build plus N suites, which at
# the measured two to four minutes a suite puts N=20 at about an hour a
# column.
on:
  # A minute after the nightly's tick, only so as not to share it. Nothing
  # here depends on which of the two GitHub creates first: the nightly's
  # columns are not a prerequisite, only a neighbour in the queue.
  schedule:
    - cron: '2 1 * * *'
  workflow_dispatch:
    inputs:
      trials:
        description: 'How many times each column runs the suite. Empty for the nightly value.'
        required: false
        type: number

# No concurrency group: a dispatch alongside the scheduled run is a second
# sample, not a superseded one.
jobs:
  # `inputs.trials` is empty on a schedule and on a dispatch that left it
  # blank, so the nightly value is spelt here, once.
  trials:
    name: How many trials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRIALS: ${{ inputs.trials }}
    outputs:
      n: ${{ steps.n.outputs.n }}
    steps:
      - id: n
        run: |
          n=${TRIALS:-20}
          [ "$n" -ge 2 ] 2>/dev/null || { echo "::error::trials must be an integer of at least 2, not '$n'"; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"

  # Warnings are counted, not fatal. A red run here should mean an instability
  # was found, and a build that dies on a warning produces no trials at all.
  # Nothing reaches main unless the gates have built it with warnings fatal.
  statistical:
    needs: trials
    uses: ./.github/workflows/tests.yml
    with:
      # A sample of the tree as it stands, whatever last changed in it.
      needs_testing: ${{ 'true' }}
      merge_into: ''
      warnings_as_errors: false
      exec_args: 'locate;${{ needs.trials.outputs.n }};--exclude-performance'
      suite_timeout_minutes: 200
      job_timeout_minutes: 240
      columns: >-
        [
          {"name": "macOS · Clang · TSan",     "os": "macos-latest",   "configure": "llvm-env-tsan",      "build": "llvm-env-tsan"},
          {"name": "Linux · GCC · ASan+UBSan", "os": "ubuntu-latest",  "configure": "gcc-env-asan-ubsan", "build": "gcc-env-asan-ubsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · ASan",    "os": "windows-latest", "configure": "msvc-asan",          "build": "msvc-asan"}
        ]

  # Writes the sample up as a measurement: the tree, the trials, what each
  # column found, and the bound that zero failures earns. The job runs whether
  # or not the columns were green, since a red column is the finding. It
  # insists on three things, each of which would otherwise pass in silence:
  #   - Every column's artifact is present.
  #   - The suite started and finished N times, counted from the runner's
  #     "Running tests" line as each repetition starts and its "Total Run
  #     Time" line as each ends. This is the one check that tells N trials
  #     from one, and a trial that hung from one that ended.
  #   - A column is clean only if its suite step succeeded and the analysis
  #     found nothing, since the analysis says "No instabilities detected"
  #     over a failure common to every repetition too.
  # A column that is not clean is reported with its counts and the end of its
  # log, whatever the reason.
  summary:
    name: The sample
    needs: [trials, statistical]
    if: ${{ !cancelled() && needs.trials.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      N: ${{ needs.trials.outputs.n }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-drift'
          path: artifacts

      - name: Write the sample up
        run: |
          failed=0
          report=$(mktemp)
          while IFS='|' read -r build name; do
            dir="artifacts/$build-drift"
            log="$dir/run-log/run.log"
            echo "### $name" >> "$report"
            if [ ! -d "$dir" ]; then
              echo "::error::$name: no artifact; the column did not run"; failed=1
              echo "No artifact: the column did not run." >> "$report"
            elif [ ! -f "$log" ]; then
              echo "::error::$name: no run log; the column did not reach the suite"; failed=1
              echo "No run log: the column did not reach the suite." >> "$report"
            else
              outcome=$(cat "$dir/run-log/outcome")
              started=$(grep -c "Running tests" "$log" || true)
              finished=$(grep -c "Total Run Time" "$log" || true)
              if [ "$outcome" = success ] && [ "$started" -eq "$N" ] && [ "$finished" -eq "$N" ] \
                   && grep -q "No instabilities detected" "$log"; then
                echo "No instabilities detected in $N trials." >> "$report"
              else
                echo "::error::$name: suite step $outcome; of $N trials, $started started and $finished finished"; failed=1
                {
                  echo "Suite step: $outcome. Of $N trials, $started started and $finished finished."
                  if [ -f "$dir/run-log/snapshot.txt" ]; then
                    echo "The suite was still running near its timeout: the column's \`Keep the run log\` step prints" \
                         "what it was doing, and the artifact holds it as \`run-log/snapshot.txt\`."
                  fi
                  echo "The end of the log:"
                  echo '```'
                  tail -60 "$log"
                  echo '```'
                } >> "$report"
              fi
            fi
            echo "" >> "$report"
          done <<'COLUMNS'
          llvm-env-tsan|macOS · Clang · TSan
          gcc-env-asan-ubsan|Linux · GCC · ASan+UBSan
          msvc-asan|Windows · MSVC · ASan
          COLUMNS

          {
            echo "## statistical: $N trials per column on \`${GITHUB_SHA:0:9}\`"
            echo ""
            if [ "$failed" -eq 0 ]; then
              bound=$(awk -v n="$N" 'BEGIN{printf "%.1f", 300/n}')
              echo "Zero failures in $N trials on every column: the per-run failure probability is below $bound% at 95% confidence (rule of three)."
            else
              echo "Not every column was clean; no bound is claimed."
            fi
            echo ""
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed
