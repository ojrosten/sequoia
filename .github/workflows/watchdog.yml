name: watchdog

# A scheduled run that never happens leaves nothing behind: no run, no email,
# no red. Each tier's audit lives inside the run it audits, and the
# false-negative control shows that a run which happens can fail, not that
# runs happen. GitHub documents that a queued scheduled run can
# be dropped under load, and a malformed cron expression, or a workflow file
# that no longer parses, never fires. The two look the same.
#
# So this workflow fires on its own schedule and asks the API whether each
# watched schedule produced a run since its most recent tick. The tick is
# read from the watched file's own `cron:` line, so each time is written in
# one place. A run that arrived is reported with how late it came, which is
# the number to watch: the nightly is expected hours after its tick, not
# minutes.
#
# Each watched schedule is checked every day, and a miss is reported once: by
# the first scheduled run of this workflow after the tick, which goes red, and
# the failure email is the alarm. Later runs find that earlier one, say so
# with a link, and stay green on it. Otherwise a weekly tick missed on a
# Saturday would turn every run red until the next Saturday: the same fact
# seven times, and an alarm that repeats itself stops being read.
#
# The watchdog shares the failure mode it watches, a cron, but as an
# independent instance: a day on which both are dropped is still followed by
# a day on which this one fires and finds the gap. The one cause it shares
# outright is GitHub switching off every schedule in a public repository
# after sixty days without activity, this one included. Nothing here can see
# that.
#
# A schedule fires only once its file is on main, so a tick before the
# schedule arrived there is not a miss. Each schedule is compared with the one
# the branch carried at its tick, read from the branch's history by
# scripts/cron_line_at.sh, and a schedule that differed, or was absent, is
# reported as new, with nothing due. A tick that a reschedule moved is not
# watched either, under its old time or its new: the alarm waits for the
# next.
#
# The cron lines are read from the checked-out branch, so a dispatch from a
# branch judges that branch's schedules against the runs that main's produced.
# A control dispatch is unaffected, since it looks for nothing.
#
# It raises an alarm and does nothing more. Dispatching the missing run would
# not stand in for it: a dispatched run is not a `schedule` event, so
# rigorous would not promote.
#
# The control: dispatching with `control: true` moves every window to now, so
# nothing can be found and the job must go red. If it comes back green, it
# cannot see.
on:
  # This tick is twelve hours after those of the nightly and the statistical
  # run, and fifteen after the baseline tightener's. A watched run that GitHub
  # has not created when this one looks is reported missing, so the gap must
  # exceed the watched runs' delay. Over the 20 nights to 2026-10-07, GitHub
  # created the nightly 4h34m to 6h21m after its tick. The minute is off the
  # hour, as rigorous.yml's is.
  schedule:
    - cron: '1 13 * * *'
  workflow_dispatch:
    inputs:
      control:
        description: 'Look for runs since now, so that none can be found and this must go red.'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  watch:
    name: Every watched schedule fired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CONTROL: ${{ inputs.control == true }}
    steps:
      # The whole history, for cron_line_at.sh, without the files of every
      # commit: it fetches the few it reads.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: A run exists since each schedule's most recent tick
        run: |
          now=$(date -u +%s)
          midnight=$(( now - now % 86400 ))
          weekday=$(( (now / 86400 + 4) % 7 ))   # 1970-01-01 was a Thursday; 0 is Sunday, as in cron

          # The epoch second of a cron expression's most recent tick. Only the
          # two shapes in use are understood, `M H * * *` and `M H * * D`. Any
          # other shape is an error here, rather than a window silently
          # mis-sized.
          last_tick() {   # workflow file, cron expression
            read -r minute hour dom month dow <<<"$2"
            [[ $minute =~ ^([0-9]|[1-5][0-9])$ && $hour =~ ^([0-9]|1[0-9]|2[0-3])$ && $dom = '*' && $month = '*' && $dow =~ ^([0-6]|\*)$ ]] \
              || { echo "::error::$1: cannot compute a tick from '$2'" >&2; return 1; }
            tick=$(( midnight + hour * 3600 + minute * 60 ))
            if [ "$dow" = '*' ]; then
              period=86400
            else
              period=$(( 7 * 86400 ))
              tick=$(( tick - ((weekday - dow + 7) % 7) * 86400 ))
            fi
            [ "$tick" -le "$now" ] || tick=$(( tick - period ))
            echo "$tick"
          }

          check() {   # workflow file, what to call it
            cron=$(scripts/cron_line_at.sh ".github/workflows/$1" "$now") || return 1
            [ -n "$cron" ] || { echo "::error::$1 carries no cron line"; return 1; }
            tick=$(last_tick "$1" "$cron") || return 1
            if [ "$CONTROL" = true ]; then tick=$now; fi
            since=$(date -u -d "@$tick" +%Y-%m-%dT%H:%M:%S+00:00)
            cron_at_tick=$(scripts/cron_line_at.sh ".github/workflows/$1" "$tick") || return 1
            if [ "$cron_at_tick" != "$cron" ]; then
              echo "new   $2 was not scheduled '$cron' on $GITHUB_REF_NAME at its tick at $since, so nothing was due"
              return 0
            fi
            run=$(gh run list --workflow "$1" --event schedule --created ">=$since" \
                    --json databaseId,createdAt,conclusion,status --jq 'last // empty') \
              || { echo "::error::could not list the runs of $1"; return 1; }
            if [ -z "$run" ]; then
              if [ "$CONTROL" = true ]; then
                echo "::error::control: no scheduled run of $2 since now, as there cannot be"
                return 1
              fi
              # A miss is reported once. The reporter is the earliest
              # scheduled run of this workflow since the tick, other than this
              # one, that failed and whose log carries the line below for this
              # miss. A failed run alone is not enough: it may have failed for
              # a reason of its own, such as a checkout failure or an API error
              # listing another workflow, and said nothing about the gap. A
              # green run cannot have seen the gap, and a cancelled one did not
              # report it. If no run qualifies, or a log cannot be read, the
              # alarm is left to this run. The list is reversed, oldest first,
              # because gh lists newest first. The script's own source is
              # echoed into the log with $2 and $since unexpanded, so the
              # expanded line matches only a report.
              miss="no scheduled run of $2 since its tick at $since"
              reds=$(gh run list --workflow watchdog.yml --event schedule --created ">=$since" \
                       --json databaseId,createdAt,conclusion \
                       --jq "map(select(.databaseId != $GITHUB_RUN_ID and .conclusion == \"failure\")) | reverse | .[] | \"\(.databaseId) \(.createdAt)\"") \
                || { echo "::error::could not list the runs of watchdog.yml"; return 1; }
              while read -r id created; do
                [ -n "$id" ] || continue
                if gh run view "$id" --log 2>/dev/null | grep -qF "$miss"; then
                  echo "gone  $2 missed its tick at $since; reported on $created by https://github.com/$GH_REPO/actions/runs/$id"
                  return 0
                fi
              done <<<"$reds"
              echo "::error::$miss"
              return 1
            fi
            created=$(jq -r .createdAt <<<"$run")
            minutes_late=$(( ($(date -u -d "$created" +%s) - tick) / 60 ))
            echo "ok    $2 fired $((minutes_late / 60))h$((minutes_late % 60))m after its tick at $since, $(jq -r '.conclusion // .status' <<<"$run"): https://github.com/$GH_REPO/actions/runs/$(jq -r .databaseId <<<"$run")"
          }

          failed=0
          check rigorous.yml "the nightly" || failed=1
          check statistical.yml "the statistical run" || failed=1
          check false-negative.yml "the false-negative control" || failed=1
          check baseline-tightener.yml "the baseline tightener" || failed=1
          exit $failed
