name: docs

# Doxygen is seconds of work and no compilation, so there is no reason to learn
# late that a comment is malformed. It runs in coarse, on every push, as well as in
# rigorous before a promotion - the first for feedback, the second because
# docs/html is committed and public, so a defect here ships.
#
# Built into a temporary directory and discarded: regenerating the committed render
# would produce 7710 files of drift and answer a different question from the one
# being asked, which is whether the documentation is well-formed.
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''

jobs:
  doxygen:
    name: Docs · Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen
          doxygen --version

      # The Doxyfile's INPUT is relative to its own directory, so doxygen runs from
      # there; the overrides go in on stdin rather than by editing the file, so what
      # is tested is the committed configuration.
      #
      # WARN_IF_UNDOCUMENTED is off here. Per-file documentation is openly in
      # progress and those notices numbered 6569 against 55 real defects, so leaving
      # them on would bury the signal in the thing everyone already knows.
      - name: Generate, into a directory nobody keeps
        working-directory: docs/config
        run: |
          out="$RUNNER_TEMP/doxygen"
          mkdir -p "$out"
          { cat Doxyfile
            echo "OUTPUT_DIRECTORY=$out"
            echo "WARN_LOGFILE=$out/warnings.txt"
            echo "WARN_IF_UNDOCUMENTED=NO"
            echo "QUIET=YES"
          } | doxygen -
          echo "DOXY_LOG=$out/warnings.txt" >> "$GITHUB_ENV"

      # Gating on zero, which is the only baseline that cannot drift. It was 55
      # before the documentation was repaired and the scope corrected; a threshold
      # of "no more than 55" would have been a number nobody could later justify,
      # and would have quietly permitted the 56th.
      #
      # Undocumented entities remain excluded above - 6569 of them, with per-file
      # documentation openly in progress. This gate is about documentation which is
      # *wrong*, not documentation which is absent: absence is schedulable, error is
      # a defect.
      - name: Fail on any documentation defect
        if: always()
        run: |
          log="$DOXY_LOG"
          [ -f "$log" ] || { echo "::error::doxygen produced no warning log"; exit 1; }
          defects=$(grep -c 'warning' "$log" || true)
          {
            echo "### Doxygen: $defects defect(s)"
            if [ "$defects" -gt 0 ]; then
              echo '```'
              sed 's#.*/sequoia/##' "$log" | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$defects" -gt 0 ]; then
            echo "::error title=Doxygen::$defects documentation defect(s)"
            sed 's#.*/sequoia/##' "$log" | head -20
            exit 1
          fi
          echo "No documentation defects."

      - name: Upload the warning log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-warnings-${{ github.job }}
          path: ${{ env.DOXY_LOG }}
          if-no-files-found: warn
