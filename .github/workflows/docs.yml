name: docs

# Called by coarse and by rigorous. docs/html is committed and published, so a
# defect here ships.
#
# Built into a temporary directory and discarded: regenerating the committed render
# would answer a different question from the one asked here, which is whether the
# documentation is well-formed.
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''

jobs:
  doxygen:
    name: Docs · Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      # USE_MATHJAX is off, so formulas go through LaTeX and then Ghostscript.
      # Missing either leaves every formula silently wrong, which is the failure
      # this job exists to catch.
      - name: Install doxygen
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y doxygen texlive-latex-base texlive-latex-extra ghostscript
          doxygen --version

      # The Doxyfile's INPUT is relative to its own directory, so doxygen runs from
      # there; the overrides go in on stdin rather than by editing the file, so what
      # is tested is the committed configuration.
      #
      # WARN_IF_UNDOCUMENTED is off: per-file documentation is in progress, and
      # those notices outnumber real defects by three orders of magnitude.
      - name: Generate, into a directory nobody keeps
        working-directory: docs/config
        run: |
          out="$RUNNER_TEMP/doxygen"
          mkdir -p "$out"
          # Recorded before doxygen runs, not after. If doxygen fails, the log it
          # wrote is the only account of why, and a variable set on the next line
          # would never be set at all - which is exactly how a failure on
          # modules-native reported "doxygen produced no warning log" instead.
          echo "DOXY_LOG=$out/warnings.txt" >> "$GITHUB_ENV"
          { cat Doxyfile
            echo "OUTPUT_DIRECTORY=$out"
            echo "WARN_LOGFILE=$out/warnings.txt"
            echo "WARN_IF_UNDOCUMENTED=NO"
            echo "QUIET=YES"
          } | doxygen -

      # Zero, which is the only threshold that cannot drift. The gate is on
      # documentation which is wrong, not documentation which is absent - absence
      # is excluded above.
      - name: Fail on any documentation defect
        if: always()
        run: |
          log="$DOXY_LOG"
          [ -f "$log" ] || { echo "::error::doxygen produced no warning log"; exit 1; }
          defects=$(grep -cE 'warning|error' "$log" || true)
          {
            echo "### Doxygen: $defects defect(s)"
            if [ "$defects" -gt 0 ]; then
              echo '```'
              sed -n '1,40s#.*/sequoia/##p' "$log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$defects" -gt 0 ]; then
            echo "::error title=Doxygen::$defects documentation defect(s)"
            sed -n '1,20s#.*/sequoia/##p' "$log"
            exit 1
          fi
          echo "No documentation defects."

      - name: Upload the warning log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-warnings-${{ github.job }}
          path: ${{ env.DOXY_LOG }}
          if-no-files-found: warn
