name: docs

# Called by coarse and by rigorous. docs/html is committed and published, so a
# defect here ships.
#
# Both callers report this job as `docs / Docs · Doxygen`, and each decides
# against its own base: coarse against staging, rigorous against the pull
# request's base. On a PR into main from a branch other than staging the two can
# disagree, and the check shows whichever reported last.
#
# Built into a temporary directory and discarded: regenerating the committed render
# would answer a different question from the one asked here, which is whether the
# documentation is well-formed.
on:
  workflow_call:
    inputs:
      needs_testing:
        description: 'Whether the change touches anything doxygen reads: `true` or `false`, from scope.yml. Anything else fails the job.'
        required: true
        type: string

jobs:
  doxygen:
    name: Docs · Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The job always runs, since the audits of coarse and rigorous insist on its
      # success. Only the steps below depend on the change; scope.yml says
      # why. As in tests.yml, the conditions test for `true`, so this step insists
      # any other answer is exactly `false`: an empty one fails the job rather than
      # passing it unchecked.
      - name: Nothing to document
        if: inputs.needs_testing != 'true'
        env:
          ANSWER: ${{ inputs.needs_testing }}
        run: |
          if [ "$ANSWER" != false ]; then
            echo "::error::needs_testing is '$ANSWER', neither true nor false: scope.yml's answer did not arrive"
            exit 1
          fi
          echo "Nothing to document; the scope job's summary says why."

      # USE_MATHJAX is off, so formulas go through LaTeX and then Ghostscript.
      # Missing either leaves every formula silently wrong, which is the failure
      # this job exists to catch.
      - name: Install doxygen
        if: inputs.needs_testing == 'true'
        run: |
          # The hosted image ships vendor repositories - Chrome and Microsoft - which
          # nothing here installs from. A bad index served by one of them fails the
          # update, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-base texlive-latex-extra ghostscript
          # doxygen itself comes from its release, not apt: noble's 1.9.8 cannot write a
          # C++20 module's page under CREATE_SUBDIRS (it prefixes `module_` to a path that
          # already carries the hash directory, and exits), so the gate could never pass
          # on a modules build. Pinned to the version used for local documentation checks,
          # so the two agree on what is a defect; the checksum is the release tarball's.
          # The last line insists the doxygen on PATH is the one installed, or a distro
          # copy could shadow it and the gate would pass on the wrong version until a
          # modules build arrived.
          version=1.15.0
          sha256=0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1
          cd "$RUNNER_TEMP"
          curl -fsSL -o doxygen.tgz "https://github.com/doxygen/doxygen/releases/download/Release_${version//./_}/doxygen-$version.linux.bin.tar.gz"
          echo "$sha256  doxygen.tgz" | sha256sum -c -
          tar xzf doxygen.tgz "doxygen-$version/bin/doxygen"
          sudo install "doxygen-$version/bin/doxygen" /usr/local/bin/doxygen
          # The release binary prints its commit after the version; Homebrew's does not.
          [ "$(doxygen --version | cut -d' ' -f1)" = "$version" ] || { echo "::error::doxygen on PATH is $(doxygen --version), not $version"; exit 1; }

      # The Doxyfile's INPUT is relative to its own directory, so doxygen runs from
      # there; the overrides go in on stdin rather than by editing the file, so what
      # is tested is the committed configuration.
      #
      # WARN_IF_UNDOCUMENTED is off: per-file documentation is in progress, and
      # those notices outnumber real defects by three orders of magnitude.
      - name: Generate, into a directory nobody keeps
        if: inputs.needs_testing == 'true'
        working-directory: docs/config
        run: |
          out="$RUNNER_TEMP/doxygen"
          mkdir -p "$out"
          # Recorded before doxygen runs, not after. If doxygen fails, the log it
          # wrote is the only account of why, and a variable set on the next line
          # would never be set at all - which is exactly how a failure on
          # modules-native reported "doxygen produced no warning log" instead.
          echo "DOXY_LOG=$out/warnings.txt" >> "$GITHUB_ENV"
          { cat Doxyfile
            echo "OUTPUT_DIRECTORY=$out"
            echo "WARN_LOGFILE=$out/warnings.txt"
            echo "WARN_IF_UNDOCUMENTED=NO"
            echo "QUIET=YES"
          } | doxygen -

      # Zero, which is the only threshold that cannot drift. The gate is on
      # documentation which is wrong, not documentation which is absent - absence
      # is excluded above.
      - name: Fail on any documentation defect
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          log="$DOXY_LOG"
          [ -f "$log" ] || { echo "::error::doxygen produced no warning log"; exit 1; }
          defects=$(grep -cE 'warning|error' "$log" || true)
          {
            echo "### Doxygen: $defects defect(s)"
            if [ "$defects" -gt 0 ]; then
              echo '```'
              sed -n '1,40s#.*/sequoia/##p' "$log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$defects" -gt 0 ]; then
            echo "::error title=Doxygen::$defects documentation defect(s)"
            sed -n '1,20s#.*/sequoia/##p' "$log"
            exit 1
          fi
          echo "No documentation defects."

      - name: Upload the warning log
        if: ${{ always() && inputs.needs_testing == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-warnings-${{ github.job }}
          path: ${{ env.DOXY_LOG }}
          if-no-files-found: warn
