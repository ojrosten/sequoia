name: docs

# Called by coarse and by rigorous. docs/html is committed and published, so
# a defect here ships.
#
# Both callers report this job as `docs / Docs · Doxygen`. Each decides
# against its own base whether there is anything to document: coarse against
# staging, rigorous against the pull request's base. On a PR into main from a
# branch other than staging the two can disagree, and the check shows
# whichever reported last.
#
# The job asks whether the documentation is well-formed, so it builds into a
# temporary directory and discards the result. Regenerating the committed
# render would answer a different question.
on:
  workflow_call:
    inputs:
      needs_testing:
        description: 'Whether the change touches anything doxygen reads: `true` or `false`, from scope.yml. Anything else fails the job.'
        required: true
        type: string

jobs:
  doxygen:
    name: Docs · Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The job runs whatever the change, since the audits of coarse and
      # rigorous insist on its success whenever they call it. Only the steps
      # below depend on the change; scope.yml says why. As in tests.yml, the
      # conditions test for `true`, so this step insists any other answer is
      # exactly `false`. An empty answer fails the job rather than passing it
      # unchecked.
      - name: Nothing to document
        if: inputs.needs_testing != 'true'
        env:
          ANSWER: ${{ inputs.needs_testing }}
        run: |
          if [ "$ANSWER" != false ]; then
            echo "::error::needs_testing is '$ANSWER', neither true nor false: scope.yml's answer did not arrive"
            exit 1
          fi
          echo "Nothing to document; the scope job's summary says why."

      # USE_MATHJAX is off, so formulas go through LaTeX and then Ghostscript.
      # Missing either leaves every formula silently wrong, which is the
      # failure this job exists to catch.
      #
      # This step's limit makes a slow mirror fail the step by name, rather
      # than run on until the job's limit cancels the job. The job's limit
      # exceeds the step's by more than checkout and generation take, about a
      # minute.
      - name: Install doxygen
        if: inputs.needs_testing == 'true'
        timeout-minutes: 25
        run: |
          # The hosted image ships Chrome's and Microsoft's apt repositories,
          # which nothing here installs from. A bad index from either fails
          # `apt-get update`, and with it the job.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Quiet rather than silent, so that a slow index shows which
          # repository it is. scripts/retry.sh retries an apt command that
          # fails or hangs, as in tests.yml's "Install the toolchain (Linux)",
          # with limits that leave room for every retry within this step.
          sudo scripts/retry.sh 3 180 -- apt-get update -q
          # Formulas need latex, dvips, gs and amssymb; these packages provide
          # them without their recommendations.
          sudo scripts/retry.sh 2 420 -- apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra ghostscript
          # doxygen itself comes from its release, not apt. noble's 1.9.8
          # cannot write a C++20 module's page under CREATE_SUBDIRS: it
          # prefixes `module_` to a path that already carries the hash
          # directory, and exits. So the gate could never pass on a modules
          # build. The version is pinned to the one used for local
          # documentation checks, so that the two agree on what is a defect;
          # the checksum is the release tarball's. The last line insists the
          # doxygen on PATH is the one installed. Otherwise a distro copy could
          # shadow it, and the gate would pass on the wrong version until a
          # modules build arrived.
          version=1.15.0
          sha256=0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1
          cd "$RUNNER_TEMP"
          curl -fsSL -o doxygen.tgz "https://github.com/doxygen/doxygen/releases/download/Release_${version//./_}/doxygen-$version.linux.bin.tar.gz"
          echo "$sha256  doxygen.tgz" | sha256sum -c -
          tar xzf doxygen.tgz "doxygen-$version/bin/doxygen"
          sudo install "doxygen-$version/bin/doxygen" /usr/local/bin/doxygen
          # The release binary prints its commit after the version; Homebrew's
          # does not.
          [ "$(doxygen --version | cut -d' ' -f1)" = "$version" ] || { echo "::error::doxygen on PATH is $(doxygen --version), not $version"; exit 1; }

      # The Doxyfile's INPUT is relative to its own directory, so doxygen runs
      # from there. The overrides go in on stdin rather than by editing the
      # file, so that what is tested is the committed configuration.
      #
      # WARN_IF_UNDOCUMENTED is off: per-file documentation is in progress, and
      # those notices outnumber real defects by three orders of magnitude.
      - name: Generate, into a directory nobody keeps
        if: inputs.needs_testing == 'true'
        working-directory: docs/config
        run: |
          out="$RUNNER_TEMP/doxygen"
          mkdir -p "$out"
          # Recorded before doxygen runs, not after. If doxygen fails, the log
          # it wrote is the only account of why, and a variable set after
          # doxygen would never be set. The step that reads the log would then
          # report that doxygen did not run, rather than the defects it found.
          echo "DOXY_LOG=$out/warnings.txt" >> "$GITHUB_ENV"
          { cat Doxyfile
            echo "OUTPUT_DIRECTORY=$out"
            echo "WARN_LOGFILE=$out/warnings.txt"
            echo "WARN_IF_UNDOCUMENTED=NO"
            echo "QUIET=YES"
          } | doxygen -

      # The threshold is zero defects, the only threshold that cannot drift.
      # The gate is on documentation that is wrong, not documentation that is
      # absent, which WARN_IF_UNDOCUMENTED excludes above.
      - name: Fail on any documentation defect
        if: ${{ always() && inputs.needs_testing == 'true' }}
        run: |
          log="$DOXY_LOG"
          [ -n "$log" ] || { echo "::error::doxygen did not run: an earlier step failed, or the run was cancelled"; exit 1; }
          [ -f "$log" ] || { echo "::error::doxygen produced no warning log"; exit 1; }
          defects=$(grep -cE 'warning|error' "$log" || true)
          lines=$(wc -l < "$log")
          # Prints the first `n` lines of the log, with paths relative to the
          # checkout, and a count of the lines left out.
          show() {
            sed -n "1,$1{s#$GITHUB_WORKSPACE/##g;p;}" "$log"
            [ "$lines" -le "$1" ] || echo "... and $((lines - $1)) more line(s) in the uploaded log"
          }
          {
            echo "### Doxygen: $defects defect(s)"
            if [ "$defects" -gt 0 ]; then
              echo '```'
              show 40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$defects" -gt 0 ]; then
            echo "::error title=Doxygen::$defects documentation defect(s)"
            show 20
            exit 1
          fi
          echo "No documentation defects."

      - name: Upload the warning log
        if: ${{ always() && inputs.needs_testing == 'true' && env.DOXY_LOG != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-warnings-${{ github.job }}
          path: ${{ env.DOXY_LOG }}
          if-no-files-found: warn
