name: nightly

# A race detector is probabilistic and each run is an independent trial, so a
# schedule buys repetition, which a promotion gate cannot. Rigorous also runs TSan;
# that asks whether a change is promotable, this asks whether anything has crept in.
#
# Windows is here to accumulate trials against an intermittent hang - roadmap item
# 128 - rather than for breadth.
#
# A scheduled workflow always fires from the default branch, so testing staging
# requires asking for it: hence `ref`.
#
# The Windows column runs the suite with `--exclude-performance`. It is only the
# timing assertions a hosted runner cannot hold - TestRunnerPerformanceTest asserts
# 60ms +- 35 for eight 25ms sleeps run concurrently, and this runner returned 196ms
# and then 603ms for the same commit - so excluding those buys back everything else.
#
# A column's `exec_args` replaces the tier's rather than adding to them, so this one
# deliberately does not carry `--check-versioned-output`: the committed `_msvc` forks
# of the diagnostics output are stale, and gating on their drift before an MSVC run
# has ever refreshed them would block the gate on a known backlog. The Linux column
# still carries it, so drift is caught. Give MSVC the flag once the forks it writes
# have been reviewed and committed.
#
# The TSan column is Clang, for the reason set out at length in rigorous.yml: under
# GCC, `sequoia::execution::par` is libstdc++'s TBB-backed `std::execution::par` and
# TSan instruments TBB rather than us, whereas under Clang `par` is a stand-in and
# `accelerate` runs sequoia's own thread pool. Keep the two tiers agreeing: a
# nightly that instruments a different implementation from the gate is measuring
# something the gate never checks.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test'
        required: false
        type: string
        default: 'staging'

jobs:
  nightly:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref || 'staging' }}
      warnings_as_errors: false
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · Clang · TSan",   "os": "ubuntu-latest",  "configure": "llvm-env-tsan", "build": "llvm-env-tsan", "cc": "clang", "cxx": "clang++"},
          {"name": "Windows · MSVC · Debug", "os": "windows-latest", "configure": "msvc",         "build": "msvc", "exec_args": "--exclude-performance"}
        ]
