name: nightly

# A race detector is probabilistic and each run is an independent trial, so a
# schedule buys repetition, which a promotion gate cannot. Rigorous also runs TSan;
# that asks whether a change is promotable, this asks whether anything has crept in.
#
# Windows is here to accumulate trials against an intermittent hang - roadmap item
# 128 - rather than for breadth.
#
# A scheduled workflow always fires from the default branch, so testing staging
# requires asking for it: hence `ref`.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test'
        required: false
        type: string
        default: 'staging'

jobs:
  nightly:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref || 'staging' }}
      warnings_as_errors: false
      exec_args: '--check-versioned-output'
      columns: >-
        [
          {"name": "Linux · GCC · TSan",     "os": "ubuntu-latest",  "configure": "gcc-env-tsan", "build": "gcc-env-tsan", "cc": "gcc-15", "cxx": "g++-15"},
          {"name": "Windows · MSVC · Debug", "os": "windows-latest", "configure": "msvc",         "build": "msvc"}
        ]
